<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Woodcutter</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#1a1a2e;font-family:sans-serif;color:#eee;overflow:hidden;height:100vh;display:flex;justify-content:center;align-items:center}
        .game{width:100%;max-width:430px;height:100vh;background:#1a1a2e;display:flex;flex-direction:column}
        .header{background:#16213e;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #2a2a4a}
        .header .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#e2a03f,#c47f2a);display:flex;align-items:center;justify-content:center;font-size:20px}
        .header .title{font-weight:600;font-size:15px}.header .sub{font-size:11px;color:#aaa}
        .area{flex:1;padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
        .res{display:flex;gap:8px}
        .res-card{flex:1;background:#16213e;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;border:1px solid #2a2a4a}
        .res-icon{font-size:22px}
        .res-val{font-size:18px;font-weight:700}.res-label{font-size:10px;color:#aaa}
        .tree-box{background:#16213e;border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;border:1px solid #2a2a4a}
        .tree{position:relative;width:240px;height:320px;cursor:pointer}
        .tree:active{transform:scale(.96)}
        .tree svg{width:100%;height:100%;pointer-events:none}
        .axe{position:absolute;right:8%;top:42%;font-size:40px;pointer-events:none;z-index:6}
        .badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.8);color:#ffd700;padding:3px 8px;border-radius:12px;font-size:12px;font-weight:700;border:1px solid #ffd700}
        .hp-outer{width:100%;background:#2a2a3a;border-radius:8px;height:14px;overflow:hidden;border:1px solid #2a2a4a}
        .hp-inner{height:100%;border-radius:8px;transition:width .3s}
        .hp-inner.high{background:linear-gradient(90deg,#4caf84,#81c784)}
        .hp-inner.med{background:linear-gradient(90deg,#f39c12,#e67e22)}
        .hp-inner.low{background:linear-gradient(90deg,#e74c3c,#c0392b)}
        .hp-text{font-size:12px;text-align:center;font-weight:600}
        .combo-text{font-size:11px;color:#aaa;text-align:center;min-height:16px}
        .combo-fire{color:#ff6b35}
        .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
        .btn{padding:12px 8px;border-radius:12px;border:none;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;min-height:44px}
        .btn:active{transform:scale(.95)}
        .btn-shop{background:#16213e;color:#eee;border:1px solid #2a2a4a}
        .btn-lb{background:linear-gradient(135deg,#ffd700,#ffaa00);color:#000}
        .btn-skins{background:linear-gradient(135deg,#4caf50,#2d6b2d);color:#fff}
        .btn-trade{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff}
        .passive{text-align:center;font-size:11px;color:#aaa}
        .popup-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);z-index:9999;display:flex;align-items:flex-end;justify-content:center}
        .popup{background:#16213e;border-radius:16px 16px 0 0;width:100%;max-width:430px;max-height:85vh;overflow-y:auto;padding:16px 12px 30px;border:1px solid #2a2a4a}
        .popup h3{color:#eee;font-size:18px;margin-bottom:12px;text-align:center}
        .popup-close{width:100%;padding:14px;border-radius:12px;border:1px solid #2a2a4a;background:#16213e;color:#eee;font-size:15px;font-weight:600;margin-top:8px}
        .shop-cat{color:#e2a03f;font-size:13px;font-weight:700;margin:12px 0 6px;padding-bottom:4px;border-bottom:1px solid #2a2a4a}
        .shop-item{background:#1e2a3a;border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;border:1px solid #2a2a4a;gap:8px}
        .shop-name{font-weight:600;font-size:14px}.shop-desc{font-size:11px;color:#aaa}.shop-lvl{font-size:10px;color:#e2a03f}
        .shop-buy{padding:8px 14px;border-radius:10px;border:none;font-weight:600;font-size:12px;cursor:pointer}
        .shop-buy.wood{background:#4caf84;color:#fff}.shop-buy.crystal{background:#a78bfa;color:#fff}
        .shop-buy:disabled{opacity:.4}
        .skin-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
        .skin-card{background:#1e2a3a;border-radius:12px;padding:10px;text-align:center;border:2px solid #2a2a4a;cursor:pointer}
        .skin-card.active{border-color:#ffd700}
        .skin-emoji{font-size:32px}.skin-name{font-size:11px;font-weight:600}.skin-price{font-size:10px;color:#e2a03f;margin-top:3px}
        .trade-item{background:#1e2a3a;border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid #2a2a4a}
        .trade-header{display:flex;justify-content:space-between;margin-bottom:6px}
        .trade-seller{font-weight:600;font-size:13px}.trade-id{font-size:10px;color:#aaa}.trade-price{color:#e2a03f;font-weight:700}
        .trade-tree{font-size:20px;text-align:center;margin:6px 0}
        .trade-btn{width:100%;padding:10px;border-radius:10px;border:none;color:#fff;font-weight:600;cursor:pointer;margin-top:6px}
        .trade-btn.buy{background:#4caf84}.trade-btn.cancel{background:#e74c3c}.trade-btn:disabled{opacity:.4}
        .lb-table{width:100%;border-collapse:collapse}
        .lb-table th{color:#aaa;font-size:10px;padding:8px 6px;text-align:left;border-bottom:1px solid #2a2a4a}
        .lb-table td{color:#fff;font-size:12px;padding:8px 6px;border-bottom:1px solid #2a2a4a}
        .lb-rank{font-weight:700;font-size:14px;text-align:center;width:35px}
        .lb-gold{color:#ffd700}.lb-silver{color:#c0c0c0}.lb-bronze{color:#cd7f32}
        .lb-me{background:rgba(226,160,63,.15)}
    </style>
</head>
<body>
<div class="game">
    <div class="header">
        <div class="avatar" id="av">🪓</div>
        <div><div class="title">Woodcutter</div><div class="sub" id="nameDisplay">...</div></div>
    </div>
    <div class="area">
        <div class="res">
            <div class="res-card"><span class="res-icon">🌲</span><div><div class="res-val" id="woodVal">0</div><div class="res-label">Древесина</div></div></div>
            <div class="res-card"><span class="res-icon">💎</span><div><div class="res-val" id="crystalVal">0</div><div class="res-label">Кристаллы</div></div></div>
        </div>
        <div class="tree-box">
            <div class="tree" id="tree">
                <div class="badge" id="lvlBadge">🌲 Ур. 1</div>
                <div class="axe" id="axe">🪓</div>
                <svg viewBox="0 0 260 360"><ellipse cx="130" cy="330" rx="110" ry="20" fill="#3d2b1f" opacity="0.6"/><rect x="115" y="180" width="30" height="152" rx="7" fill="#6b4226" id="trunk"/><ellipse cx="130" cy="130" rx="85" ry="75" fill="#3a7d3a" id="c1"/><ellipse cx="130" cy="85" rx="70" ry="65" fill="#4caf50" id="c2"/><ellipse cx="130" cy="45" rx="55" ry="55" fill="#66bb6a" id="c3"/></svg>
            </div>
            <div class="hp-outer"><div class="hp-inner high" id="hpBar" style="width:100%"></div></div>
            <div class="hp-text" id="hpText">15 / 15 HP</div>
            <div class="combo-text" id="comboText">Нажимай на дерево! 🪓</div>
        </div>
        <div class="btn-row">
            <button class="btn btn-shop" id="btnShop">🏪 Магазин</button>
            <button class="btn btn-lb" id="btnLB">🏆 Рейтинг</button>
            <button class="btn btn-skins" id="btnSkins">🎄 Скины</button>
            <button class="btn btn-trade" id="btnTrade">💱 Торги</button>
        </div>
        <div class="passive" id="passiveInfo"></div>
    </div>
</div>

<script>
const API='https://delay.pythonanywhere.com/api';
const tg=window.Telegram.WebApp;tg.expand();tg.ready();
const u=tg.initDataUnsafe?.user;
const uid=u?'WC'+String(u.id).slice(-6).padStart(6,'0'):'WC'+Math.random().toString(36).substr(2,6).toUpperCase();
const pname=u?(u.first_name+(u.last_name?' '+u.last_name:'')):'Игрок';
const SK='wc_'+uid;
console.log('Woodcutter ID:',uid);
if(u?.photo_url){document.getElementById('av').style.backgroundImage=`url(${u.photo_url})`;document.getElementById('av').textContent='';}

async function api(e,m='GET',b=null){try{const o={method:m,headers:{'Content-Type':'application/json'}};if(b)o.body=JSON.stringify(b);const r=await fetch(API+e,o);return await r.json()}catch(e){return{success:false}}}
async function sLB(){await api('/leaderboard/update','POST',{user_id:uid,name:pname,wood:P.wood,crystals:P.crystals,treeLevel:P.treeLevel,totalTrees:P.totalTrees})}
async function lLB(){const r=await api('/leaderboard');return r.success?r.players:[]}
async function lTrades(){const r=await api('/trades?user_id='+uid);return r.success?r.trades:[]}
async function cTrade(sid,pr,tid){const s=skins.find(x=>x.id===sid);return await api('/trades/create','POST',{sellerId:uid,sellerName:pname,targetId:tid||null,skinId:sid,price:pr,skinName:s.name,skinEmoji:s.emoji})}
async function bTrade(tid){return await api('/trades/buy','POST',{trade_id:tid,buyer_id:uid})}
async function xTrade(tid){return await api('/trades/cancel','POST',{trade_id:tid,user_id:uid})}

const skins=[{id:'default',name:'Обычное',emoji:'🌳',c:['#3a7d3a','#4caf50','#66bb6a'],price:0,cur:'free'},{id:'autumn',name:'Осеннее',emoji:'🍂',c:['#c47f2a','#d4943a','#e2a03f'],price:500,cur:'crystals'},{id:'cherry',name:'Сакура',emoji:'🌸',c:['#ff9ec4','#ffbdd4','#ffd1e4'],price:800,cur:'crystals'},{id:'crystal',name:'Кристальное',emoji:'💎',c:['#a78bfa','#c4b5fd','#ddd6fe'],price:1200,cur:'crystals'},{id:'golden',name:'Золотое',emoji:'✨',c:['#d4a017','#e6c22a','#f0d840'],price:2000,cur:'crystals'},{id:'inferno',name:'Огненное',emoji:'🔥',c:['#cc3300','#e64d00','#ff6600'],price:3500,cur:'crystals'},{id:'ocean',name:'Океанское',emoji:'🌊',c:['#0066cc','#0088e6','#00aaff'],price:10,cur:'stars'},{id:'void',name:'Бездны',emoji:'🕳️',c:['#1a0033','#2d004d','#400066'],price:25,cur:'stars'},{id:'rainbow',name:'Радужное',emoji:'🌈',c:['#ff0000','#ff7700','#ffff00'],price:50,cur:'stars'}];

let P={name:pname,userId:uid,wood:0,crystals:0,stars:0,axePower:1,crystalBonus:1,autoWood:0,critChance:0,critMultiplier:2,crystalToWoodRate:0,comboBonus:0,combo:0,comboMultiplier:1,treeHP:15,maxTreeHP:15,totalTrees:0,treeLevel:1,activeSkin:'default',ownedSkins:['default'],upgrades:{}};
try{const s=localStorage.getItem(SK);if(s)Object.assign(P,JSON.parse(s))}catch(e){}
P.name=pname;P.userId=uid;
if(!P.maxTreeHP||P.maxTreeHP<10){P.maxTreeHP=15;P.treeHP=15}
if(!P.ownedSkins||!P.ownedSkins.length)P.ownedSkins=['default'];
if(!P.activeSkin)P.activeSkin='default';
if(!P.upgrades)P.upgrades={};
['axe','strength','crystal1','crystal2','auto1','auto2','auto3','auto4','crit1','crit2','crystalToWood1','crystalToWood2','crystalAuto1','crystalAuto2','critDamage1','comboBoost1'].forEach(id=>{if(!(id in P.upgrades))P.upgrades[id]=0});

function save(){localStorage.setItem(SK,JSON.stringify(P))}
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':Math.floor(n).toString()}
function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}

function updUI(){
    document.getElementById('woodVal').textContent=fmt(P.wood);
    document.getElementById('crystalVal').textContent=fmt(P.crystals);
    const hpPct=Math.max(0,(P.treeHP/Math.max(1,P.maxTreeHP))*100);
    const hpb=document.getElementById('hpBar');hpb.style.width=hpPct+'%';
    hpb.className='hp-inner '+(hpPct>60?'high':hpPct>30?'med':'low');
    document.getElementById('hpText').textContent=`${fmt(Math.max(0,P.treeHP))} / ${fmt(P.maxTreeHP)} HP`;
    document.getElementById('lvlBadge').textContent=`🌲 Ур. ${P.treeLevel}`;
    document.getElementById('nameDisplay').textContent=P.name;
    document.getElementById('comboText').innerHTML=P.combo>1?`<span class="combo-fire">🔥 Комбо x${P.combo}</span>`:'Нажимай на дерево! 🪓';
    document.getElementById('passiveInfo').textContent=P.autoWood>0?`⏳ +${P.autoWood} 🌲/сек`:'';
    const skin=skins.find(s=>s.id===P.activeSkin)||skins[0];
    const colors=hpPct>60?skin.c:(hpPct>30?['#e67e22','#f39c12','#f1c40f']:['#c0392b','#e74c3c','#ff6b6b']);
    document.getElementById('c1').setAttribute('fill',colors[0]);
    document.getElementById('c2').setAttribute('fill',colors[1]);
    document.getElementById('c3').setAttribute('fill',colors[2]);
}

const shop=[{id:'axe',name:'🪓 Топор получше',desc:'+1 к силе',base:10,mult:1.5,cur:'wood',cost(){return Math.floor(this.base*Math.pow(this.mult,P.upgrades[this.id]||0))},eff(){P.axePower++;P.upgrades[this.id]=(P.upgrades[this.id]||0)+1}},{id:'strength',name:'💪 Силашка',desc:'+2 к силе',base:25,mult:1.6,cur:'wood',cost(){return Math.floor(this.base*Math.pow(this.mult,P.upgrades[this.id]||0))},eff(){P.axePower+=2;P.upgrades[this.id]=(P.upgrades[this.id]||0)+1}},{id:'auto1',name:'🌱 Саженец',desc:'+1/с авто',base:50,mult:1.4,cur:'wood',cost(){return Math.floor(this.base*Math.pow(this.mult,P.upgrades[this.id]||0))},eff(){P.autoWood++;P.upgrades[this.id]=(P.upgrades[this.id]||0)+1}},{id:'crystal1',name:'💎 Кристальный глаз',desc:'+1💎 за сруб',base:5,mult:2,cur:'crystals',cost(){return Math.floor(this.base*Math.pow(this.mult,P.upgrades[this.id]||0))},eff(){P.crystalBonus++;P.upgrades[this.id]=(P.upgrades[this.id]||0)+1}}];

function popup(title,html){
    const bg=document.createElement('div');bg.className='popup-bg';
    bg.innerHTML=`<div class="popup"><h3>${title}</h3>${html}<button class="popup-close">Закрыть</button></div>`;
    bg.querySelector('button').addEventListener('click',()=>bg.remove());
    bg.addEventListener('click',function(e){if(e.target===bg)bg.remove()});
    document.body.appendChild(bg);return bg;
}

function showShop(){
    let html='';let cat='';
    shop.forEach(item=>{
        const cn=item.cur==='wood'?'🌲 За древесину':'💎 За кристаллы';
        if(cat!==cn){cat=cn;html+=`<div class="shop-cat">${cn}</div>`}
        const cost=item.cost(),afford=item.cur==='wood'?P.wood>=cost:P.crystals>=cost;
        html+=`<div class="shop-item"><div><span class="shop-name">${item.name}</span><br><span class="shop-desc">${item.desc}</span>${(P.upgrades[item.id]||0)>0?`<br><span class="shop-lvl">Ур. ${P.upgrades[item.id]}</span>`:''}</div><button class="shop-buy ${item.cur==='wood'?'wood':'crystal'}" data-id="${item.id}" ${!afford?'disabled':''}>${fmt(cost)} ${item.cur==='wood'?'🌲':'💎'}</button></div>`;
    });
    const bg=popup('🏪 Магазин',html);
    bg.querySelectorAll('button[data-id]').forEach(b=>b.addEventListener('click',function(){
        const item=shop.find(i=>i.id===this.dataset.id);if(!item)return;
        const cost=item.cost();
        if(item.cur==='wood'&&P.wood<cost)return;
        if(item.cur==='crystals'&&P.crystals<cost)return;
        if(item.cur==='wood')P.wood-=cost;else P.crystals-=cost;
        item.eff();updUI();save();sLB();bg.remove();showShop();
    }));
}

function showSkins(){
    let html='<div class="skin-grid">';
    skins.forEach(skin=>{
        const owned=P.ownedSkins.includes(skin.id),active=P.activeSkin===skin.id;
        let ph='';
        if(!owned){if(skin.cur==='free')ph='<div class="skin-price">Бесплатно</div>';else if(skin.cur==='crystals')ph=`<div class="skin-price">🔒 ${fmt(skin.price)} 💎</div>`;else ph=`<div class="skin-price" style="color:#ffd700">⭐ ${skin.price} звёзд</div>`}
        html+=`<div class="skin-card ${active?'active':''}" data-skin="${skin.id}"><span class="skin-emoji">${skin.emoji}</span><div class="skin-name">${skin.name}</div>${ph}${active?'<div style="color:#ffd700;font-size:10px;">✅</div>':''}</div>`;
    });
    html+='</div>';
    const bg=popup('🎄 Скины',html);
    bg.querySelectorAll('[data-skin]').forEach(el=>el.addEventListener('click',function(){
        const sid=this.dataset.skin,skin=skins.find(s=>s.id===sid),owned=P.ownedSkins.includes(sid);
        if(owned){P.activeSkin=sid;updUI();save();bg.remove();showSkins()}
        else if(skin.cur==='free'){P.ownedSkins.push(sid);P.activeSkin=sid;updUI();save();bg.remove();showSkins()}
        else if(skin.cur==='crystals'){if(P.crystals>=skin.price){if(confirm(`Купить "${skin.name}" за ${skin.price}💎?`)){P.crystals-=skin.price;P.ownedSkins.push(sid);P.activeSkin=sid;updUI();save();bg.remove();showSkins()}}else alert('Недостаточно кристаллов!')}
        else if(skin.cur==='stars'){alert('⭐ Звёзды Telegram — требуется сервер с Bot API')}
    }));
}

async function showLB(){
    const lb=await lLB();
    let html='<table class="lb-table"><thead><tr><th>#</th><th>Игрок</th><th>🌲</th><th>💎</th><th>🎄</th></tr></thead><tbody>';
    if(!lb.length)html+='<tr><td colspan="5" style="text-align:center;padding:20px;color:#aaa;">Игроков пока нет</td></tr>';
    else lb.forEach((e,i)=>{
        const r=i+1;let rc='',ri=r;
        if(r===1){rc='lb-gold';ri='🥇'}else if(r===2){rc='lb-silver';ri='🥈'}else if(r===3){rc='lb-bronze';ri='🥉'}
        html+=`<tr class="${(e.user_id||e.userId)===P.userId?'lb-me':''}"><td class="lb-rank ${rc}">${ri}</td><td>${esc(e.name)}</td><td>${fmt(e.wood)}</td><td>${fmt(e.crystals)}</td><td>${e.treeLevel||1}</td></tr>`;
    });
    html+='</tbody></table>';
    popup('🏆 Рейтинг',html);
}

async function showTrade(){
    const trades=await lTrades();
    let html=`<div style="background:#1e2a3a;border-radius:12px;padding:12px;margin-bottom:12px;">
        <div style="margin-bottom:8px;"><label style="color:#aaa;font-size:11px;">ID игрока (пусто = всем)</label><input type="text" id="trgId" placeholder="Вставьте ID..." style="width:100%;padding:10px;border-radius:10px;border:1px solid #2a2a4a;background:#1a1a2e;color:#eee;font-size:14px;margin-top:3px;"></div>
        <div style="margin-bottom:8px;"><label style="color:#aaa;font-size:11px;">Скин</label><select id="trgSkin" style="width:100%;padding:10px;border-radius:10px;border:1px solid #2a2a4a;background:#1a1a2e;color:#eee;font-size:14px;margin-top:3px;"><option value="">-- Выберите --</option>`;
    P.ownedSkins.forEach(sid=>{if(sid==='default')return;const s=skins.find(x=>x.id===sid);if(s)html+=`<option value="${s.id}">${s.emoji} ${s.name}${sid===P.activeSkin?' (активен)':''}</option>`});
    html+=`</select></div><div style="margin-bottom:8px;"><label style="color:#aaa;font-size:11px;">Цена 🌲</label><input type="number" id="trgPrice" placeholder="100" min="1" style="width:100%;padding:10px;border-radius:10px;border:1px solid #2a2a4a;background:#1a1a2e;color:#eee;font-size:14px;margin-top:3px;"></div>
        <button id="btnCreate" style="width:100%;padding:12px;border-radius:10px;border:none;background:#e2a03f;color:#000;font-weight:700;">Выставить</button></div>
        <div style="color:#e2a03f;font-size:13px;font-weight:700;margin:12px 0 6px;padding-bottom:4px;border-bottom:1px solid #2a2a4a;">📋 Предложения</div><div id="tradeList">`;
    if(!trades.length)html+='<div style="text-align:center;padding:20px;color:#aaa;">Нет предложений</div>';
    else trades.forEach(trade=>{const isOwn=trade.sellerId===P.userId,canBuy=!isOwn&&P.wood>=trade.price&&!P.ownedSkins.includes(trade.skinId);
        html+=`<div class="trade-item"><div class="trade-header"><div><span class="trade-seller">${esc(trade.sellerName)}</span><br><span class="trade-id">ID: ${trade.sellerId}</span>${trade.targetId?`<br><span style="font-size:10px;color:#a78bfa;">🎯 Для: ${trade.targetId}</span>`:''}</div><span class="trade-price">${fmt(trade.price)} 🌲</span></div><div class="trade-tree">${trade.skinEmoji} ${trade.skinName}</div><button class="trade-btn ${isOwn?'cancel':'buy'}" data-action="${isOwn?'cancel':'buy'}" data-id="${trade.id}" ${!isOwn&&!canBuy?'disabled':''}>${isOwn?'Отменить':(canBuy?'Купить':(P.ownedSkins.includes(trade.skinId)?'Уже есть':'Мало 🌲'))}</button></div>`});
    html+='</div>';
    const bg=popup('💱 Торги',html);
    bg.querySelector('#btnCreate').addEventListener('click',async()=>{
        const sid=bg.querySelector('#trgSkin').value,price=parseInt(bg.querySelector('#trgPrice').value),targetId=bg.querySelector('#trgId').value.trim();
        if(!sid||!price||price<1){alert('Заполните поля');return}
        const r=await cTrade(sid,price,targetId);
        if(r.success){P.ownedSkins=P.ownedSkins.filter(s=>s!==sid);if(P.activeSkin===sid)P.activeSkin='default';save();updUI();bg.remove();showTrade()}
    });
    bg.querySelectorAll('#tradeList button[data-action]').forEach(btn=>btn.addEventListener('click',async function(){
        if(this.dataset.action==='buy'){const r=await bTrade(this.dataset.id);if(r.success){P.wood-=r.price;P.ownedSkins.push(r.skinId);save();updUI();sLB()}}
        else{await xTrade(this.dataset.id)}
        bg.remove();showTrade();
    }));
}

function chop(){
    if(P.treeHP<=0)return;
    let dmg=P.axePower;const crit=Math.random()*100<P.critChance;
    if(crit)dmg=Math.floor(dmg*P.critMultiplier);
    P.combo=Math.min(50,P.combo+1);P.comboMultiplier=1+P.combo*(0.01+P.comboBonus/100);
    dmg=Math.max(1,Math.floor(dmg*P.comboMultiplier));P.treeHP-=dmg;P.wood+=dmg;
    document.getElementById('axe').style.transform='rotate(-30deg)';setTimeout(()=>document.getElementById('axe').style.transform='rotate(0deg)',200);
    if(P.treeHP<=0){P.crystals+=P.crystalBonus;P.totalTrees++;P.treeLevel=Math.min(Math.floor(P.totalTrees/2)+1,9999);P.maxTreeHP=Math.floor(15+Math.random()*16);P.treeHP=P.maxTreeHP}
    updUI();save();sLB();
}

function passive(){if(P.autoWood>0){P.wood+=P.autoWood;updUI()}}

document.getElementById('btnShop').addEventListener('click',showShop);
document.getElementById('btnLB').addEventListener('click',showLB);
document.getElementById('btnSkins').addEventListener('click',showSkins);
document.getElementById('btnTrade').addEventListener('click',showTrade);
document.getElementById('tree').addEventListener('click',chop);
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();chop()}});

updUI();sLB();
setInterval(passive,1000);setInterval(save,10000);setInterval(sLB,30000);
</script>
</body>
</html>
