<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Woodcutter | Telegram Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #1a1a2e; --panel: #16213e; --accent: #e2a03f; --text: #eee; --text-secondary: #aaa; --border: #2a2a4a; --gold: #ffd700; }
        * { margin:0; padding:0; box-sizing:border-box; }
        html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:-apple-system,sans-serif; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
        .app-container { width:100%; height:100%; display:flex; justify-content:center; align-items:center; background:var(--bg); }
        .phone-frame { width:100%; height:100%; max-width:430px; background:var(--bg); display:flex; flex-direction:column; position:relative; overflow:hidden; }
        .header { background:var(--panel); padding:12px 16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border); flex-shrink:0; }
        .header .avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#e2a03f,#c47f2a); display:flex; align-items:center; justify-content:center; font-size:20px; overflow:hidden; background-size:cover; }
        .header .title { font-weight:600; color:var(--text); font-size:15px; cursor:pointer; }
        .header .subtitle { font-size:11px; color:var(--text-secondary); }
        .game-area { flex:1; display:flex; flex-direction:column; padding:10px; overflow-y:auto; gap:8px; -webkit-overflow-scrolling:touch; padding-bottom:20px; }
        .resources { display:flex; gap:8px; }
        .resource-card { flex:1; background:var(--panel); border-radius:12px; padding:10px 14px; display:flex; align-items:center; gap:10px; border:1px solid var(--border); }
        .resource-icon { font-size:22px; }
        .resource-value { font-size:18px; font-weight:700; color:var(--text); }
        .resource-label { font-size:10px; color:var(--text-secondary); }
        .tree-scene { background:var(--panel); border-radius:16px; padding:12px; display:flex; flex-direction:column; align-items:center; gap:8px; border:1px solid var(--border); }
        .tree-container { position:relative; width:100%; max-width:240px; aspect-ratio:3/4; cursor:pointer; }
        .tree-container:active { transform:scale(0.96); }
        .tree-container.shake { animation:shake 0.4s ease; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-4px)} 40%{transform:translateX(4px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }
        .tree-fall { animation:fall 0.6s ease forwards; }
        @keyframes fall { 0%{transform:rotate(0);opacity:1} 100%{transform:rotate(80deg) translateX(60px);opacity:0} }
        .tree-svg { width:100%; height:100%; pointer-events:none; }
        .axe-emoji { position:absolute; right:8%; top:42%; font-size:40px; pointer-events:none; z-index:6; }
        .axe-emoji.swing { animation:axeSwing 0.3s ease; }
        @keyframes axeSwing { 0%{transform:rotate(-40deg)} 50%{transform:rotate(20deg)} 100%{transform:rotate(0deg)} }
        .tree-level-badge { position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.8); color:var(--gold); padding:3px 8px; border-radius:12px; font-size:12px; font-weight:700; border:1px solid var(--gold); }
        .hp-bar-container { width:100%; background:#2a2a3a; border-radius:8px; height:14px; overflow:hidden; border:1px solid var(--border); }
        .hp-bar { height:100%; border-radius:8px; transition:width 0.3s ease; }
        .hp-bar.high { background:linear-gradient(90deg,#4caf84,#81c784); }
        .hp-bar.medium { background:linear-gradient(90deg,#f39c12,#e67e22); }
        .hp-bar.low { background:linear-gradient(90deg,#e74c3c,#c0392b); }
        .hp-text { font-size:12px; color:var(--text); text-align:center; font-weight:600; }
        .combo-display { color:var(--text-secondary); font-size:11px; text-align:center; min-height:16px; }
        .combo-fire { color:#ff6b35; }
        .combo-timer-bar { width:100%; height:4px; background:#2a2a3a; border-radius:2px; overflow:hidden; margin-top:4px; }
        .combo-timer-fill { height:100%; background:var(--accent); border-radius:2px; width:100%; transition:width 0.1s linear; }
        .float-text { position:absolute; font-weight:700; pointer-events:none; animation:floatUp 1s ease-out forwards; z-index:20; font-size:16px; }
        @keyframes floatUp { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-50px)} }
        .btn-row { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
        .btn { padding:12px 8px; border-radius:12px; border:none; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:4px; min-height:44px; }
        .btn:active { transform:scale(0.95); }
        .btn-shop { background:var(--panel); color:var(--text); border:1px solid var(--border); }
        .btn-leaderboard { background:linear-gradient(135deg,#ffd700,#ffaa00); color:#000; }
        .btn-trees { background:linear-gradient(135deg,#4caf50,#2d6b2d); color:#fff; }
        .btn-trade { background:linear-gradient(135deg,#a78bfa,#7c3aed); color:#fff; }
        .passive-info { text-align:center; color:var(--text-secondary); font-size:11px; }
        .popup-bg { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.75); z-index:9999; display:flex; align-items:flex-end; justify-content:center; }
        .popup { background:#16213e; border-radius:16px 16px 0 0; width:100%; max-width:430px; max-height:85vh; overflow-y:auto; padding:16px 12px 30px; border:1px solid #2a2a4a; }
        .popup h3 { color:#eee; font-size:18px; margin-bottom:12px; text-align:center; }
        .popup-close { width:100%; padding:14px; border-radius:12px; border:1px solid #2a2a4a; background:#16213e; color:#eee; font-size:15px; font-weight:600; margin-top:8px; }
        .shop-cat { color:#e2a03f; font-size:13px; font-weight:700; margin:12px 0 6px; padding-bottom:4px; border-bottom:1px solid #2a2a4a; }
        .shop-item { background:#1e2a3a; border-radius:12px; padding:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; border:1px solid #2a2a4a; gap:8px; }
        .shop-name { font-weight:600; color:#eee; font-size:14px; }
        .shop-desc { font-size:11px; color:#aaa; }
        .shop-lvl { font-size:10px; color:#e2a03f; }
        .shop-buy { padding:8px 14px; border-radius:10px; border:none; font-weight:600; font-size:12px; cursor:pointer; }
        .shop-buy.wood { background:#4caf84; color:#fff; } .shop-buy.crystal { background:#a78bfa; color:#fff; }
        .shop-buy:disabled { opacity:0.4; }
        .skin-tabs { display:flex; gap:8px; margin-bottom:12px; }
        .skin-tab { flex:1; padding:10px; border-radius:10px; border:1px solid #2a2a4a; background:transparent; color:#eee; cursor:pointer; font-weight:600; font-size:13px; text-align:center; }
        .skin-tab.active { background:#e2a03f; border-color:#e2a03f; color:#000; }
        .skin-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
        .skin-card { background:#1e2a3a; border-radius:12px; padding:10px; text-align:center; border:2px solid #2a2a4a; cursor:pointer; position:relative; }
        .skin-card.active { border-color:#ffd700; }
        .skin-emoji { font-size:32px; display:block; margin-bottom:6px; }
        .skin-name { font-size:11px; color:#eee; font-weight:600; }
        .skin-price { font-size:10px; color:#e2a03f; margin-top:3px; }
        .skin-delete-btn { position:absolute; top:4px; right:4px; background:#e74c3c; color:#fff; border:none; border-radius:50%; width:20px; height:20px; font-size:10px; cursor:pointer; }
        .add-skin-btn { width:100%; padding:12px; border-radius:10px; border:2px dashed #e2a03f; background:transparent; color:#e2a03f; font-weight:600; cursor:pointer; margin-top:12px; }
        .trade-item { background:#1e2a3a; border-radius:12px; padding:12px; margin-bottom:8px; border:1px solid #2a2a4a; }
        .trade-header { display:flex; justify-content:space-between; margin-bottom:6px; }
        .trade-seller-name { font-weight:600; color:#eee; font-size:13px; }
        .trade-seller-id { font-size:10px; color:#aaa; font-family:monospace; }
        .trade-price { color:#e2a03f; font-weight:700; }
        .trade-tree { font-size:20px; text-align:center; margin:6px 0; }
        .trade-btn { width:100%; padding:10px; border-radius:10px; border:none; color:#fff; font-weight:600; cursor:pointer; margin-top:6px; }
        .trade-btn.buy { background:#4caf84; } .trade-btn.cancel { background:#e74c3c; }
        .trade-btn:disabled { opacity:0.4; }
        .create-form { background:#1e2a3a; border-radius:12px; padding:12px; margin-bottom:12px; border:1px solid #2a2a4a; }
        .form-group { margin-bottom:8px; }
        .form-group label { display:block; color:#aaa; font-size:11px; margin-bottom:3px; }
        .form-input { width:100%; padding:10px; border-radius:10px; border:1px solid #2a2a4a; background:#1a1a2e; color:#eee; font-size:14px; margin-top:3px; }
        .form-submit { width:100%; padding:12px; border-radius:10px; border:none; background:#e2a03f; color:#000; font-weight:700; cursor:pointer; }
        .lb-table { width:100%; border-collapse:collapse; }
        .lb-table th { color:#aaa; font-size:10px; padding:8px 6px; }
        .lb-table td { color:#fff; font-size:12px; padding:8px 6px; border-bottom:1px solid #2a2a4a; }
        .lb-rank { font-weight:700; font-size:14px; text-align:center; width:35px; }
        .lb-gold { color:#ffd700; } .lb-silver { color:#c0c0c0; } .lb-bronze { color:#cd7f32; }
        .lb-me { background:rgba(226,160,63,0.15); }
        .no-data { text-align:center; padding:20px; color:#aaa; }
        .section-title { color:#e2a03f; font-size:13px; font-weight:700; margin:12px 0 6px; padding-bottom:4px; border-bottom:1px solid #2a2a4a; }
        .admin-panel { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:99999; overflow-y:auto; padding:20px; }
        .admin-inner { max-width:500px; margin:0 auto; background:#16213e; border-radius:16px; padding:20px; }
        .admin-inner h2 { color:#ffd700; text-align:center; }
        .admin-inner h3 { color:#e2a03f; margin:15px 0 10px; }
        .admin-input { width:100%; padding:10px; border-radius:10px; border:1px solid #2a2a4a; background:#1a1a2e; color:#eee; margin-bottom:8px; }
        .admin-btn { width:100%; padding:12px; border-radius:10px; border:none; font-weight:700; font-size:14px; cursor:pointer; margin-bottom:8px; color:#fff; }
        .admin-btn.green { background:#4caf84; } .admin-btn.purple { background:#a78bfa; } .admin-btn.gold { background:#e2a03f; color:#000; } .admin-btn.red { background:#e74c3c; }
    </style>
</head>
<body>

<div class="app-container">
<div class="phone-frame">
    <div class="header">
        <div class="avatar" id="av">🪓</div>
        <div><div class="title" id="th">Woodcutter</div><div class="subtitle" id="nd">...</div></div>
    </div>
    <div class="game-area">
        <div class="resources">
            <div class="resource-card"><span class="resource-icon">🌲</span><div><span class="resource-value" id="wv">0</span><span class="resource-label">Древесина</span></div></div>
            <div class="resource-card"><span class="resource-icon">💎</span><div><span class="resource-value" id="cv">0</span><span class="resource-label">Кристаллы</span></div></div>
        </div>
        <div class="tree-scene">
            <div class="tree-container" id="tc">
                <div class="tree-level-badge" id="lb">🌲 Ур. 1</div>
                <div class="axe-emoji" id="ax">🪓</div>
                <svg class="tree-svg" viewBox="0 0 260 360"><ellipse cx="130" cy="330" rx="110" ry="20" fill="#3d2b1f" opacity="0.6"/><rect x="115" y="180" width="30" height="152" rx="7" fill="#6b4226" id="tr"/><ellipse cx="130" cy="130" rx="85" ry="75" fill="#3a7d3a" id="c1"/><ellipse cx="130" cy="85" rx="70" ry="65" fill="#4caf50" id="c2"/><ellipse cx="130" cy="45" rx="55" ry="55" fill="#66bb6a" id="c3"/></svg>
            </div>
            <div class="hp-bar-container"><div class="hp-bar high" id="hp" style="width:100%"></div></div>
            <div class="hp-text" id="ht">15 / 15 HP</div>
            <div class="combo-display" id="cd">Нажимай на дерево! 🪓</div>
        </div>
        <div class="btn-row">
            <button class="btn btn-shop" id="bs">🏪 Магазин</button>
            <button class="btn btn-leaderboard" id="bl">🏆 Рейтинг</button>
            <button class="btn btn-trees" id="bt">🎄 Скины</button>
            <button class="btn btn-trade" id="btr">💱 Торги</button>
        </div>
        <div class="passive-info" id="pi"></div>
    </div>
</div>
</div>

<script>
const A='https://delay.pythonanywhere.com/api';
const tg=window.Telegram.WebApp;tg.expand();tg.ready();
const u=tg.initDataUnsafe?.user;
const uid=u?'WC'+String(u.id).slice(-6).padStart(6,'0'):'WC'+Math.random().toString(36).substr(2,6).toUpperCase();
const nm=u?(u.first_name+(u.last_name?' '+u.last_name:'')):'Игрок';
const SK='wc_'+uid;
const ADM='WC046190';

if(u?.photo_url){document.getElementById('av').style.backgroundImage=`url(${u.photo_url})`;document.getElementById('av').textContent='';}

let tc=0;
document.getElementById('th').addEventListener('click',()=>{tc++;if(tc>=5){tc=0;if(uid===ADM)alert('Админ-панель отключена');else alert('⛔ Нет доступа');}setTimeout(()=>tc=0,2000);});

async function api(e,m='GET',b=null){try{const o={method:m,headers:{'Content-Type':'application/json'}};if(b)o.body=JSON.stringify(b);const r=await fetch(A+e,o);return await r.json()}catch(e){return{success:false}}}
async function sLB(){await api('/leaderboard/update','POST',{user_id:uid,name:nm,wood:P.wood,crystals:P.crystals,treeLevel:P.treeLevel,totalTrees:P.totalTrees})}
async function lLB(){const r=await api('/leaderboard');return r.success?r.players:[]}

const treeSkins=[{id:'default',name:'Обычное',emoji:'🌳',colors:['#3a7d3a','#4caf50','#66bb6a'],price:0,cur:'free'},{id:'autumn',name:'Осеннее',emoji:'🍂',colors:['#c47f2a','#d4943a','#e2a03f'],price:500,cur:'crystals'},{id:'cherry',name:'Сакура',emoji:'🌸',colors:['#ff9ec4','#ffbdd4','#ffd1e4'],price:800,cur:'crystals'},{id:'crystal',name:'Кристальное',emoji:'💎',colors:['#a78bfa','#c4b5fd','#ddd6fe'],price:1200,cur:'crystals'},{id:'golden',name:'Золотое',emoji:'✨',colors:['#d4a017','#e6c22a','#f0d840'],price:2000,cur:'crystals'},{id:'inferno',name:'Огненное',emoji:'🔥',colors:['#cc3300','#e64d00','#ff6600'],price:3500,cur:'crystals'},{id:'ocean',name:'Океанское',emoji:'🌊',colors:['#0066cc','#0088e6','#00aaff'],price:10,cur:'stars'},{id:'void',name:'Бездны',emoji:'🕳️',colors:['#1a0033','#2d004d','#400066'],price:25,cur:'stars'},{id:'rainbow',name:'Радужное',emoji:'🌈',colors:['#ff0000','#ff7700','#ffff00'],price:50,cur:'stars'}];
const axeSkins=[{id:'default',name:'Обычный',emoji:'🪓',price:0,cur:'free'},{id:'gold_axe',name:'Золотой',emoji:'🥇',price:1000,cur:'crystals'},{id:'diamond_axe',name:'Алмазный',emoji:'💎',price:3000,cur:'crystals'},{id:'fire_axe',name:'Огненный',emoji:'🔥',price:5000,cur:'crystals'}];

try{const ct=JSON.parse(localStorage.getItem('c_ts')||'[]');ct.forEach(s=>treeSkins.push(s))}catch(e){}
try{const ca=JSON.parse(localStorage.getItem('c_as')||'[]');ca.forEach(a=>axeSkins.push(a))}catch(e){}

let P={name:nm,userId:uid,wood:0,crystals:0,axePower:1,crystalBonus:1,autoWood:0,critChance:0,critMultiplier:2,crystalToWoodRate:0,comboBonus:0,combo:0,comboMultiplier:1,treeHP:15,maxTreeHP:15,totalTrees:0,treeLevel:1,activeSkin:'default',ownedSkins:['default'],activeAxe:'default',ownedAxes:['default'],upgrades:{}};
try{const s=localStorage.getItem(SK);if(s)Object.assign(P,JSON.parse(s))}catch(e){}
P.name=nm;P.userId=uid;
if(!P.maxTreeHP||P.maxTreeHP<10){P.maxTreeHP=15;P.treeHP=15}
if(!P.ownedSkins||!P.ownedSkins.length)P.ownedSkins=['default'];
if(!P.ownedAxes||!P.ownedAxes.length)P.ownedAxes=['default'];
if(!P.activeSkin)P.activeSkin='default';
if(!P.activeAxe)P.activeAxe='default';
if(!P.upgrades)P.upgrades={};
['axe','strength','crystal1','crystal2','auto1','auto2','auto3','auto4','crit1','crit2','crystalToWood1','crystalToWood2','crystalAuto1','crystalAuto2','critDamage1','comboBoost1'].forEach(id=>{if(!(id in P.upgrades))P.upgrades[id]=0});

function save(){localStorage.setItem(SK,JSON.stringify(P))}
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':Math.floor(n).toString()}
function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}
function calcHP(lv){const bMin=15,bMax=30;let m;if(lv<=10)m=1+(lv-1)*0.5;else if(lv<=50)m=5.5+(lv-10)*0.3;else if(lv<=200)m=17.5+(lv-50)*0.2;else if(lv<=1000)m=47.5+(lv-200)*0.1;else if(lv<=5000)m=127.5+(lv-1000)*0.05;else m=327.5+(lv-5000)*0.02;return Math.floor(Math.random()*(bMax*m+(lv-1)*5-bMin*m-(lv-1)*5)+bMin*m+(lv-1)*5)}

const shop=[{id:'axe',name:'🪓 Топор +1',desc:'+1 к силе',base:10,mult:1.5,cur:'wood',cost(){return Math.floor(this.base*Math.pow(this.mult,P.upgrades[this.id]||0))},eff(){P.axePower++;P.upgrades[this.id]=(P.upgrades[this.id]||0)+1}},{id:'auto1',name:'🌱 Саженец',desc:'+1/с авто',base:50,mult:1.4,cur:'wood',cost(){return Math.floor(this.base*Math.pow(this.mult,P.upgrades[this.id]||0))},eff(){P.autoWood++;P.upgrades[this.id]=(P.upgrades[this.id]||0)+1}},{id:'crystal1',name:'💎 Кристальный глаз',desc:'+1💎 за сруб',base:5,mult:2,cur:'crystals',cost(){return Math.floor(this.base*Math.pow(this.mult,P.upgrades[this.id]||0))},eff(){P.crystalBonus++;P.upgrades[this.id]=(P.upgrades[this.id]||0)+1}}];

function upd(){
    document.getElementById('wv').textContent=fmt(P.wood);
    document.getElementById('cv').textContent=fmt(P.crystals);
    const hpPct=Math.max(0,(P.treeHP/Math.max(1,P.maxTreeHP))*100);
    const hpb=document.getElementById('hp');hpb.style.width=hpPct+'%';
    hpb.className='hp-bar '+(hpPct>60?'high':hpPct>30?'medium':'low');
    document.getElementById('ht').textContent=`${fmt(Math.max(0,P.treeHP))} / ${fmt(P.maxTreeHP)} HP`;
    document.getElementById('lb').textContent=`🌲 Ур. ${P.treeLevel}`;
    document.getElementById('nd').textContent=P.name;
    document.getElementById('cd').innerHTML=P.combo>1?`<span class="combo-fire">🔥 Комбо x${P.combo}</span>`:'Нажимай на дерево! 🪓';
    document.getElementById('pi').textContent=P.autoWood>0?`⏳ +${P.autoWood} 🌲/сек`:'';
    const skin=treeSkins.find(s=>s.id===P.activeSkin)||treeSkins[0];
    const colors=hpPct>60?skin.colors:(hpPct>30?['#e67e22','#f39c12','#f1c40f']:['#c0392b','#e74c3c','#ff6b6b']);
    document.getElementById('c1').setAttribute('fill',colors[0]);
    document.getElementById('c2').setAttribute('fill',colors[1]);
    document.getElementById('c3').setAttribute('fill',colors[2]);
    const axe=axeSkins.find(a=>a.id===P.activeAxe)||axeSkins[0];
    document.getElementById('ax').textContent=axe.emoji;
}

function popup(title,content){
    const bg=document.createElement('div');bg.className='popup-bg';
    bg.innerHTML=`<div class="popup"><h3>${title}</h3>${content}<button class="popup-close">Закрыть</button></div>`;
    bg.querySelector('button').addEventListener('click',()=>bg.remove());
    bg.addEventListener('click',function(e){if(e.target===bg)bg.remove()});
    document.body.appendChild(bg);return bg;
}

function chop(){
    if(P.treeHP<=0){P.maxTreeHP=calcHP(P.treeLevel);P.treeHP=P.maxTreeHP;upd();return}
    let dmg=P.axePower;if(Math.random()*100<P.critChance)dmg=Math.floor(dmg*P.critMultiplier);
    P.combo=Math.min(50,P.combo+1);P.comboMultiplier=1+P.combo*0.01;
    dmg=Math.max(1,Math.floor(dmg*P.comboMultiplier));P.treeHP-=dmg;P.wood+=dmg;
    document.getElementById('ax').style.transform='rotate(-30deg)';setTimeout(()=>document.getElementById('ax').style.transform='',200);
    if(P.treeHP<=0){P.crystals+=P.crystalBonus;P.totalTrees++;P.treeLevel=Math.min(Math.floor(P.totalTrees/2)+1,9999);P.maxTreeHP=calcHP(P.treeLevel);P.treeHP=P.maxTreeHP}
    upd();save();sLB();
}

function showShop(){
    let html='';let cat='';
    shop.forEach(item=>{
        const cn=item.cur==='wood'?'🌲 За древесину':'💎 За кристаллы';
        if(cat!==cn){cat=cn;html+=`<div class="shop-cat">${cn}</div>`}
        const cost=item.cost(),afford=item.cur==='wood'?P.wood>=cost:P.crystals>=cost;
        html+=`<div class="shop-item"><div><span class="shop-name">${item.name}</span><br><span class="shop-desc">${item.desc}</span>${(P.upgrades[item.id]||0)>0?`<br><span class="shop-lvl">Ур. ${P.upgrades[item.id]}</span>`:''}</div><button class="shop-buy ${item.cur==='wood'?'wood':'crystal'}" data-id="${item.id}" ${!afford?'disabled':''}>${fmt(cost)} ${item.cur==='wood'?'🌲':'💎'}</button></div>`;
    });
    const bg=popup('🏪 Магазин',html);
    bg.querySelectorAll('button[data-id]').forEach(b=>b.addEventListener('click',function(){
        const item=shop.find(i=>i.id===this.dataset.id);if(!item)return;
        const cost=item.cost();
        if(item.cur==='wood'&&P.wood<cost)return;
        if(item.cur==='crystals'&&P.crystals<cost)return;
        if(item.cur==='wood')P.wood-=cost;else P.crystals-=cost;
        item.eff();upd();save();sLB();bg.remove();showShop();
    }));
}

function showSkins(){
    let ct='tree';
    function render(tab){
        ct=tab;
        let html='<div class="skin-tabs">';
        html+=`<div class="skin-tab ${tab==='tree'?'active':''}" data-tab="tree">🎄 Деревья</div>`;
        html+=`<div class="skin-tab ${tab==='axe'?'active':''}" data-tab="axe">🪓 Топоры</div>`;
        html+='</div><div class="skin-grid">';
        const skins=tab==='tree'?treeSkins:axeSkins;
        const owned=tab==='tree'?P.ownedSkins:P.ownedAxes;
        const active=tab==='tree'?P.activeSkin:P.activeAxe;
        skins.forEach(skin=>{
            if(skin.hidden&&!owned.includes(skin.id))return;
            const ow=owned.includes(skin.id),ac=active===skin.id;
            let ph='';
            if(!ow){if(skin.cur==='free')ph='<div class="skin-price">Бесплатно</div>';else if(skin.cur==='crystals')ph=`<div class="skin-price">🔒 ${fmt(skin.price)} 💎</div>`;else ph=`<div class="skin-price" style="color:#ffd700">⭐ ${skin.price} звёзд</div>`}
            const isC=skin.id.startsWith('custom_');
            html+=`<div class="skin-card ${ac?'active':''}" data-sid="${skin.id}" data-type="${tab}">
                ${isC&&uid===ADM?`<button class="skin-delete-btn" data-del="${skin.id}" data-dt="${tab}">✕</button>`:''}
                <span class="skin-emoji">${skin.emoji||'🎄'}</span><div class="skin-name">${skin.name}</div>${ph}${ac?'<div style="color:#ffd700;font-size:10px;">✅</div>':''}</div>`;
        });
        html+='</div>';
        if(uid===ADM)html+='<button class="add-skin-btn" id="addBtn">➕ Добавить скин</button>';
        const bg=popup('🎨 Скины',html);
        bg.querySelectorAll('.skin-tab').forEach(t=>t.addEventListener('click',()=>{bg.remove();render(t.dataset.tab)}));
        bg.querySelectorAll('[data-sid]').forEach(el=>el.addEventListener('click',function(e){
            if(e.target.classList.contains('skin-delete-btn'))return;
            const sid=this.dataset.sid,type=this.dataset.type;
            const skins=type==='tree'?treeSkins:axeSkins;
            const skin=skins.find(s=>s.id===sid);
            const owned=type==='tree'?P.ownedSkins:P.ownedAxes;
            if(owned.includes(sid)){if(type==='tree')P.activeSkin=sid;else P.activeAxe=sid;upd();save();bg.remove();render(ct)}
            else if(skin.cur==='free'){owned.push(sid);if(type==='tree')P.activeSkin=sid;else P.activeAxe=sid;upd();save();bg.remove();render(ct)}
            else if(skin.cur==='crystals'){if(P.crystals>=skin.price){if(confirm(`Купить за ${skin.price}💎?`)){P.crystals-=skin.price;owned.push(sid);if(type==='tree')P.activeSkin=sid;else P.activeAxe=sid;upd();save();bg.remove();render(ct)}}else alert('Недостаточно кристаллов!')}
            else alert('⭐ Звёзды временно недоступны');
        }));
        bg.querySelectorAll('.skin-delete-btn').forEach(btn=>btn.addEventListener('click',function(e){
            e.stopPropagation();
            const sid=this.dataset.del,type=this.dataset.dt;
            if(confirm(`Удалить "${sid}"?`)){
                if(type==='tree'){treeSkins.splice(treeSkins.findIndex(s=>s.id===sid),1);localStorage.setItem('c_ts',JSON.stringify(treeSkins.filter(s=>s.id.startsWith('custom_'))))}
                else{axeSkins.splice(axeSkins.findIndex(s=>s.id===sid),1);localStorage.setItem('c_as',JSON.stringify(axeSkins.filter(s=>s.id.startsWith('custom_'))))}
                bg.remove();render(ct);
            }
        }));
        const ab=bg.querySelector('#addBtn');
        if(ab)ab.addEventListener('click',()=>{bg.remove();addSkinForm()});
    }
    render('tree');
}

function addSkinForm(){
    let html = '<div class="create-form">';
    html += '<div class="form-group"><label>Название</label><input type="text" id="nsn" class="form-input" placeholder="Мой скин"></div>';
    html += '<div class="form-group"><label>Эмодзи</label><input type="text" id="nse" class="form-input" placeholder="🎄" value="🎄"></div>';
    html += '<div class="form-group"><label>Цена (кристаллы)</label><input type="number" id="nsp" class="form-input" placeholder="500" value="500"></div>';
    html += '<button id="nsb" class="form-submit">Добавить скин дерева</button>';
    html += '</div>';
    
    const bg = popup('➕ Добавить скин', html);
    
    document.getElementById('nsb').addEventListener('click', function(){
        const name = document.getElementById('nsn').value.trim();
        const emoji = document.getElementById('nse').value.trim();
        const price = parseInt(document.getElementById('nsp').value) || 500;
        
        if (!name) { alert('Введите название!'); return; }
        if (!emoji) { alert('Введите эмодзи!'); return; }
        if (price < 1) { alert('Цена должна быть > 0!'); return; }
        
        const newSkin = {
            id: 'custom_' + Date.now(),
            name: name,
            emoji: emoji,
            colors: ['#4caf50', '#66bb6a', '#81c784'],
            price: price,
            cur: 'crystals',
            hidden: false,
            type: 'tree'
        };
        
        treeSkins.push(newSkin);
        const saved = treeSkins.filter(function(s){ return s.id.indexOf('custom_') === 0; });
        localStorage.setItem('c_ts', JSON.stringify(saved));
        
        alert('✅ Скин "' + name + '" добавлен!');
        bg.remove();
        showSkins();
    });
}
async function showLB(){
    const lb=await lLB();
    let html='<table class="lb-table"><thead><tr><th>#</th><th>Игрок</th><th>🌲</th><th>💎</th><th>🎄</th></tr></thead><tbody>';
    if(!lb.length)html+='<tr><td colspan="5" class="no-data">Нет игроков</td></tr>';
    else lb.forEach((e,i)=>{const r=i+1;let rc='',ri=r;if(r===1){rc='lb-gold';ri='🥇'}else if(r===2){rc='lb-silver';ri='🥈'}else if(r===3){rc='lb-bronze';ri='🥉'}html+=`<tr class="${(e.user_id||e.userId)===P.userId?'lb-me':''}"><td class="lb-rank ${rc}">${ri}</td><td>${esc(e.name)}</td><td>${fmt(e.wood)}</td><td>${fmt(e.crystals)}</td><td>${e.treeLevel||1}</td></tr>`});
    html+='</tbody></table>';
    popup('🏆 Рейтинг',html);
}

function passive(){if(P.autoWood>0){P.wood+=P.autoWood;upd()}}

document.getElementById('bs').addEventListener('click',showShop);
document.getElementById('bl').addEventListener('click',showLB);
document.getElementById('bt').addEventListener('click',showSkins);
document.getElementById('btr').addEventListener('click',()=>alert('💱 Торги временно отключены'));
document.getElementById('tc').addEventListener('click',chop);
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();chop()}});

upd();sLB();
setInterval(passive,1000);setInterval(save,10000);setInterval(sLB,30000);
</script>
</body>
</html>
