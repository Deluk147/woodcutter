<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Woodcutter | Telegram Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #1a1a2e; --panel: #16213e; --accent: #e2a03f; --text: #eee; --text-secondary: #aaa; --border: #2a2a4a; --gold: #ffd700; }
        * { margin:0; padding:0; box-sizing:border-box; }
        html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:-apple-system,sans-serif; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
        .app-container { width:100%; height:100%; display:flex; justify-content:center; align-items:center; background:var(--bg); }
        .phone-frame { width:100%; height:100%; max-width:430px; background:var(--bg); display:flex; flex-direction:column; position:relative; overflow:hidden; }
        .header { background:var(--panel); padding:12px 16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border); flex-shrink:0; }
        .header .avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#e2a03f,#c47f2a); display:flex; align-items:center; justify-content:center; font-size:20px; overflow:hidden; background-size:cover; flex-shrink:0; }
        .header-info { flex:1; min-width:0; }
        .header .title { font-weight:600; color:var(--text); font-size:15px; }
        .header .subtitle { font-size:11px; color:var(--text-secondary); }
        .admin-btn-header { width:32px; height:32px; border-radius:8px; background:linear-gradient(135deg,#ffd700,#ffaa00); border:none; color:#000; font-size:16px; cursor:pointer; display:none; align-items:center; justify-content:center; flex-shrink:0; }
        .admin-btn-header:active { transform:scale(0.9); }
        .game-area { flex:1; display:flex; flex-direction:column; padding:10px; overflow-y:auto; gap:8px; -webkit-overflow-scrolling:touch; padding-bottom:20px; }
        .resources { display:flex; gap:8px; }
        .resource-card { flex:1; background:var(--panel); border-radius:12px; padding:10px 14px; display:flex; align-items:center; gap:12px; border:1px solid var(--border); }
        .resource-icon { font-size:24px; }
        .resource-info { display:flex; flex-direction:column; gap:4px; }
        .resource-value { font-size:20px; font-weight:700; color:var(--text); line-height:1; }
        .resource-label { font-size:10px; color:var(--text-secondary); }
        .tree-scene { background:var(--panel); border-radius:16px; padding:12px; display:flex; flex-direction:column; align-items:center; gap:8px; border:1px solid var(--border); }
        .tree-container { position:relative; width:100%; max-width:240px; aspect-ratio:3/4; cursor:pointer; }
        .tree-container:active { transform:scale(0.96); }
        .tree-container.shake { animation:shake 0.4s ease; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-4px)} 40%{transform:translateX(4px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }
        .tree-fall { animation:fall 0.6s ease forwards; }
        @keyframes fall { 0%{transform:rotate(0);opacity:1} 100%{transform:rotate(80deg) translateX(60px);opacity:0} }
        .tree-svg { width:100%; height:100%; pointer-events:none; }
        .axe-emoji { position:absolute; right:8%; top:42%; font-size:40px; pointer-events:none; z-index:6; filter:drop-shadow(2px 3px 3px rgba(0,0,0,0.4)); }
        .axe-emoji.swing { animation:axeSwing 0.3s ease; }
        @keyframes axeSwing { 0%{transform:rotate(-40deg)} 50%{transform:rotate(20deg)} 100%{transform:rotate(0deg)} }
        .tree-level-badge { position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.8); color:var(--gold); padding:3px 8px; border-radius:12px; font-size:12px; font-weight:700; border:1px solid var(--gold); }
        .hp-bar-container { width:100%; background:#2a2a3a; border-radius:8px; height:14px; overflow:hidden; border:1px solid var(--border); }
        .hp-bar { height:100%; border-radius:8px; transition:width 0.3s ease; }
        .hp-bar.high { background:linear-gradient(90deg,#4caf84,#81c784); }
        .hp-bar.medium { background:linear-gradient(90deg,#f39c12,#e67e22); }
        .hp-bar.low { background:linear-gradient(90deg,#e74c3c,#c0392b); }
        .hp-text { font-size:12px; color:var(--text); text-align:center; font-weight:600; }
        .combo-display { color:var(--text-secondary); font-size:11px; text-align:center; min-height:16px; }
        .combo-fire { color:#ff6b35; }
        .combo-timer-bar { width:100%; height:4px; background:#2a2a3a; border-radius:2px; overflow:hidden; margin-top:4px; }
        .combo-timer-fill { height:100%; background:var(--accent); border-radius:2px; width:100%; transition:width 0.1s linear; }
        .float-text { position:absolute; font-weight:700; pointer-events:none; animation:floatUp 1s ease-out forwards; z-index:20; font-size:16px; }
        @keyframes floatUp { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-50px)} }
        .btn-row { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
        .btn { padding:12px 8px; border-radius:12px; border:none; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:4px; min-height:44px; }
        .btn:active { transform:scale(0.95); }
        .btn-shop { background:var(--panel); color:var(--text); border:1px solid var(--border); }
        .btn-leaderboard { background:linear-gradient(135deg,#ffd700,#ffaa00); color:#000; }
        .btn-trees { background:linear-gradient(135deg,#4caf50,#2d6b2d); color:#fff; }
        .btn-trade { background:linear-gradient(135deg,#a78bfa,#7c3aed); color:#fff; }
        .passive-info { text-align:center; color:var(--text-secondary); font-size:11px; }
        .popup-bg { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.75); z-index:9999; display:flex; align-items:flex-end; justify-content:center; }
        .popup { background:#16213e; border-radius:16px 16px 0 0; width:100%; max-width:430px; max-height:85vh; overflow-y:auto; padding:16px 12px 30px; border:1px solid #2a2a4a; }
        .popup h3 { color:#eee; font-size:18px; margin-bottom:12px; text-align:center; }
        .popup-close { width:100%; padding:14px; border-radius:12px; border:1px solid #2a2a4a; background:#16213e; color:#eee; font-size:15px; font-weight:600; margin-top:8px; cursor:pointer; }
        .shop-cat { color:#e2a03f; font-size:13px; font-weight:700; margin:12px 0 6px; padding-bottom:4px; border-bottom:1px solid #2a2a4a; }
        .shop-item { background:#1e2a3a; border-radius:12px; padding:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; border:1px solid #2a2a4a; gap:8px; }
        .shop-name { font-weight:600; color:#eee; font-size:14px; }
        .shop-desc { font-size:11px; color:#aaa; }
        .shop-lvl { font-size:10px; color:#e2a03f; }
        .shop-buy { padding:8px 14px; border-radius:10px; border:none; font-weight:600; font-size:12px; cursor:pointer; }
        .shop-buy.wood { background:#4caf84; color:#fff; } .shop-buy.crystal { background:#a78bfa; color:#fff; }
        .shop-buy:disabled { opacity:0.4; }
        .skin-tabs { display:flex; gap:8px; margin-bottom:12px; }
        .skin-tab { flex:1; padding:10px; border-radius:10px; border:1px solid #2a2a4a; background:transparent; color:#eee; cursor:pointer; font-weight:600; font-size:13px; text-align:center; }
        .skin-tab.active { background:#e2a03f; border-color:#e2a03f; color:#000; }
        .skin-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
        .skin-card { background:#1e2a3a; border-radius:12px; padding:10px; text-align:center; border:2px solid #2a2a4a; cursor:pointer; position:relative; }
        .skin-card.active { border-color:#ffd700; }
        .skin-card.limited { border-color:#ff6b6b; }
        .skin-emoji { font-size:32px; display:block; margin-bottom:6px; }
        .skin-img { width:48px; height:48px; object-fit:contain; display:block; margin:0 auto 6px; border-radius:8px; }
        .skin-name { font-size:11px; color:#eee; font-weight:600; }
        .skin-price { font-size:10px; color:#e2a03f; margin-top:3px; }
        .skin-price-star { font-size:10px; color:#ffd700; margin-top:3px; }
        .skin-stock { font-size:9px; color:#ff6b6b; margin-top:2px; }
        .skin-delete-btn { position:absolute; top:4px; right:4px; background:#e74c3c; color:#fff; border:none; border-radius:50%; width:20px; height:20px; font-size:10px; cursor:pointer; z-index:10; }
        .add-skin-btn { width:100%; padding:12px; border-radius:10px; border:2px dashed #e2a03f; background:transparent; color:#e2a03f; font-weight:600; cursor:pointer; margin-top:12px; }
        .trade-item { background:#1e2a3a; border-radius:12px; padding:12px; margin-bottom:8px; border:1px solid #2a2a4a; }
        .trade-header { display:flex; justify-content:space-between; margin-bottom:6px; }
        .trade-seller-name { font-weight:600; color:#eee; font-size:13px; }
        .trade-seller-id { font-size:10px; color:#aaa; font-family:monospace; }
        .trade-price { color:#e2a03f; font-weight:700; }
        .trade-tree { font-size:20px; text-align:center; margin:6px 0; }
        .trade-btn { width:100%; padding:10px; border-radius:10px; border:none; color:#fff; font-weight:600; cursor:pointer; margin-top:6px; }
        .trade-btn.buy { background:#4caf84; } .trade-btn.cancel { background:#e74c3c; }
        .trade-btn:disabled { opacity:0.4; }
        .create-form { background:#1e2a3a; border-radius:12px; padding:12px; margin-bottom:12px; border:1px solid #2a2a4a; }
        .form-group { margin-bottom:8px; }
        .form-group label { display:block; color:#aaa; font-size:11px; margin-bottom:3px; }
        .form-input { width:100%; padding:10px; border-radius:10px; border:1px solid #2a2a4a; background:#1a1a2e; color:#eee; font-size:14px; margin-top:3px; }
        .form-submit { width:100%; padding:12px; border-radius:10px; border:none; background:#e2a03f; color:#000; font-weight:700; cursor:pointer; }
        .lb-table { width:100%; border-collapse:collapse; }
        .lb-table th { color:#aaa; font-size:10px; padding:8px 6px; }
        .lb-table td { color:#fff; font-size:12px; padding:8px 6px; border-bottom:1px solid #2a2a4a; }
        .lb-rank { font-weight:700; font-size:14px; text-align:center; width:35px; }
        .lb-gold { color:#ffd700; } .lb-silver { color:#c0c0c0; } .lb-bronze { color:#cd7f32; }
        .lb-me { background:rgba(226,160,63,0.15); }
        .lb-clickable { cursor:pointer; }
        .lb-clickable:hover { background:rgba(226,160,63,0.25); }
        .section-title { color:#e2a03f; font-size:13px; font-weight:700; margin:12px 0 6px; padding-bottom:4px; border-bottom:1px solid #2a2a4a; }
        .admin-panel { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:99999; overflow-y:auto; padding:20px; }
        .admin-inner { max-width:500px; margin:0 auto; background:#16213e; border-radius:16px; padding:20px; }
        .admin-inner h2 { color:#ffd700; text-align:center; }
        .admin-inner h3 { color:#e2a03f; margin:15px 0 10px; }
        .admin-input { width:100%; padding:10px; border-radius:10px; border:1px solid #2a2a4a; background:#1a1a2e; color:#eee; margin-bottom:8px; }
        .admin-btn { width:100%; padding:12px; border-radius:10px; border:none; font-weight:700; font-size:14px; cursor:pointer; margin-bottom:8px; color:#fff; }
        .admin-btn.green { background:#4caf84; } .admin-btn.purple { background:#a78bfa; } .admin-btn.gold { background:#e2a03f; color:#000; } .admin-btn.red { background:#e74c3c; } .admin-btn.blue { background:#4a90d9; }
        .player-info-popup { background:#1e2a3a; border-radius:12px; padding:16px; margin:12px 0; border:1px solid #e2a03f; }
        .player-info-popup .info-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #2a2a4a; }
        .player-info-popup .info-label { color:#aaa; font-size:12px; }
        .player-info-popup .info-value { color:#fff; font-size:12px; font-weight:600; }
        .limited-badge { display:inline-block; background:#ff4444; color:#fff; font-size:9px; padding:2px 6px; border-radius:6px; margin-left:4px; }
    </style>
</head>
<body>
<div class="app-container"><div class="phone-frame">
    <div class="header">
        <div class="avatar" id="av">🪓</div>
        <div class="header-info">
            <div class="title">Woodcutter</div>
            <div class="subtitle" id="nd">...</div>
        </div>
        <button class="admin-btn-header" id="adminBtn" title="Админ-панель">👑</button>
    </div>
    <div class="game-area">
        <div class="resources">
            <div class="resource-card"><span class="resource-icon">🌲</span><div class="resource-info"><span class="resource-value" id="wv">0</span><span class="resource-label">Древесина</span></div></div>
            <div class="resource-card"><span class="resource-icon">💎</span><div class="resource-info"><span class="resource-value" id="cv">0</span><span class="resource-label">Кристаллы</span></div></div>
        </div>
        <div class="tree-scene">
            <div class="tree-container" id="tc">
                <div class="tree-level-badge" id="lb">🌲 Ур. 1</div>
                <div class="axe-emoji" id="ax">🪓</div>
                <svg class="tree-svg" viewBox="0 0 260 360">
                    <ellipse cx="130" cy="330" rx="110" ry="20" fill="#3d2b1f" opacity="0.6"/>
                    <rect x="115" y="180" width="30" height="152" rx="7" fill="#6b4226" id="tr"/>
                    <ellipse cx="130" cy="130" rx="85" ry="75" fill="#3a7d3a" id="c1"/>
                    <ellipse cx="130" cy="85" rx="70" ry="65" fill="#4caf50" id="c2"/>
                    <ellipse cx="130" cy="45" rx="55" ry="55" fill="#66bb6a" id="c3"/>
                </svg>
                <div id="floatTextContainer" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></div>
            </div>
            <div class="hp-bar-container"><div class="hp-bar high" id="hp" style="width:100%"></div></div>
            <div class="hp-text" id="ht">15 / 15 HP</div>
            <div class="combo-display" id="cd">Нажимай на дерево! 🪓</div>
            <div class="combo-timer-bar" id="ctb" style="display:none;"><div class="combo-timer-fill" id="ctf" style="width:100%;"></div></div>
        </div>
        <div class="btn-row">
            <button class="btn btn-shop" id="bs">🏪 Магазин</button>
            <button class="btn btn-leaderboard" id="bl">🏆 Рейтинг</button>
            <button class="btn btn-trees" id="bt">🎄 Скины</button>
            <button class="btn btn-trade" id="btr">💱 Торги</button>
        </div>
        <div class="passive-info" id="pi"></div>
    </div>
</div></div>

<div class="admin-panel" id="ap">
    <div class="admin-inner">
        <h2>👑 Админ-панель</h2>
        <h3>💰 Выдать ресурсы</h3>
        <input type="text" id="atid" class="admin-input" placeholder="ID игрока">
        <input type="number" id="aw" class="admin-input" placeholder="🌲 Древесина">
        <input type="number" id="ac" class="admin-input" placeholder="💎 Кристаллы">
        <button onclick="admGive()" class="admin-btn green">Выдать</button>
        <h3>🎄 Выдать скин</h3>
        <input type="text" id="asid" class="admin-input" placeholder="ID игрока">
        <select id="ass" class="admin-input"></select>
        <button onclick="admGiveSkin()" class="admin-btn purple">Выдать скин</button>
        <h3>🪓 Выдать топор</h3>
        <input type="text" id="aaxid" class="admin-input" placeholder="ID игрока">
        <select id="aaxs" class="admin-input"></select>
        <button onclick="admGiveAxe()" class="admin-btn gold">Выдать топор</button>
        <h3>🗑️ Забрать ресурсы</h3>
        <input type="text" id="atkid" class="admin-input" placeholder="ID игрока">
        <input type="number" id="atkw" class="admin-input" placeholder="🌲 Древесина">
        <input type="number" id="atkc" class="admin-input" placeholder="💎 Кристаллы">
        <button onclick="admTake()" class="admin-btn red">Забрать</button>
        <button onclick="document.getElementById('ap').style.display='none'" class="admin-btn" style="background:#16213e;color:#eee;border:1px solid #2a2a4a;margin-top:15px;">Закрыть</button>
    </div>
</div>

<script>
var API_URL = 'https://delay.pythonanywhere.com/api';
var tg = window.Telegram.WebApp;
tg.expand();
tg.ready();

var user = tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
var userId = user ? 'WC' + String(user.id).slice(-6).padStart(6, '0') : 'WC' + Math.random().toString(36).substr(2, 6).toUpperCase();
var userName = user ? (user.first_name + (user.last_name ? ' ' + user.last_name : '')) : 'Игрок';
var STORAGE_KEY = 'wc_' + userId;
var ADMIN_ID = 'WC046190';

console.log('🌲 Woodcutter v18.0 - Final Complete Version');
console.log('👤 User ID:', userId);
console.log('👑 Admin:', userId === ADMIN_ID);
console.log('📱 Telegram Methods:', { sendStarInvoice: typeof tg.sendStarInvoice === 'function', openInvoice: typeof tg.openInvoice === 'function' });

if (userId === ADMIN_ID) { document.getElementById('adminBtn').style.display = 'flex'; }
if (user && user.photo_url) { document.getElementById('av').style.backgroundImage = 'url(' + user.photo_url + ')'; document.getElementById('av').textContent = ''; }
document.getElementById('adminBtn').addEventListener('click', function() { if (userId === ADMIN_ID) { document.getElementById('ap').style.display = 'block'; updateAdminSelects(); } else { alert('⛔ Нет доступа'); } });

var playerData = { name: userName, userId: userId, wood: 0, crystals: 0, stars: 0, axePower: 1, crystalBonus: 1, autoWood: 0, critChance: 0, critMultiplier: 2, crystalToWoodRate: 0, comboBonus: 0, combo: 0, comboMultiplier: 1, treeHP: 15, maxTreeHP: 15, totalTrees: 0, treeLevel: 1, activeSkin: 'default', ownedSkins: ['default'], activeAxe: 'default', ownedAxes: ['default'], upgrades: {} };

try { var saved = localStorage.getItem(STORAGE_KEY); if (saved) { var parsed = JSON.parse(saved); for (var key in parsed) { if (parsed.hasOwnProperty(key)) playerData[key] = parsed[key]; } } } catch (e) { console.error('Ошибка загрузки:', e); }

playerData.name = userName; playerData.userId = userId;
if (!playerData.maxTreeHP || playerData.maxTreeHP < 10) { playerData.maxTreeHP = 15; playerData.treeHP = 15; }
if (!playerData.ownedSkins || !playerData.ownedSkins.length) playerData.ownedSkins = ['default'];
if (!playerData.ownedAxes || !playerData.ownedAxes.length) playerData.ownedAxes = ['default'];
if (!playerData.activeSkin) playerData.activeSkin = 'default';
if (!playerData.activeAxe) playerData.activeAxe = 'default';
if (!playerData.upgrades) playerData.upgrades = {};

var upgradeIds = ['axe','strength','crystal1','crystal2','auto1','auto2','auto3','auto4','crit1','crit2','crystalToWood1','crystalToWood2','crystalAuto1','crystalAuto2','critDamage1','comboBoost1'];
for (var i = 0; i < upgradeIds.length; i++) { if (!(upgradeIds[i] in playerData.upgrades)) playerData.upgrades[upgradeIds[i]] = 0; }

var treeSkins = [
    {id:'default',name:'Обычное',emoji:'🌳',colors:['#3a7d3a','#4caf50','#66bb6a'],price:0,cur:'free',limited:false,stock:0,sold:0},
    {id:'autumn',name:'Осеннее',emoji:'🍂',colors:['#c47f2a','#d4943a','#e2a03f'],price:500,cur:'crystals',limited:false,stock:0,sold:0},
    {id:'cherry',name:'Сакура',emoji:'🌸',colors:['#ff9ec4','#ffbdd4','#ffd1e4'],price:800,cur:'crystals',limited:false,stock:0,sold:0},
    {id:'crystal',name:'Кристальное',emoji:'💎',colors:['#a78bfa','#c4b5fd','#ddd6fe'],price:1200,cur:'crystals',limited:false,stock:0,sold:0},
    {id:'golden',name:'Золотое',emoji:'✨',colors:['#d4a017','#e6c22a','#f0d840'],price:2000,cur:'crystals',limited:false,stock:0,sold:0},
    {id:'inferno',name:'Огненное',emoji:'🔥',colors:['#cc3300','#e64d00','#ff6600'],price:3500,cur:'crystals',limited:false,stock:0,sold:0},
    {id:'ocean',name:'Океанское',emoji:'🌊',colors:['#0066cc','#0088e6','#00aaff'],price:10,cur:'stars',limited:false,stock:0,sold:0},
    {id:'void',name:'Бездны',emoji:'🕳️',colors:['#1a0033','#2d004d','#400066'],price:25,cur:'stars',limited:false,stock:0,sold:0},
    {id:'rainbow',name:'Радужное',emoji:'🌈',colors:['#ff0000','#ff7700','#ffff00'],price:50,cur:'stars',limited:false,stock:0,sold:0}
];
var axeSkins = [
    {id:'default',name:'Обычный',emoji:'🪓',price:0,cur:'free',limited:false,stock:0,sold:0},
    {id:'gold_axe',name:'Золотой',emoji:'🥇',price:1000,cur:'crystals',limited:false,stock:0,sold:0},
    {id:'diamond_axe',name:'Алмазный',emoji:'💎',price:3000,cur:'crystals',limited:false,stock:0,sold:0},
    {id:'fire_axe',name:'Огненный',emoji:'🔥',price:5000,cur:'crystals',limited:false,stock:0,sold:0}
];

try { var ct = JSON.parse(localStorage.getItem('c_ts')||'[]'); ct.forEach(function(s){ if(!s.limited)s.limited=false; if(!s.stock)s.stock=0; if(!s.sold)s.sold=0; treeSkins.push(s); }); } catch(e) {}
try { var ca = JSON.parse(localStorage.getItem('c_as')||'[]'); ca.forEach(function(a){ if(!a.limited)a.limited=false; if(!a.stock)a.stock=0; if(!a.sold)a.sold=0; axeSkins.push(a); }); } catch(e) {}

// Загрузка кастомных скинов с сервера
(function() {
    fetch(API_URL + '/custom_skins')
        .then(function(response) { return response.json(); })
        .then(function(data) {
            if (data.success && data.skins) {
                var count = 0;
                for (var key in data.skins) {
                    var serverSkin = data.skins[key];
                    var skinType = serverSkin.skin_type || 'tree';
                    var existsInTree = treeSkins.find(function(s) { return s.id === serverSkin.id; });
                    var existsInAxe = axeSkins.find(function(s) { return s.id === serverSkin.id; });
                    if (!existsInTree && !existsInAxe) {
                        if (!serverSkin.limited) serverSkin.limited = false;
                        if (!serverSkin.stock) serverSkin.stock = 0;
                        if (!serverSkin.sold) serverSkin.sold = 0;
                        if (skinType === 'tree') { treeSkins.push(serverSkin); } else { axeSkins.push(serverSkin); }
                        count++;
                    }
                }
                if (count > 0) {
                    localStorage.setItem('c_ts', JSON.stringify(treeSkins.filter(function(s) { return s.id.indexOf('custom_') === 0; })));
                    localStorage.setItem('c_as', JSON.stringify(axeSkins.filter(function(s) { return s.id.indexOf('custom_') === 0; })));
                    console.log('✅ Загружено ' + count + ' скинов с сервера');
                }
            }
        })
        .catch(function(e) { console.log('⚠️ Сервер недоступен, используем локальные скины'); });
})();

function saveData() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(playerData));
    } catch (e) {
        console.error('Ошибка сохранения:', e);
    }
    try {
        localStorage.setItem('limited_skins_data', JSON.stringify(limitedSkinsData));
    } catch (e) {
        console.error('Ошибка сохранения данных лимитированных скинов:', e);
    }
    fetch(API_URL + '/profile/save', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            user_id: userId,
            wood: playerData.wood,
            crystals: playerData.crystals,
            stars: playerData.stars,
            ownedSkins: playerData.ownedSkins,
            ownedAxes: playerData.ownedAxes,
            activeSkin: playerData.activeSkin,
            activeAxe: playerData.activeAxe,
            name: playerData.name,
            treeLevel: playerData.treeLevel,
            totalTrees: playerData.totalTrees
        })
    }).catch(function(e) {
        console.log('⚠️ Ошибка синхронизации с сервером');

}

function formatNumber(number) {
    if (number >= 1000000) {
        return (number / 1000000).toFixed(1) + 'M';
    }
    if (number >= 1000) {
        return (number / 1000).toFixed(1) + 'K';
    }
    return Math.floor(number).toString();
}

function escapeHtml(text) {
    var div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

    document.getElementById('cv').textContent = formatNumber(playerData.crystals);
    
    var hpPercent = Math.max(0, (playerData.treeHP / Math.max(1, playerData.maxTreeHP)) * 100);
    var hpBar = document.getElementById('hp');
    hpBar.style.width = hpPercent + '%';
    
    if (hpPercent > 60) {
        hpBar.className = 'hp-bar high';
    } else if (hpPercent > 30) {
        hpBar.className = 'hp-bar medium';
    } else {
        hpBar.className = 'hp-bar low';
    }
    
    document.getElementById('ht').textContent = formatNumber(Math.max(0, playerData.treeHP)) + ' / ' + formatNumber(playerData.maxTreeHP) + ' HP';
    document.getElementById('lb').textContent = '🌲 Ур. ' + playerData.treeLevel;
    document.getElementById('nd').textContent = playerData.name;
    
    if (playerData.combo > 1) {
        document.getElementById('cd').innerHTML = '<span class="combo-fire">🔥 Комбо x' + playerData.combo + ' (+' + Math.floor((playerData.comboMultiplier - 1) * 100) + '%)</span>';

        document.getElementById('cd').textContent = 'Нажимай на дерево! 🪓';
    }
    
    if (playerData.autoWood > 0) {
        document.getElementById('pi').textContent = '⏳ +' + playerData.autoWood + ' 🌲/сек';
    } else {
        document.getElementById('pi').textContent = '';
    }
    
    var skin = treeSkins.find(function(s) {
        return s.id === playerData.activeSkin;
    }) || treeSkins[0];
    
    var colors;
    if (hpPercent > 60) {
        colors = skin.colors;
    } else if (hpPercent > 30) {
        colors = ['#e67e22', '#f39c12', '#f1c40f'];
    } else {
        colors = ['#c0392b', '#e74c3c', '#ff6b6b'];
    }
    
    var treeContainer = document.getElementById('tc');
    var svg = treeContainer.querySelector('svg');
    var overlay = document.getElementById('skinOverlay');
    
    if (!overlay) {
        overlay = document.createElement('img');
        overlay.id = 'skinOverlay';
        overlay.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;pointer-events:none;z-index:5;';
        treeContainer.appendChild(overlay);
    }
    
    if (skin.img) {
        svg.style.display = 'none';
        overlay.src = skin.img;
        overlay.style.display = 'block';
    } else {
        svg.style.display = 'block';
        overlay.style.display = 'none';
        document.getElementById('c1').setAttribute('fill', colors[0]);
        document.getElementById('c2').setAttribute('fill', colors[1]);
        document.getElementById('c3').setAttribute('fill', colors[2]);
    }
    
    var axe = axeSkins.find(function(a) {
        return a.id === playerData.activeAxe;
    }) || axeSkins[0];
    
    var axeEl = document.getElementById('ax');
    if (axe.img) {
        axeEl.textContent = '';
        axeEl.style.backgroundImage = 'url(' + axe.img + ')';
        axeEl.style.backgroundSize = 'contain';
        axeEl.style.backgroundRepeat = 'no-repeat';
        axeEl.style.width = '50px';
        axeEl.style.height = '50px';
    } else {
        axeEl.style.backgroundImage = '';
        axeEl.style.width = '';
        axeEl.style.height = '';
        axeEl.textContent = axe.emoji || '🪓';
    }
    
    updateAdminSelects();

var COMBO_TIMEOUT = 5000;
var comboTimer = null;

function resetCombo() {
    if (comboTimer) {
        clearTimeout(comboTimer);
    }
    
    var bar = document.getElementById('ctb');
    var fill = document.getElementById('ctf');
    
    if (playerData.combo > 0) {
        bar.style.display = 'block';
        fill.style.transition = 'none';
        fill.style.width = '100%';
        requestAnimationFrame(function() {
            fill.style.transition = 'width ' + COMBO_TIMEOUT + 'ms linear';
            fill.style.width = '0%';
        });
        comboTimer = setTimeout(function() {
            playerData.combo = 0;
            playerData.comboMultiplier = 1;
            bar.style.display = 'none';
            fill.style.transition = 'none';
            fill.style.width = '100%';
            updateUI();
        }, COMBO_TIMEOUT);
    } else {
        bar.style.display = 'none';
    }
}

function floatText(text, color, x, y) {
    var element = document.createElement('div');
    element.className = 'float-text';
    element.textContent = text;
    element.style.color = color;
    element.style.left = x + 'px';
    element.style.top = y + 'px';
    document.getElementById('floatTextContainer').appendChild(element);
    setTimeout(function() {
        element.remove();
    }, 1000);
}

function calculateTreeHP(level) {
    var baseMin = 15;
    var baseMax = 30;
    var multiplier;
    
    if (level <= 10) {
        multiplier = 1 + (level - 1) * 0.5;
    } else if (level <= 50) {
        multiplier = 5.5 + (level - 10) * 0.3;
    } else if (level <= 200) {
        multiplier = 17.5 + (level - 50) * 0.2;
    } else if (level <= 1000) {
        multiplier = 47.5 + (level - 200) * 0.1;
    } else if (level <= 5000) {
        multiplier = 127.5 + (level - 1000) * 0.05;
    } else {
        multiplier = 327.5 + (level - 5000) * 0.02;
    }
    
    var minHP = baseMin * multiplier + (level - 1) * 5;
    var maxHP = baseMax * multiplier + (level - 1) * 5;
    
    return Math.floor(Math.random() * (maxHP - minHP) + minHP);
}

function chop() {
    if (playerData.treeHP <= 0) {
        playerData.maxTreeHP = calculateTreeHP(playerData.treeLevel);
        playerData.treeHP = playerData.maxTreeHP;
        updateUI();
        return;
    }
    
    var damage = playerData.axePower;
    var isCrit = Math.random() * 100 < playerData.critChance;
    
    if (isCrit) {
        damage = Math.floor(damage * playerData.critMultiplier);
    }
    
    playerData.combo = Math.min(50, playerData.combo + 1);
    playerData.comboMultiplier = 1 + playerData.combo * (0.01 + playerData.comboBonus / 100);
    damage = Math.max(1, Math.floor(damage * playerData.comboMultiplier));
    
    playerData.treeHP -= damage;
    playerData.wood += damage;
    
    animAxe();
    resetCombo();
    
    var rect = document.getElementById('tc').getBoundingClientRect();
    floatText((isCrit ? '💥+' : '+') + formatNumber(damage) + '🌲', isCrit ? '#ff6b6b' : '#e2a03f', rect.width / 2, rect.height * 0.5);
    
    if (playerData.treeHP <= 0) {
        playerData.crystals += playerData.crystalBonus;
        
        if (playerData.crystalToWoodRate > 0 && playerData.crystals > 0) {
            var converted = Math.floor(playerData.crystals * playerData.crystalToWoodRate);
            playerData.wood += converted;
            floatText('🔄+' + formatNumber(converted) + '🌲', '#4caf84', rect.width / 2, rect.height * 0.5 + 20);
        }
        
        playerData.totalTrees++;
        playerData.treeLevel = Math.min(Math.floor(playerData.totalTrees / 2) + 1, 9999);
        
        animFall(function() {
            playerData.maxTreeHP = calculateTreeHP(playerData.treeLevel);
            playerData.treeHP = playerData.maxTreeHP;
            updateUI();
        });
        
        floatText('🎉+' + playerData.crystalBonus + '💎', '#a78bfa', rect.width / 2, rect.height * 0.5 - 25);
    } else {
        animShake();
    }
    
    updateUI();
    saveData();
}

function showPopup(title, content) {
    var background = document.createElement('div');
    background.className = 'popup-bg';
    background.innerHTML = '<div class="popup"><h3>' + title + '</h3>' + content + '<button class="popup-close">Закрыть</button></div>';
    var closeButton = background.querySelector('.popup-close');
    if (closeButton) {
        closeButton.addEventListener('click', function(event) {
            event.preventDefault();
            event.stopPropagation();
            background.remove();
        });
    }
    background.addEventListener('click', function(event) {
        if (event.target === background) {
            background.remove();
        }
    });
    document.body.appendChild(background);
    return background;
}

function updateAdminSelects() {
    var skinSelect = document.getElementById('ass');
    if (skinSelect) {
        var currentValue = skinSelect.value;
        skinSelect.innerHTML = '';
        treeSkins.forEach(function(skin) {
            if (skin.id !== 'default') {
                var option = document.createElement('option');
                option.value = skin.id;
                option.textContent = (skin.emoji || '🎄') + ' ' + skin.name;
                skinSelect.appendChild(option);

            skinSelect.value = currentValue;

    var axeSelect = document.getElementById('aaxs');

        axeSelect.innerHTML = '';

                axeSelect.appendChild(option);
            }
        });
        if (currentValue) {
            axeSelect.value = currentValue;
        }

function showShop() {
    var html = '';
    var currentCategory = '';
    
    shopItems.forEach(function(item) {
        var categoryName;
        if (item.cur === 'wood') {
            categoryName = '🌲 За древесину';
        } else {
            categoryName = '💎 За кристаллы';
        }
        
        if (currentCategory !== categoryName) {
            currentCategory = categoryName;
            html += '<div class="shop-cat">' + categoryName + '</div>';
        }
        
        var cost = item.cost();
        var canAfford;
        
        if (item.cur === 'wood') {
            canAfford = playerData.wood >= cost;
        } else {
            canAfford = playerData.crystals >= cost;
        }
        
        html += '<div class="shop-item" id="shop-item-' + item.id + '">';
        html += '<div>';
        html += '<span class="shop-name">' + item.name + '</span><br>';
        html += '<span class="shop-desc">' + item.desc + '</span>';
        
        if (playerData.upgrades[item.id] > 0) {
            html += '<br><span class="shop-lvl">Ур. ' + playerData.upgrades[item.id] + '</span>';
        }
        
        html += '</div>';
        
        html += '<button class="shop-buy ' + (item.cur === 'wood' ? 'wood' : 'crystal') + '" data-id="' + item.id + '" ' + (canAfford ? '' : 'disabled') + '>';
        html += formatNumber(cost) + ' ' + (item.cur === 'wood' ? '🌲' : '💎');
        html += '</button>';
        html += '</div>';
    });
    
    html += '<button class="popup-close">Закрыть</button>';
    
    var popup = showPopup('🏪 Магазин', html);
    
    function updateButton(button) {
        var itemId = button.dataset.id;
        var item = shopItems.find(function(shopItem) {
            return shopItem.id === itemId;
        });
        
        if (!item) {
            return;
        }
        
        var cost = item.cost();
        var canAfford;
        
        if (item.cur === 'wood') {
            canAfford = playerData.wood >= cost;
        } else {
            canAfford = playerData.crystals >= cost;
        }
        
        button.textContent = formatNumber(cost) + ' ' + (item.cur === 'wood' ? '🌲' : '💎');
        
        if (canAfford) {
            button.removeAttribute('disabled');
        } else {
            button.setAttribute('disabled', 'disabled');
        }
    }
    
    function buyItem(button) {
        var itemId = button.dataset.id;
        var item = shopItems.find(function(shopItem) {
            return shopItem.id === itemId;
        });
        
        if (!item) {
            return false;
        }
        
        var cost = item.cost();
        
        if (item.cur === 'wood' && playerData.wood < cost) {
            return false;
        }
        
        if (item.cur === 'crystals' && playerData.crystals < cost) {
            return false;
        }
        
        if (item.cur === 'wood') {
            playerData.wood -= cost;
        } else {
            playerData.crystals -= cost;
        }
        
        item.effect();
        updateUI();
        saveData();
        
        return true;
    }
    
    var buttons = popup.querySelectorAll('button[data-id]');
    buttons.forEach(function(button) {
        var holdTimer = null;
        var isHolding = false;
        
        button.addEventListener('click', function(event) {
            event.preventDefault();
            event.stopPropagation();
            
            if (buyItem(this)) {
                updateButton(this);
            }
        });
        
        button.addEventListener('mousedown', function(event) {
            event.preventDefault();
            isHolding = true;
            
            var self = this;
            
            function holdLoop() {
                if (!isHolding) {
                    return;
                }
                
                if (buyItem(self)) {
                    updateButton(self);
                }
                
                holdTimer = setTimeout(holdLoop, 100);
            }
            
            holdLoop();
        });
        
        button.addEventListener('touchstart', function(event) {
            event.preventDefault();
            isHolding = true;
            
            var self = this;
            
            function holdLoop() {
                if (!isHolding) {
                    return;
                }
                
                if (buyItem(self)) {
                    updateButton(self);
                }
                
                holdTimer = setTimeout(holdLoop, 100);
            }
            
            holdLoop();
        });
        
        button.addEventListener('mouseup', function(event) {
            event.preventDefault();
            isHolding = false;
            if (holdTimer) {
                clearTimeout(holdTimer);
                holdTimer = null;
            }
        });
        
        button.addEventListener('touchend', function(event) {
            event.preventDefault();
            isHolding = false;
            if (holdTimer) {
                clearTimeout(holdTimer);
                holdTimer = null;
            }
        });
        
        button.addEventListener('mouseleave', function(event) {
            isHolding = false;
            if (holdTimer) {
                clearTimeout(holdTimer);
                holdTimer = null;
            }
        });
        
        button.addEventListener('touchcancel', function(event) {
            isHolding = false;
            if (holdTimer) {
                clearTimeout(holdTimer);
                holdTimer = null;
            }
        });
    });
    
    var closeButton = popup.querySelector('.popup-close');
    if (closeButton) {
        closeButton.addEventListener('click', function(event) {
            event.preventDefault();
            event.stopPropagation();
            popup.remove();
        });
    }
}

function showSkins() {
    var currentTab = 'tree';
    
    function render(tab) {
        currentTab = tab;
        
        var html = '<div class="skin-tabs">';
        html += '<div class="skin-tab ' + (tab === 'tree' ? 'active' : '') + '" data-tab="tree">🎄 Деревья</div>';
        html += '<div class="skin-tab ' + (tab === 'axe' ? 'active' : '') + '" data-tab="axe">🪓 Топоры</div>';
        html += '</div>';
        html += '<div class="skin-grid">';
        
        var skins = tab === 'tree' ? treeSkins : axeSkins;
        var owned = tab === 'tree' ? playerData.ownedSkins : playerData.ownedAxes;
        var active = tab === 'tree' ? playerData.activeSkin : playerData.activeAxe;
        
        skins.forEach(function(skin) {
            if (skin.hidden && owned.indexOf(skin.id) === -1) {
                return;
            }
            
            var isOwned = owned.indexOf(skin.id) !== -1;
            var isActive = active === skin.id;
            var priceHtml = '';
            
            if (skin.limited && skin.stock > 0 && !isOwned) {
                var skinKey = skin.id;
                if (!limitedSkinsData[skinKey]) {
                    limitedSkinsData[skinKey] = { sold: skin.sold || 0 };
                }
                var remaining = skin.stock - (limitedSkinsData[skinKey].sold || 0);
                
                if (remaining <= 0) {
                    return;
                }
            }
            
            if (!isOwned) {
                if (skin.cur === 'free') {
                    priceHtml = '<div class="skin-price">Бесплатно</div>';
                } else if (skin.cur === 'crystals') {
                    priceHtml = '<div class="skin-price">🔒 ' + formatNumber(skin.price) + ' 💎</div>';
                } else {
                    priceHtml = '<div class="skin-price-star">⭐ ' + skin.price + ' звёзд</div>';
                }
            }
            
            if (skin.limited && skin.stock > 0 && !isOwned) {
                var skinKey2 = skin.id;
                if (!limitedSkinsData[skinKey2]) {
                    limitedSkinsData[skinKey2] = { sold: skin.sold || 0 };
                }
                var remaining2 = skin.stock - (limitedSkinsData[skinKey2].sold || 0);
                
                if (remaining2 > 0) {
                    priceHtml += '<div class="skin-stock">🔥 Осталось: ' + remaining2 + ' из ' + skin.stock + '</div>';
                }
            }
            
            var isCustom = skin.id.indexOf('custom_') === 0;
            var isLimited = skin.limited && skin.stock > 0;
            
            var imageHtml;
            if (skin.img) {
                imageHtml = '<img src="' + skin.img + '" class="skin-img" onerror="this.style.display=\'none\'">';
            } else {
                imageHtml = '<span class="skin-emoji">' + (skin.emoji || '🎄') + '</span>';
            }
            
            html += '<div class="skin-card ' + (isActive ? 'active' : '') + (isLimited ? ' limited' : '') + '" data-sid="' + skin.id + '" data-type="' + tab + '" data-limited="' + (isLimited ? '1' : '0') + '">';

            html += '</div>';
        });

                    alert('✅ Скин куплен!');
                }
            });
        } else {
            alert('❌ Счет не создан. Проверьте сервер.');
        }
    })
    .catch(function() {
        alert('❌ Сервер недоступен');
    });
}
        
        var deleteButtons = popup.querySelectorAll('.skin-delete-btn');
        deleteButtons.forEach(function(deleteBtn) {
            deleteBtn.addEventListener('click', function(event) {
                event.preventDefault();
                event.stopPropagation();
                
                var skinId = this.dataset.del;
                var skinType = this.dataset.dt;
                
                if (confirm('Удалить этот скин навсегда?')) {
                    if (skinType === 'tree') {
                        var index = treeSkins.findIndex(function(s) { return s.id === skinId; });
                        if (index !== -1) treeSkins.splice(index, 1);
                        localStorage.setItem('c_ts', JSON.stringify(treeSkins.filter(function(s) { return s.id.indexOf('custom_') === 0; })));
                    } else {
                        var index = axeSkins.findIndex(function(s) { return s.id === skinId; });
                        if (index !== -1) axeSkins.splice(index, 1);
                        localStorage.setItem('c_as', JSON.stringify(axeSkins.filter(function(s) { return s.id.indexOf('custom_') === 0; })));
                    }
                    if (limitedSkinsData[skinId]) { delete limitedSkinsData[skinId]; saveLimitedSkinsData(); }
                    popup.remove();
                    render(currentTab);
                }
            });
        });
        
        var addButton = popup.querySelector('#addBtn');
        if (addButton) {
            addButton.addEventListener('click', function(event) {
                event.preventDefault();
                event.stopPropagation();
                popup.remove();
                addSkinForm();
            });
        }
    }
    
    render('tree');
}

// ==================== ФОРМА ДОБАВЛЕНИЯ СКИНА ====================
function addSkinForm() {
    var html = '<div class="create-form">';
    
    html += '<div class="form-group"><label>Тип скина</label>';
    html += '<select id="skinType" class="form-input">';
    html += '<option value="tree">🎄 Дерево</option>';
    html += '<option value="axe">🪓 Топор</option>';
    html += '</select></div>';
    
    html += '<div class="form-group"><label>Название</label>';
    html += '<input type="text" id="skinName" class="form-input" placeholder="Мой скин"></div>';
    
    html += '<div class="form-group"><label>Эмодзи</label>';
    html += '<input type="text" id="skinEmoji" class="form-input" placeholder="🎄" value="🎄"></div>';
    
    html += '<div class="form-group"><label>Фото скина</label>';
    html += '<input type="file" id="skinPhoto" class="form-input" accept="image/*" style="padding:8px;"></div>';
    
    html += '<div class="form-group"><label>Цена (💎 кристаллы)</label>';
    html += '<input type="number" id="skinPrice" class="form-input" placeholder="500" value="500"></div>';
    
    html += '<div class="form-group"><label style="color:#aaa;font-size:11px;">';
    html += '<input type="checkbox" id="skinHidden"> Скрытый скин</label></div>';
    
    html += '<div class="form-group"><label style="color:#ff6b6b;font-size:11px;">';
    html += '<input type="checkbox" id="skinLimited" onchange="document.getElementById(\'limitedStockGroup\').style.display=this.checked?\'block\':\'none\'">';
    html += ' 🔥 Лимитированный скин (ограниченное количество)</label></div>';
    
    html += '<div class="form-group" id="limitedStockGroup" style="display:none;">';
    html += '<label>Количество экземпляров</label>';
    html += '<input type="number" id="skinStock" class="form-input" placeholder="100" value="100" min="1"></div>';
    
    html += '<div id="skinPreview" style="text-align:center;margin:8px 0;"></div>';
    
    html += '<button class="form-submit" id="saveSkinBtn">💾 Сохранить скин</button>';
    html += '</div>';
    
    html += '<button class="popup-close">Закрыть</button>';
    
    var popup = document.createElement('div');
    popup.className = 'popup-bg';
    popup.innerHTML = '<div class="popup"><h3>➕ Новый скин</h3>' + html + '</div>';
    document.body.appendChild(popup);
    
    var closeButton = popup.querySelector('.popup-close');
    if (closeButton) {
        closeButton.addEventListener('click', function(event) {
            event.preventDefault();
            event.stopPropagation();
            popup.remove();
        });
    }
    
    popup.addEventListener('click', function(event) {
        if (event.target === popup) {
            popup.remove();
        }
    });
    
    var photoInput = popup.querySelector('#skinPhoto');
    if (photoInput) {
        photoInput.addEventListener('change', function(event) {
            var file = event.target.files[0];
            if (file) {
                var reader = new FileReader();
                reader.onload = function(ev) {
                    var preview = popup.querySelector('#skinPreview');
                    if (preview) {
                        preview.innerHTML = '<img src="' + ev.target.result + '" style="width:80px;height:80px;object-fit:contain;border-radius:8px;border:2px solid #e2a03f;">';
                    }
                };
                reader.readAsDataURL(file);
            }
        });
    }
    
    var saveButton = popup.querySelector('#saveSkinBtn');
    if (saveButton) {
        saveButton.addEventListener('click', function(event) {
            event.preventDefault();
            event.stopPropagation();
            
            var type = popup.querySelector('#skinType').value;
            var name = popup.querySelector('#skinName').value.trim();
            var emoji = popup.querySelector('#skinEmoji').value.trim();
            var price = parseInt(popup.querySelector('#skinPrice').value) || 500;
            var hidden = popup.querySelector('#skinHidden').checked;
            var limited = popup.querySelector('#skinLimited').checked;
            var stock = limited ? (parseInt(popup.querySelector('#skinStock').value) || 100) : 0;
            var photo = popup.querySelector('#skinPhoto').files[0];
            
            if (!name) {
                alert('❌ Введите название скина!');
                return;
            }
            
            if (!emoji && !photo) {
                alert('❌ Введите эмодзи или загрузите фото!');
                return;
            }
            
            if (limited && stock < 1) {
                alert('❌ Укажите количество больше 0!');
                return;
            }
            
            function saveSkin(imageData) {
                var newSkin = {
                    id: 'custom_' + Date.now(),
                    name: name,
                    emoji: emoji || '🎄',
                    img: imageData || null,
                    colors: ['#4caf50', '#66bb6a', '#81c784'],
                    price: price,
                    cur: 'crystals',
                    hidden: hidden,
                    limited: limited,
                    stock: stock,
                    sold: 0,
                    skin_type: type
                };
                
                if (limited) {
                    limitedSkinsData[newSkin.id] = { sold: 0 };
                    saveLimitedSkinsData();
                }
                
                if (type === 'tree') {
                    treeSkins.push(newSkin);
                    localStorage.setItem('c_ts', JSON.stringify(treeSkins.filter(function(s) {
                        return s.id.indexOf('custom_') === 0;
                    })));
                } else {
                    axeSkins.push(newSkin);
                    localStorage.setItem('c_as', JSON.stringify(axeSkins.filter(function(s) {
                        return s.id.indexOf('custom_') === 0;
                    })));
                }
                
                // Сохраняем на сервер
                fetch(API_URL + '/custom_skins/save', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        admin_id: userId,
                        skin_data: newSkin
                    })
                }).then(function(response) {
                    return response.json();
                }).then(function(data) {
                    if (data.success) {
                        console.log('✅ Скин сохранен на сервере');
                    }
                }).catch(function(e) {
                    console.log('⚠️ Скин сохранен только локально');
                });
                
                alert('✅ Скин "' + name + '" успешно добавлен!' + (limited ? ' (Лимит: ' + stock + ' шт.)' : ''));
                popup.remove();
                showSkins();
                updateAdminSelects();
            }
            
            if (photo) {
                var reader = new FileReader();
                reader.onload = function(ev) {
                    saveSkin(ev.target.result);
                };
                reader.readAsDataURL(photo);
            } else {
                saveSkin(null);
            }
        });
    }
}

// ==================== ТОРГИ ====================
function showTrade() {
    fetch(API_URL + '/trades?user_id=' + userId)
        .then(function(response) {
            if (!response.ok) {
                throw new Error('Server error');
            }
            return response.json();
        })
        .then(function(data) {
            var trades = data.success ? data.trades : [];
            
            var html = '';
            
            html += '<div style="background:#1e2a3a;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;border:1px solid #2a2a4a;">';
            html += '<span style="color:#aaa;font-size:12px;">Ваш ID: <span style="color:#e2a03f;font-weight:700;font-family:monospace;font-size:13px;">' + userId + '</span></span>';
            html += '<button id="btnCopyIdTrade" style="background:#e2a03f;color:#000;border:none;padding:6px 10px;border-radius:8px;font-size:11px;cursor:pointer;">📋 Копировать</button>';
            html += '</div>';
            
            html += '<div class="create-form">';
            html += '<div class="form-group"><label>Скин на продажу</label>';
            html += '<select id="tradeSkinId" class="form-input"><option value="">-- Выберите скин --</option>';
            
            playerData.ownedSkins.forEach(function(skinId) {
                if (skinId === 'default') {
                    return;
                }
                
                var skin = treeSkins.find(function(s) {
                    return s.id === skinId;
                });
                
                if (skin) {
                    var label = (skin.emoji || '🎄') + ' ' + skin.name;
                    if (skin.limited) label += ' 🔥';
                    html += '<option value="' + skin.id + '">' + label + '</option>';
                }
            });
            
            html += '</select></div>';
            
            html += '<div class="form-group"><label>Валюта</label>';
            html += '<select id="tradeCurrency" class="form-input">';
            html += '<option value="wood">🌲 Древесина</option>';
            html += '<option value="crystals">💎 Кристаллы</option>';
            html += '<option value="stars">⭐ Звёзды Telegram</option>';
            html += '</select></div>';
            
            html += '<div class="form-group"><label>Цена</label>';
            html += '<input type="number" id="tradePrice" class="form-input" placeholder="100" min="1" value="100"></div>';
            
            html += '<button id="createTradeBtn" class="form-submit">📤 Выставить на продажу</button>';
            html += '</div>';
            
            html += '<div class="section-title">📋 Активные предложения</div>';
            
            if (!trades.length) {
                html += '<div style="text-align:center;padding:20px;color:#aaa;">Нет активных предложений</div>';
            } else {
                trades.forEach(function(trade) {
                    var isOwn = trade.sellerId === userId;
                    var hasSkin = playerData.ownedSkins.indexOf(trade.skinId) !== -1;
                    var currency = trade.currency || 'wood';
                    var currencyIcon;
                    
                    if (currency === 'wood') {
                        currencyIcon = '🌲';
                    } else if (currency === 'crystals') {
                        currencyIcon = '💎';
                    } else {
                        currencyIcon = '⭐';
                    }
                    
                    html += '<div class="trade-item">';
                    html += '<div class="trade-header"><div>';
                    html += '<span class="trade-seller-name">' + escapeHtml(trade.sellerName) + '</span><br>';
                    html += '<span class="trade-seller-id">ID: ' + trade.sellerId + '</span>';
                    html += '</div>';
                    html += '<span class="trade-price">' + formatNumber(trade.price) + ' ' + currencyIcon + '</span>';
                    html += '</div>';
                    html += '<div class="trade-tree">' + (trade.skinEmoji || '🎄') + ' ' + trade.skinName + '</div>';
                    
                    if (isOwn) {
                        html += '<button class="trade-btn cancel" data-action="cancel" data-id="' + trade.id + '">❌ Отменить</button>';
                    } else if (hasSkin) {
                        html += '<button class="trade-btn" disabled>Уже есть</button>';
                    } else {
                        html += '<button class="trade-btn buy" data-action="buy" data-id="' + trade.id + '" data-currency="' + currency + '" data-price="' + trade.price + '">💰 Купить</button>';
                    }
                    
                    html += '</div>';
                });
            }
            
            html += '<button class="popup-close">Закрыть</button>';
            
            var popup = showPopup('💱 Торговая площадка', html);
            
            var closeButton = popup.querySelector('.popup-close');
            if (closeButton) {
                closeButton.addEventListener('click', function(event) {
                    event.preventDefault();
                    event.stopPropagation();
                    popup.remove();
                });
            }
            
            var copyButton = popup.querySelector('#btnCopyIdTrade');
            if (copyButton) {
                copyButton.addEventListener('click', function(event) {
                    event.preventDefault();
                    event.stopPropagation();
                    navigator.clipboard.writeText(userId).then(function() {
                        alert('✅ ID скопирован: ' + userId);
                    }).catch(function() {
                        alert('ID: ' + userId + ' (скопируйте вручную)');
                    });
                });
            }
            
            var createButton = popup.querySelector('#createTradeBtn');
            if (createButton) {
                createButton.addEventListener('click', function(event) {
                    event.preventDefault();
                    event.stopPropagation();
                    
                    var skinId = popup.querySelector('#tradeSkinId').value;
                    var price = parseInt(popup.querySelector('#tradePrice').value);
                    var currency = popup.querySelector('#tradeCurrency').value;
                    
                    if (!skinId) {
                        alert('❌ Выберите скин для продажи');
                        return;
                    }
                    
                    if (!price || price < 1) {
                        alert('❌ Укажите цену (минимум 1)');
                        return;
                    }
                    
                    if (currency === 'stars' && price < 1) {
                        alert('❌ Минимальная цена в звездах: 1 ⭐');
                        return;
                    }
                    
                    var skin = treeSkins.find(function(s) {
                        return s.id === skinId;
                    });
                    
                    fetch(API_URL + '/trades/create', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            sellerId: userId,
                            sellerName: userName,
                            skinId: skinId,
                            price: price,
                            currency: currency,
                            skinName: skin ? skin.name : 'Скин',
                            skinEmoji: skin ? (skin.emoji || '🎄') : '🎄'
                        })
                    })
                    .then(function(response) {
                        return response.json();
                    })
                    .then(function(result) {
                        if (result.success) {
                            playerData.ownedSkins = playerData.ownedSkins.filter(function(s) {
                                return s !== skinId;
                            });
                            
                            if (playerData.activeSkin === skinId) {
                                playerData.activeSkin = 'default';
                            }
                            
                            saveData();
                            updateUI();
                            popup.remove();
                            showTrade();
                            
                            var currencyNames = {
                                wood: '🌲',
                                crystals: '💎',
                                stars: '⭐'
                            };
                            
                            alert('✅ Скин выставлен на продажу за ' + price + ' ' + (currencyNames[currency] || currency) + '!');
                        } else {
                            alert('❌ Ошибка создания предложения');
                        }
                    });
                });
            }
            
            var actionButtons = popup.querySelectorAll('[data-action]');
            actionButtons.forEach(function(button) {
                button.addEventListener('click', function(event) {
                    event.preventDefault();
                    event.stopPropagation();
                    
                    var action = this.dataset.action;
                    var tradeId = this.dataset.id;
                    
                    if (action === 'cancel') {
                        if (!confirm('Отменить предложение? Скин вернется к вам.')) {
                            return;
                        }
                        
                        fetch(API_URL + '/trades/cancel', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                trade_id: tradeId,
                                user_id: userId
                            })
                        })
                        .then(function(response) {
                            return response.json();
                        })
                        .then(function(result) {
                            if (result.success) {
                                if (result.skinId) {
                                    playerData.ownedSkins.push(result.skinId);
                                    saveData();
                                    updateUI();
                                }
                                
                                popup.remove();
                                showTrade();
                                alert('✅ Предложение отменено, скин возвращен');
                            } else {
                                alert('❌ Ошибка при отмене');
                            }
                        });
                    } else if (action === 'buy') {
                        var currency = this.dataset.currency;
                        var price = parseInt(this.dataset.price);
                        var currencyIcon;
                        
                        if (currency === 'wood') {
                            currencyIcon = '🌲';
                        } else if (currency === 'crystals') {
                            currencyIcon = '💎';
                        } else {
                            currencyIcon = '⭐';
                        }
                        
                        if (currency === 'stars') {
                            if (!confirm('Купить этот скин за ' + price + ' ⭐?')) {
                                return;
                            }
                            
                            if (typeof tg.sendStarInvoice === 'function') {
                                tg.sendStarInvoice({
                                    title: 'Покупка скина',
                                    description: 'Скин в игре Woodcutter',
                                    payload: 'trade_' + tradeId + '_' + userId + '_' + Date.now(),
                                    currency: 'XTR',
                                    prices: [{
                                        amount: price,
                                        label: 'Скин с торгов'
                                    }]
                                }, function(status) {
                                    console.log('⭐ Статус оплаты трейда:', status);
                                    
                                    if (status === 'paid') {
                                        completeTradePurchase(tradeId, 'stars', popup);
                                    } else if (status === 'cancelled') {
                                        alert('❌ Оплата отменена');
                                    } else {
                                        alert('❌ Ошибка оплаты: ' + status);
                                    }
                                });
                            } else if (typeof tg.openInvoice === 'function') {
                                fetch(API_URL + '/create-star-invoice', {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify({
                                        user_id: userId,
                                        trade_id: tradeId,
                                        skin_name: 'Покупка скина',
                                        price: price,
                                        type: 'trade_buy'
                                    })
                                })
                                .then(function(response) {
                                    return response.json();
                                })
                                .then(function(result) {
                                    if (result.success && result.invoice_link) {
                                        tg.openInvoice(result.invoice_link, function(status) {
                                            if (status === 'paid') {
                                                completeTradePurchase(tradeId, 'stars', popup);
                                            } else {
                                                alert('❌ Оплата не прошла');
                                            }
                                        });
                                    } else {
                                        alert('❌ Ошибка создания счета. Бот не настроен.');
                                    }
                                });
                            } else {
                                alert('❌ Покупки за звезды доступны только через бота Telegram.\n\nОткройте игру через @WoodcutterBot');
                            }
                        } else {
                            if (!confirm('Купить за ' + price + ' ' + currencyIcon + '?')) {
                                return;
                            }
                            
                            if (currency === 'wood' && playerData.wood < price) {
                                alert('❌ Недостаточно древесины');
                                return;
                            }
                            
                            if (currency === 'crystals' && playerData.crystals < price) {
                                alert('❌ Недостаточно кристаллов');
                                return;
                            }
                            
                            completeTradePurchase(tradeId, 'direct', popup);
                        }
                    }
                });
            });
            
            function completeTradePurchase(tradeId, paymentType, popup) {
                fetch(API_URL + '/trades/buy', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        trade_id: tradeId,
                        buyer_id: userId,
                        payment_type: paymentType
                    })
                })
                .then(function(response) {
                    return response.json();
                })
                .then(function(result) {
                    if (result.success) {
                        playerData.ownedSkins.push(result.skinId);
                        saveData();
                        updateUI();
                        popup.remove();
                        showTrade();
                        
                        if (paymentType === 'stars' && result.sellerCut) {
                            alert('✅ Скин куплен! Продавец получил ' + result.sellerCut + '⭐');
                        } else {
                            alert('✅ Скин успешно куплен!');
                        }
                    } else {
                        alert('❌ Ошибка: ' + (result.error || 'неизвестная ошибка'));
                    }
                });
            }
        })
        .catch(function() {
            var html = '<div style="text-align:center;padding:20px;color:#aaa;">';
            html += '⚠️ Сервер временно недоступен<br><br>';
            html += 'Торги требуют работающий сервер.<br>';
            html += 'Проверьте PythonAnywhere.';
            html += '</div>';
            html += '<button class="popup-close">Закрыть</button>';
            
            var popup = showPopup('💱 Торги', html);
            
            var closeButton = popup.querySelector('.popup-close');
            if (closeButton) {
                closeButton.addEventListener('click', function(event) {
                    event.preventDefault();
                    event.stopPropagation();
                    popup.remove();
                });
            }
        });
}

        })
        .catch(function() {
            var html = '<div style="text-align:center;padding:20px;color:#aaa;">';
            html += '⚠️ Сервер временно недоступен<br><br>';
            html += 'Проверьте:<br>';
            html += '1. Запущен ли сервер на PythonAnywhere<br>';
            html += '2. Правильный ли API_URL в коде';
            html += '</div>';
            html += '<button class="popup-close">Закрыть</button>';
            
            var popup = showPopup('🏆 Рейтинг', html);
            
            var closeButton = popup.querySelector('.popup-close');
            if (closeButton) {
                closeButton.addEventListener('click', function(event) {
                    event.preventDefault();
                    event.stopPropagation();
                    popup.remove();
                });
            }
        });
}

// ==================== ИНФОРМАЦИЯ ОБ ИГРОКЕ ====================
function showPlayerInfo(targetUserId, parentPopup) {
    fetch(API_URL + '/profile/' + targetUserId)
        .then(function(response) {
            return response.json();
        })
        .then(function(data) {
            if (data.success && data.profile) {
                var profile = data.profile;
                
                var infoHtml = '<div class="player-info-popup">';
                infoHtml += '<h4 style="color:#e2a03f;text-align:center;margin-bottom:10px;">📊 Статистика игрока</h4>';
                
                infoHtml += '<div class="info-row"><span class="info-label">👤 ID:</span><span class="info-value" style="font-family:monospace;">' + targetUserId + '</span></div>';
                infoHtml += '<div class="info-row"><span class="info-label">📛 Имя:</span><span class="info-value">' + escapeHtml(profile.name || 'Неизвестно') + '</span></div>';
                infoHtml += '<div class="info-row"><span class="info-label">🌲 Древесина:</span><span class="info-value">' + formatNumber(profile.wood || 0) + '</span></div>';
                infoHtml += '<div class="info-row"><span class="info-label">💎 Кристаллы:</span><span class="info-value">' + formatNumber(profile.crystals || 0) + '</span></div>';
                infoHtml += '<div class="info-row"><span class="info-label">⭐ Звёзды:</span><span class="info-value">' + (profile.stars || 0) + '</span></div>';
                infoHtml += '<div class="info-row"><span class="info-label">🎄 Скинов:</span><span class="info-value">' + (profile.ownedSkins ? profile.ownedSkins.length : 0) + '</span></div>';
                infoHtml += '<div class="info-row"><span class="info-label">🪓 Топоров:</span><span class="info-value">' + (profile.ownedAxes ? profile.ownedAxes.length : 0) + '</span></div>';
                infoHtml += '<div class="info-row"><span class="info-label">📊 Уровень деревьев:</span><span class="info-value">' + (profile.treeLevel || 1) + '</span></div>';
                infoHtml += '<div class="info-row"><span class="info-label">🌳 Всего срублено:</span><span class="info-value">' + (profile.totalTrees || 0) + '</span></div>';
                
                infoHtml += '</div>';
                
                if (userId === ADMIN_ID && targetUserId !== userId) {
                    infoHtml += '<button class="admin-btn blue" id="btnAdminOpen" style="margin-bottom:8px;">🔧 Выдать ресурсы</button>';
                    infoHtml += '<button class="admin-btn red" id="btnAdminWipe" style="margin-bottom:8px;">🗑️ Стереть аккаунт</button>';
                }
                
                infoHtml += '<button class="popup-close">Закрыть</button>';
                
                parentPopup.remove();
                
                var infoPopup = showPopup('👤 ' + escapeHtml(profile.name || 'Игрок'), infoHtml);
                
                var closeButton = infoPopup.querySelector('.popup-close');
                if (closeButton) {
                    closeButton.addEventListener('click', function(event) {
                        event.preventDefault();
                        event.stopPropagation();
                        infoPopup.remove();
                    });
                }
                
                var btnOpen = infoPopup.querySelector('#btnAdminOpen');
                if (btnOpen) {
                    btnOpen.addEventListener('click', function(event) {
                        event.preventDefault();
                        event.stopPropagation();
                        infoPopup.remove();
                        openAdminWithId(targetUserId);
                    });
                }
                
                var btnWipe = infoPopup.querySelector('#btnAdminWipe');
                if (btnWipe) {
                    btnWipe.addEventListener('click', function(event) {
                        event.preventDefault();
                        event.stopPropagation();
                        admWipeAccount(targetUserId);
                        infoPopup.remove();
                        showLeaderboard();
                    });
                }
            } else {
                alert('❌ Не удалось загрузить информацию об игроке');
            }
        })
        .catch(function() {
            alert('❌ Ошибка загрузки данных');
        });
}
