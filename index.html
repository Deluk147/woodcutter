<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Woodcutter | Telegram Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #1a1a2e; --panel: #16213e; --accent: #e2a03f; --text: #eee; --text-secondary: #aaa; --border: #2a2a4a; --gold: #ffd700; }
        * { margin:0; padding:0; box-sizing:border-box; }
        html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:-apple-system,sans-serif; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
        .app-container { width:100%; height:100%; display:flex; justify-content:center; align-items:center; background:var(--bg); }
        .phone-frame { width:100%; height:100%; max-width:430px; background:var(--bg); display:flex; flex-direction:column; position:relative; overflow:hidden; }
        .header { background:var(--panel); padding:12px 16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border); flex-shrink:0; }
        .header .avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#e2a03f,#c47f2a); display:flex; align-items:center; justify-content:center; font-size:20px; overflow:hidden; background-size:cover; }
        .header .title { font-weight:600; color:var(--text); font-size:15px; cursor:pointer; }
        .header .subtitle { font-size:11px; color:var(--text-secondary); }
        .game-area { flex:1; display:flex; flex-direction:column; padding:10px; overflow-y:auto; gap:8px; -webkit-overflow-scrolling:touch; padding-bottom:20px; }
        .resources { display:flex; gap:8px; }
        .resource-card { flex:1; background:var(--panel); border-radius:12px; padding:10px 14px; display:flex; align-items:center; gap:12px; border:1px solid var(--border); }
        .resource-icon { font-size:24px; }
        .resource-info { display:flex; flex-direction:column; gap:4px; }
        .resource-value { font-size:20px; font-weight:700; color:var(--text); line-height:1; }
        .resource-label { font-size:10px; color:var(--text-secondary); }
        .tree-scene { background:var(--panel); border-radius:16px; padding:12px; display:flex; flex-direction:column; align-items:center; gap:8px; border:1px solid var(--border); }
        .tree-container { position:relative; width:100%; max-width:240px; aspect-ratio:3/4; cursor:pointer; }
        .tree-container:active { transform:scale(0.96); }
        .tree-container.shake { animation:shake 0.4s ease; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-4px)} 40%{transform:translateX(4px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }
        .tree-fall { animation:fall 0.6s ease forwards; }
        @keyframes fall { 0%{transform:rotate(0);opacity:1} 100%{transform:rotate(80deg) translateX(60px);opacity:0} }
        .tree-svg { width:100%; height:100%; pointer-events:none; }
        .axe-emoji { position:absolute; right:8%; top:42%; font-size:40px; pointer-events:none; z-index:6; filter:drop-shadow(2px 3px 3px rgba(0,0,0,0.4)); }
        .axe-emoji.swing { animation:axeSwing 0.3s ease; }
        @keyframes axeSwing { 0%{transform:rotate(-40deg)} 50%{transform:rotate(20deg)} 100%{transform:rotate(0deg)} }
        .tree-level-badge { position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.8); color:var(--gold); padding:3px 8px; border-radius:12px; font-size:12px; font-weight:700; border:1px solid var(--gold); }
        .hp-bar-container { width:100%; background:#2a2a3a; border-radius:8px; height:14px; overflow:hidden; border:1px solid var(--border); }
        .hp-bar { height:100%; border-radius:8px; transition:width 0.3s ease; }
        .hp-bar.high { background:linear-gradient(90deg,#4caf84,#81c784); }
        .hp-bar.medium { background:linear-gradient(90deg,#f39c12,#e67e22); }
        .hp-bar.low { background:linear-gradient(90deg,#e74c3c,#c0392b); }
        .hp-text { font-size:12px; color:var(--text); text-align:center; font-weight:600; }
        .combo-display { color:var(--text-secondary); font-size:11px; text-align:center; min-height:16px; }
        .combo-fire { color:#ff6b35; }
        .combo-timer-bar { width:100%; height:4px; background:#2a2a3a; border-radius:2px; overflow:hidden; margin-top:4px; }
        .combo-timer-fill { height:100%; background:var(--accent); border-radius:2px; width:100%; transition:width 0.1s linear; }
        .float-text { position:absolute; font-weight:700; pointer-events:none; animation:floatUp 1s ease-out forwards; z-index:20; font-size:16px; }
        @keyframes floatUp { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-50px)} }
        .btn-row { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
        .btn { padding:12px 8px; border-radius:12px; border:none; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:4px; min-height:44px; }
        .btn:active { transform:scale(0.95); }
        .btn-shop { background:var(--panel); color:var(--text); border:1px solid var(--border); }
        .btn-leaderboard { background:linear-gradient(135deg,#ffd700,#ffaa00); color:#000; }
        .btn-trees { background:linear-gradient(135deg,#4caf50,#2d6b2d); color:#fff; }
        .btn-trade { background:linear-gradient(135deg,#a78bfa,#7c3aed); color:#fff; }
        .passive-info { text-align:center; color:var(--text-secondary); font-size:11px; }
        .popup-bg { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.75); z-index:9999; display:flex; align-items:flex-end; justify-content:center; }
        .popup { background:#16213e; border-radius:16px 16px 0 0; width:100%; max-width:430px; max-height:85vh; overflow-y:auto; padding:16px 12px 30px; border:1px solid #2a2a4a; }
        .popup h3 { color:#eee; font-size:18px; margin-bottom:12px; text-align:center; }
        .popup-close { width:100%; padding:14px; border-radius:12px; border:1px solid #2a2a4a; background:#16213e; color:#eee; font-size:15px; font-weight:600; margin-top:8px; }
        .shop-cat { color:#e2a03f; font-size:13px; font-weight:700; margin:12px 0 6px; padding-bottom:4px; border-bottom:1px solid #2a2a4a; }
        .shop-item { background:#1e2a3a; border-radius:12px; padding:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; border:1px solid #2a2a4a; gap:8px; }
        .shop-name { font-weight:600; color:#eee; font-size:14px; }
        .shop-desc { font-size:11px; color:#aaa; }
        .shop-lvl { font-size:10px; color:#e2a03f; }
        .shop-buy { padding:8px 14px; border-radius:10px; border:none; font-weight:600; font-size:12px; cursor:pointer; }
        .shop-buy.wood { background:#4caf84; color:#fff; } .shop-buy.crystal { background:#a78bfa; color:#fff; } .shop-buy.star { background:#ffd700; color:#000; }
        .shop-buy:disabled { opacity:0.4; }
        .skin-tabs { display:flex; gap:8px; margin-bottom:12px; }
        .skin-tab { flex:1; padding:10px; border-radius:10px; border:1px solid #2a2a4a; background:transparent; color:#eee; cursor:pointer; font-weight:600; font-size:13px; text-align:center; }
        .skin-tab.active { background:#e2a03f; border-color:#e2a03f; color:#000; }
        .skin-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
        .skin-card { background:#1e2a3a; border-radius:12px; padding:10px; text-align:center; border:2px solid #2a2a4a; cursor:pointer; position:relative; }
        .skin-card.active { border-color:#ffd700; }
        .skin-emoji { font-size:32px; display:block; margin-bottom:6px; }
        .skin-img { width:48px; height:48px; object-fit:contain; display:block; margin:0 auto 6px; border-radius:8px; }
        .skin-name { font-size:11px; color:#eee; font-weight:600; }
        .skin-price { font-size:10px; color:#e2a03f; margin-top:3px; }
        .skin-delete-btn { position:absolute; top:4px; right:4px; background:#e74c3c; color:#fff; border:none; border-radius:50%; width:20px; height:20px; font-size:10px; cursor:pointer; }
        .add-skin-btn { width:100%; padding:12px; border-radius:10px; border:2px dashed #e2a03f; background:transparent; color:#e2a03f; font-weight:600; cursor:pointer; margin-top:12px; }
        .trade-item { background:#1e2a3a; border-radius:12px; padding:12px; margin-bottom:8px; border:1px solid #2a2a4a; }
        .trade-header { display:flex; justify-content:space-between; margin-bottom:6px; }
        .trade-seller-name { font-weight:600; color:#eee; font-size:13px; }
        .trade-seller-id { font-size:10px; color:#aaa; font-family:monospace; }
        .trade-price { color:#e2a03f; font-weight:700; }
        .trade-tree { font-size:20px; text-align:center; margin:6px 0; }
        .trade-btn { width:100%; padding:10px; border-radius:10px; border:none; color:#fff; font-weight:600; cursor:pointer; margin-top:6px; }
        .trade-btn.buy { background:#4caf84; } .trade-btn.cancel { background:#e74c3c; }
        .trade-btn:disabled { opacity:0.4; }
        .create-form { background:#1e2a3a; border-radius:12px; padding:12px; margin-bottom:12px; border:1px solid #2a2a4a; }
        .form-group { margin-bottom:8px; }
        .form-group label { display:block; color:#aaa; font-size:11px; margin-bottom:3px; }
        .form-input { width:100%; padding:10px; border-radius:10px; border:1px solid #2a2a4a; background:#1a1a2e; color:#eee; font-size:14px; margin-top:3px; }
        .form-submit { width:100%; padding:12px; border-radius:10px; border:none; background:#e2a03f; color:#000; font-weight:700; cursor:pointer; }
        .lb-table { width:100%; border-collapse:collapse; }
        .lb-table th { color:#aaa; font-size:10px; padding:8px 6px; }
        .lb-table td { color:#fff; font-size:12px; padding:8px 6px; border-bottom:1px solid #2a2a4a; }
        .lb-rank { font-weight:700; font-size:14px; text-align:center; width:35px; }
        .lb-gold { color:#ffd700; } .lb-silver { color:#c0c0c0; } .lb-bronze { color:#cd7f32; }
        .lb-me { background:rgba(226,160,63,0.15); }
        .section-title { color:#e2a03f; font-size:13px; font-weight:700; margin:12px 0 6px; padding-bottom:4px; border-bottom:1px solid #2a2a4a; }
        .admin-panel { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:99999; overflow-y:auto; padding:20px; }
        .admin-inner { max-width:500px; margin:0 auto; background:#16213e; border-radius:16px; padding:20px; }
        .admin-inner h2 { color:#ffd700; text-align:center; }
        .admin-inner h3 { color:#e2a03f; margin:15px 0 10px; }
        .admin-input { width:100%; padding:10px; border-radius:10px; border:1px solid #2a2a4a; background:#1a1a2e; color:#eee; margin-bottom:8px; }
        .admin-btn { width:100%; padding:12px; border-radius:10px; border:none; font-weight:700; font-size:14px; cursor:pointer; margin-bottom:8px; color:#fff; }
        .admin-btn.green { background:#4caf84; } .admin-btn.purple { background:#a78bfa; } .admin-btn.gold { background:#e2a03f; color:#000; } .admin-btn.red { background:#e74c3c; }
    </style>
</head>
<body>
<div class="app-container"><div class="phone-frame">
    <div class="header"><div class="avatar" id="av">🪓</div><div><div class="title" id="th">Woodcutter</div><div class="subtitle" id="nd">...</div></div></div>
    <div class="game-area">
        <div class="resources">
            <div class="resource-card"><span class="resource-icon">🌲</span><div class="resource-info"><span class="resource-value" id="wv">0</span><span class="resource-label">Древесина</span></div></div>
            <div class="resource-card"><span class="resource-icon">💎</span><div class="resource-info"><span class="resource-value" id="cv">0</span><span class="resource-label">Кристаллы</span></div></div>
        </div>
        <div class="tree-scene">
            <div class="tree-container" id="tc">
                <div class="tree-level-badge" id="lb">🌲 Ур. 1</div>
                <div class="axe-emoji" id="ax">🪓</div>
                <svg class="tree-svg" viewBox="0 0 260 360"><ellipse cx="130" cy="330" rx="110" ry="20" fill="#3d2b1f" opacity="0.6"/><rect x="115" y="180" width="30" height="152" rx="7" fill="#6b4226" id="tr"/><ellipse cx="130" cy="130" rx="85" ry="75" fill="#3a7d3a" id="c1"/><ellipse cx="130" cy="85" rx="70" ry="65" fill="#4caf50" id="c2"/><ellipse cx="130" cy="45" rx="55" ry="55" fill="#66bb6a" id="c3"/></svg>
                <div id="floatTextContainer" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></div>
            </div>
            <div class="hp-bar-container"><div class="hp-bar high" id="hp" style="width:100%"></div></div>
            <div class="hp-text" id="ht">15 / 15 HP</div>
            <div class="combo-display" id="cd">Нажимай на дерево! 🪓</div>
            <div class="combo-timer-bar" id="ctb" style="display:none;"><div class="combo-timer-fill" id="ctf" style="width:100%;"></div></div>
        </div>
        <div class="btn-row">
            <button class="btn btn-shop" id="bs">🏪 Магазин</button>
            <button class="btn btn-leaderboard" id="bl">🏆 Рейтинг</button>
            <button class="btn btn-trees" id="bt">🎄 Скины</button>
            <button class="btn btn-trade" id="btr">💱 Торги</button>
        </div>
        <div class="passive-info" id="pi"></div>
    </div>
</div></div>

<div class="admin-panel" id="ap">
    <div class="admin-inner">
        <h2>👑 Админ-панель</h2>
        <h3>💰 Выдать ресурсы</h3>
        <input type="text" id="atid" class="admin-input" placeholder="ID игрока">
        <input type="number" id="aw" class="admin-input" placeholder="🌲 Древесина">
        <input type="number" id="ac" class="admin-input" placeholder="💎 Кристаллы">
        <button onclick="admGive()" class="admin-btn green">Выдать ресурсы</button>
        <h3>🎄 Выдать скин дерева</h3>
        <input type="text" id="asid" class="admin-input" placeholder="ID игрока">
        <select id="ass" class="admin-input"></select>
        <button onclick="admGiveSkin()" class="admin-btn purple">Выдать скин</button>
        <h3>🪓 Выдать топор</h3>
        <input type="text" id="aaxid" class="admin-input" placeholder="ID игрока">
        <select id="aaxs" class="admin-input"></select>
        <button onclick="admGiveAxe()" class="admin-btn gold">Выдать топор</button>
        <h3>🗑️ Забрать ресурсы</h3>
        <input type="text" id="atkid" class="admin-input" placeholder="ID игрока">
        <input type="number" id="atkw" class="admin-input" placeholder="🌲 Древесина">
        <input type="number" id="atkc" class="admin-input" placeholder="💎 Кристаллы">
        <button onclick="admTake()" class="admin-btn red">Забрать</button>
        <button onclick="document.getElementById('ap').style.display='none'" class="admin-btn" style="background:#16213e;color:#eee;border:1px solid #2a2a4a;margin-top:15px;">Закрыть</button>
    </div>
</div>

<script>
const A='https://delay.pythonanywhere.com/api';
const tg=window.Telegram.WebApp;tg.expand();tg.ready();
const u=tg.initDataUnsafe?.user;
const uid=u?'WC'+String(u.id).slice(-6).padStart(6,'0'):'WC'+Math.random().toString(36).substr(2,6).toUpperCase();
const nm=u?(u.first_name+(u.last_name?' '+u.last_name:'')):'Игрок';
const SK='wc_'+uid;
const ADM='WC046190';
console.log('Woodcutter ID:',uid,'Admin:',uid===ADM);
if(u?.photo_url){document.getElementById('av').style.backgroundImage=`url(${u.photo_url})`;document.getElementById('av').textContent='';}
var tc=0;
document.getElementById('th').addEventListener('click',()=>{tc++;if(tc>=5){tc=0;if(uid===ADM)document.getElementById('ap').style.display='block';else alert('⛔ Нет доступа');}setTimeout(()=>tc=0,2000);});

async function api(e,m='GET',b=null){try{const o={method:m,headers:{'Content-Type':'application/json'}};if(b)o.body=JSON.stringify(b);const r=await fetch(A+e,o);return await r.json()}catch(e){return{success:false}}}
async function sLB(){await api('/leaderboard/update','POST',{user_id:uid,name:nm,wood:P.wood,crystals:P.crystals,treeLevel:P.treeLevel,totalTrees:P.totalTrees})}
async function lLB(){const r=await api('/leaderboard');return r.success?r.players:[]}
async function lTrades(){const r=await api('/trades?user_id='+uid);return r.success?r.trades:[]}
async function cTrade(sid,pr,tid,cur){const s=treeSkins.find(x=>x.id===sid)||axeSkins.find(x=>x.id===sid);return await api('/trades/create','POST',{sellerId:uid,sellerName:nm,targetId:tid||null,skinId:sid,price:pr,currency:cur||'wood',skinName:s?s.name:'Скин',skinEmoji:s?(s.emoji||'🎄'):'🎄'})}
async function bTrade(tid){return await api('/trades/buy','POST',{trade_id:tid,buyer_id:uid})}
async function xTrade(tid){return await api('/trades/cancel','POST',{trade_id:tid,user_id:uid})}

function updateAdminSelects(){
    var ss=document.getElementById('ass');ss.innerHTML='';
    treeSkins.forEach(function(s){if(s.id!=='default')ss.innerHTML+='<option value="'+s.id+'">'+(s.emoji||'🎄')+' '+s.name+'</option>'});
    var as=document.getElementById('aaxs');as.innerHTML='';
    axeSkins.forEach(function(a){if(a.id!=='default')as.innerHTML+='<option value="'+a.id+'">'+(a.emoji||'🪓')+' '+a.name+'</option>'});
}

async function admGive(){
    var tid=document.getElementById('atid').value.trim(),w=parseInt(document.getElementById('aw').value)||0,c=parseInt(document.getElementById('ac').value)||0;
    if(!tid){alert('Введите ID');return}
    var r=await fetch(A+'/profile/'+tid).then(r=>r.json());
    if(r.success){var p=r.profile||{};p.user_id=tid;p.wood=(p.wood||0)+w;p.crystals=(p.crystals||0)+c;p.ownedSkins=p.ownedSkins||['default'];p.ownedAxes=p.ownedAxes||['default'];p.activeSkin=p.activeSkin||'default';p.activeAxe=p.activeAxe||'default';p.name=p.name||'Игрок';p.treeLevel=p.treeLevel||1;p.totalTrees=p.totalTrees||0;
        await fetch(A+'/profile/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
        await fetch(A+'/leaderboard/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:tid,name:p.name,wood:p.wood,crystals:p.crystals,treeLevel:p.treeLevel,totalTrees:p.totalTrees})});
        alert('✅ +'+w+'🌲 +'+c+'💎');document.getElementById('aw').value='';document.getElementById('ac').value='';
        if(tid===uid){P.wood=p.wood;P.crystals=p.crystals;upd();save();}
    }else alert('❌ Не найден');
}
async function admTake(){
    var tid=document.getElementById('atkid').value.trim(),w=parseInt(document.getElementById('atkw').value)||0,c=parseInt(document.getElementById('atkc').value)||0;
    if(!tid){alert('Введите ID');return}
    var r=await fetch(A+'/profile/'+tid).then(r=>r.json());
    if(r.success){var p=r.profile||{};p.user_id=tid;p.wood=Math.max(0,(p.wood||0)-w);p.crystals=Math.max(0,(p.crystals||0)-c);p.ownedSkins=p.ownedSkins||['default'];p.ownedAxes=p.ownedAxes||['default'];p.activeSkin=p.activeSkin||'default';p.activeAxe=p.activeAxe||'default';p.name=p.name||'Игрок';p.treeLevel=p.treeLevel||1;p.totalTrees=p.totalTrees||0;
        await fetch(A+'/profile/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
        await fetch(A+'/leaderboard/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:tid,name:p.name,wood:p.wood,crystals:p.crystals,treeLevel:p.treeLevel,totalTrees:p.totalTrees})});
        alert('✅ -'+w+'🌲 -'+c+'💎');document.getElementById('atkw').value='';document.getElementById('atkc').value='';
        if(tid===uid){P.wood=p.wood;P.crystals=p.crystals;upd();save();}
    }else alert('❌ Не найден');
}
async function admGiveSkin(){
    var tid=document.getElementById('asid').value.trim(),sid=document.getElementById('ass').value;
    if(!tid){alert('Введите ID');return}
    var r=await fetch(A+'/profile/'+tid).then(r=>r.json());
    if(r.success){var p=r.profile||{};var skins=p.ownedSkins||['default'];
        if(skins.indexOf(sid)===-1){skins.push(sid);p.user_id=tid;p.wood=p.wood||0;p.crystals=p.crystals||0;p.ownedSkins=skins;p.ownedAxes=p.ownedAxes||['default'];p.activeSkin=sid;p.activeAxe=p.activeAxe||'default';p.name=p.name||'Игрок';p.treeLevel=p.treeLevel||1;p.totalTrees=p.totalTrees||0;
            await fetch(A+'/profile/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
            alert('✅ Скин выдан');document.getElementById('asid').value='';
            if(tid===uid){P.ownedSkins=skins;P.activeSkin=sid;upd();save();}
        }else alert('Уже есть');
    }else alert('❌ Не найден');
}
async function admGiveAxe(){
    var tid=document.getElementById('aaxid').value.trim(),aid=document.getElementById('aaxs').value;
    if(!tid){alert('Введите ID');return}
    var r=await fetch(A+'/profile/'+tid).then(r=>r.json());
    if(r.success){var p=r.profile||{};var axes=p.ownedAxes||['default'];
        if(axes.indexOf(aid)===-1){axes.push(aid);p.user_id=tid;p.wood=p.wood||0;p.crystals=p.crystals||0;p.ownedSkins=p.ownedSkins||['default'];p.ownedAxes=axes;p.activeAxe=aid;p.activeSkin=p.activeSkin||'default';p.name=p.name||'Игрок';p.treeLevel=p.treeLevel||1;p.totalTrees=p.totalTrees||0;
            await fetch(A+'/profile/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});

function calcHP(lv){const bMin=15,bMax=30;let m;if(lv<=10)m=1+(lv-1)*0.5;else if(lv<=50)m=5.5+(lv-10)*0.3;else if(lv<=200)m=17.5+(lv-50)*0.2;else if(lv<=1000)m=47.5+(lv-200)*0.1;else if(lv<=5000)m=127.5+(lv-1000)*0.05;else m=327.5+(lv-5000)*0.02;return Math.floor(Math.random()*(bMax*m+(lv-1)*5-bMin*m-(lv-1)*5)+bMin*m+(lv-1)*5)}

function chop(){
    if(P.treeHP<=0){P.maxTreeHP=calcHP(P.treeLevel);P.treeHP=P.maxTreeHP;upd();return}
    var dmg=P.axePower;var crit=Math.random()*100<P.critChance;if(crit)dmg=Math.floor(dmg*P.critMultiplier);
    P.combo=Math.min(50,P.combo+1);P.comboMultiplier=1+P.combo*(0.01+P.comboBonus/100);
    dmg=Math.max(1,Math.floor(dmg*P.comboMultiplier));P.treeHP-=dmg;P.wood+=dmg;
    animAxe();resetCombo();
    var r=treeContainer.getBoundingClientRect();
    floatText((crit?'💥+':'+')+fmt(dmg)+'🌲',crit?'#ff6b6b':'#e2a03f',r.width/2,r.height*0.5);
    if(P.treeHP<=0){
        P.crystals+=P.crystalBonus;
        if(P.crystalToWoodRate>0&&P.crystals>0){var conv=Math.floor(P.crystals*P.crystalToWoodRate);P.wood+=conv;floatText('🔄+'+fmt(conv)+'🌲','#4caf84',r.width/2,r.height*0.5+20)}
        P.totalTrees++;P.treeLevel=Math.min(Math.floor(P.totalTrees/2)+1,9999);
        animFall(function(){P.maxTreeHP=calcHP(P.treeLevel);P.treeHP=P.maxTreeHP;upd()});
        floatText('🎉+'+P.crystalBonus+'💎','#a78bfa',r.width/2,r.height*0.5-25);
    }else{animShake()}
    upd();save();sLB();
}

function popup(title,content,onClose){
    var bg=document.createElement('div');bg.className='popup-bg';
    bg.innerHTML='<div class="popup"><h3>'+title+'</h3>'+content+'<button class="popup-close">Закрыть</button></div>';
    bg.querySelector('button').addEventListener('click',function(){bg.remove();if(onClose)onClose()});
    bg.addEventListener('click',function(e){if(e.target===bg){bg.remove();if(onClose)onClose()}});
    document.body.appendChild(bg);return bg;
}

function showShop(){

    shopItems.forEach(function(item){
        var cn=item.cur==='wood'?'🌲 За древесину':'💎 За кристаллы';
        if(cat!==cn){cat=cn;html+='<div class="shop-cat">'+cn+'</div>'}
        var cost=item.cost(),afford=item.cur==='wood'?P.wood>=cost:P.crystals>=cost;
        html+='<div class="shop-item"><div><span class="shop-name">'+item.name+'</span><br><span class="shop-desc">'+item.desc+'</span>'+(P.upgrades[item.id]>0?'<br><span class="shop-lvl">Ур. '+P.upgrades[item.id]+'</span>':'')+'</div><button class="shop-buy '+(item.cur==='wood'?'wood':'crystal')+'" data-id="'+item.id+'" '+(afford?'':'disabled')+'>'+fmt(cost)+' '+(item.cur==='wood'?'🌲':'💎')+'</button></div>';
    });
    var bg=popup('🏪 Магазин',html);
    bg.querySelectorAll('button[data-id]').forEach(function(b){b.addEventListener('click',function(){
        var item=shopItems.find(function(i){return i.id===this.dataset.id});if(!item)return;
        var cost=item.cost();if(item.cur==='wood'&&P.wood<cost)return;if(item.cur==='crystals'&&P.crystals<cost)return;

    })});
}

    html+='<div class="form-group"><label>Тип</label><select id="skinType" class="form-input"><option value="tree">🎄 Дерево</option><option value="axe">🪓 Топор</option></select></div>';
    html+='<div class="form-group"><label>Название</label><input type="text" id="skinName" class="form-input" placeholder="Мой скин"></div>';
    html+='<div class="form-group"><label>Эмодзи (если нет фото)</label><input type="text" id="skinEmoji" class="form-input" placeholder="🎄" value="🎄"></div>';
    html+='<div class="form-group"><label>Фото скина</label><input type="file" id="skinPhoto" class="form-input" accept="image/*" style="padding:8px;"></div>';
    html+='<div class="form-group"><label>Цена (кристаллы)</label><input type="number" id="skinPrice" class="form-input" placeholder="500" value="500"></div>';
    html+='<div class="form-group"><label style="color:#aaa;font-size:11px;"><input type="checkbox" id="skinHidden"> Скрытый скин</label></div>';
    html+='<div id="skinPreview" style="text-align:center;margin:8px 0;"></div>';
    html+='<button class="form-submit" id="saveSkinBtn">Добавить скин</button></div>';
    var bg=document.createElement('div');bg.className='popup-bg';
    bg.innerHTML='<div class="popup"><h3>➕ Добавить скин</h3>'+html+'<button class="popup-close">Закрыть</button></div>';
    document.body.appendChild(bg);
    bg.querySelector('.popup-close').addEventListener('click',function(){bg.remove()});
    bg.addEventListener('click',function(e){if(e.target===bg)bg.remove()});
    bg.querySelector('#skinPhoto').addEventListener('change',function(e){var file=e.target.files[0];if(file){var reader=new FileReader();reader.onload=function(ev){bg.querySelector('#skinPreview').innerHTML='<img src="'+ev.target.result+'" style="width:80px;height:80px;object-fit:contain;border-radius:8px;border:2px solid #e2a03f;"><br><span style="color:#4caf84;font-size:10px;">✅ Фото загружено</span>'};reader.readAsDataURL(file)}});
    bg.querySelector('#saveSkinBtn').addEventListener('click',function(){
        var type=bg.querySelector('#skinType').value,name=bg.querySelector('#skinName').value.trim(),emoji=bg.querySelector('#skinEmoji').value.trim();
        var price=parseInt(bg.querySelector('#skinPrice').value)||500,hidden=bg.querySelector('#skinHidden').checked,photoFile=bg.querySelector('#skinPhoto').files[0];
        if(!name){alert('Введите название!');return}if(!emoji&&!photoFile){alert('Введите эмодзи или загрузите фото!');return}if(price<1){alert('Цена > 0!');return}
        function saveSkin(imgData){var ns={id:'custom_'+Date.now(),name:name,emoji:emoji||'🎄',img:imgData||null,colors:['#4caf50','#66bb6a','#81c784'],price:price,cur:'crystals',hidden:hidden,type:type};
            if(type==='tree'){treeSkins.push(ns);localStorage.setItem('c_ts',JSON.stringify(treeSkins.filter(function(s){return s.id.indexOf('custom_')===0})))}else{axeSkins.push(ns);localStorage.setItem('c_as',JSON.stringify(axeSkins.filter(function(s){return s.id.indexOf('custom_')===0})))}
            alert('✅ Скин "'+name+'" добавлен!');bg.remove();showSkins();updateAdminSelects()}
        if(photoFile){var reader=new FileReader();reader.onload=function(ev){var img=new Image();img.onload=function(){var canvas=document.createElement('canvas');var maxW=200,scale=maxW/img.width;canvas.width=maxW;canvas.height=img.height*scale;var ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);saveSkin(canvas.toDataURL('image/jpeg',0.6))};img.src=ev.target.result};reader.readAsDataURL(photoFile)}else saveSkin(null);
    });
}

async function showLB(){
    var lb=await lLB();
    var html='<table class="lb-table"><thead><tr><th>#</th><th>Игрок</th><th>🌲</th><th>💎</th><th>🎄</th></tr></thead><tbody>';
    if(!lb.length)html+='<tr><td colspan="5" style="text-align:center;padding:20px;color:#aaa;">Нет игроков</td></tr>';
    else lb.forEach(function(e,i){var r=i+1,rc='',ri=r;if(r===1){rc='lb-gold';ri='🥇'}else if(r===2){rc='lb-silver';ri='🥈'}else if(r===3){rc='lb-bronze';ri='🥉'}html+='<tr class="'+((e.user_id||e.userId)===P.userId?'lb-me':'')+'" data-uid="'+(e.user_id||e.userId)+'" style="cursor:pointer;"><td class="lb-rank '+rc+'">'+ri+'</td><td>'+esc(e.name)+'</td><td>'+fmt(e.wood)+'</td><td>'+fmt(e.crystals)+'</td><td>'+(e.treeLevel||1)+'</td></tr>'});
    html+='</tbody></table>';
    var bg=popup('🏆 Рейтинг',html);
    if(uid===ADM){bg.querySelectorAll('tr[data-uid]').forEach(function(tr){tr.addEventListener('click',async function(){var uid2=this.dataset.uid;var r=await fetch(A+'/profile/'+uid2).then(r=>r.json());if(r.success&&r.profile){var p=r.profile;var info='👤 '+uid2+'\n🌲 '+fmt(p.wood||0)+'\n💎 '+fmt(p.crystals||0)+'\n🎄 Скинов: '+(p.ownedSkins||['default']).length+'\n🪓 Топоров: '+(p.ownedAxes||['default']).length+'\n📊 Уровень: '+(p.treeLevel||1);if(confirm(info+'\n\n🗑️ Удалить?')){await fetch(A+'/profile/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid2,wood:0,crystals:0,ownedSkins:['default'],ownedAxes:['default'],activeSkin:'default',activeAxe:'default',name:'Игрок',treeLevel:1,totalTrees:0})});await fetch(A+'/leaderboard/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid2,name:'Игрок',wood:0,crystals:0,treeLevel:1,totalTrees:0})});alert('✅ Удалён');bg.remove();showLB()}}})})}
}

async function showTrade(){
    var trades=await lTrades();
    var html='<div style="background:#1e2a3a;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;border:1px solid #2a2a4a;"><span style="color:#aaa;font-size:12px;">Ваш ID: <span style="color:#e2a03f;font-weight:700;font-family:monospace;font-size:13px;">'+P.userId+'</span></span><button id="btnCopyIdTrade" style="background:#e2a03f;color:#000;border:none;padding:6px 10px;border-radius:8px;font-size:11px;cursor:pointer;">📋 Копировать</button></div>';
    html+='<div class="create-form"><div class="form-group"><label>ID игрока (пусто = всем)</label><input type="text" id="tTi" class="form-input" placeholder="Вставьте ID..."></div><div class="form-group"><label>Скин</label><select id="tTs" class="form-input"><option value="">-- Выберите --</option>';
    P.ownedSkins.forEach(function(sid){if(sid==='default')return;var s=treeSkins.find(function(x){return x.id===sid});if(s)html+='<option value="'+s.id+'">'+(s.emoji||'🎄')+' '+s.name+(sid===P.activeSkin?' (активен)':'')+'</option>'});
    html+='</select></div><div class="form-group"><label>Валюта</label><select id="tTc" class="form-input"><option value="wood">🌲 Древесина</option><option value="crystals">💎 Кристаллы</option><option value="stars">⭐ Звёзды</option></select></div><div class="form-group"><label>Цена</label><input type="number" id="tTp" class="form-input" placeholder="100" min="1"></div><button id="btnCT" class="form-submit">Выставить</button></div><div class="section-title">📋 Предложения</div><div id="tL">';
    if(!trades.length)html+='<div style="text-align:center;padding:20px;color:#aaa;">Нет предложений</div>';
    else trades.forEach(function(trade){var isOwn=trade.sellerId===P.userId,canBuy=!isOwn&&(trade.currency==='wood'?P.wood>=trade.price:trade.currency==='crystals'?P.crystals>=trade.price:true)&&P.ownedSkins.indexOf(trade.skinId)===-1;
        var curIcon=trade.currency==='wood'?'🌲':trade.currency==='crystals'?'💎':'⭐';
        html+='<div class="trade-item"><div class="trade-header"><div><span class="trade-seller-name">'+esc(trade.sellerName)+'</span><br><span class="trade-seller-id">ID: '+trade.sellerId+'</span>'+(trade.targetId?'<br><span style="font-size:10px;color:#a78bfa;">🎯 Для: '+trade.targetId+'</span>':'')+'</div><span class="trade-price">'+fmt(trade.price)+' '+curIcon+'</span></div><div class="trade-tree">'+(trade.skinEmoji||'🎄')+' '+trade.skinName+'</div><button class="trade-btn '+(isOwn?'cancel':'buy')+'" data-action="'+(isOwn?'cancel':'buy')+'" data-id="'+trade.id+'" '+(isOwn||canBuy?'':'disabled')+'>'+(isOwn?'Отменить':(canBuy?'Купить':(P.ownedSkins.indexOf(trade.skinId)!==-1?'Уже есть':'Мало '+curIcon)))+'</button></div>'});
    html+='</div>';
    var bg=popup('💱 Торги',html);
    document.getElementById('btnCopyIdTrade').addEventListener('click',function(){navigator.clipboard.writeText(P.userId).then(function(){alert('✅ Скопировано!')})});
    bg.querySelector('#btnCT').addEventListener('click',async function(){var sid=bg.querySelector('#tTs').value,price=parseInt(bg.querySelector('#tTp').value),targetId=bg.querySelector('#tTi').value.trim(),cur=bg.querySelector('#tTc').value;if(!sid||!price||price<1){alert('Заполните поля');return}var r=await cTrade(sid,price,targetId,cur);if(r.success){P.ownedSkins=P.ownedSkins.filter(function(s){return s!==sid});if(P.activeSkin===sid)P.activeSkin='default';save();upd();bg.remove();showTrade()}});
    bg.querySelectorAll('#tL button[data-action]').forEach(function(btn){btn.addEventListener('click',async function(){if(this.dataset.action==='buy'){var r=await bTrade(this.dataset.id);if(r.success){if(r.currency==='wood')P.wood-=r.price;else if(r.currency==='crystals')P.crystals-=r.price;P.ownedSkins.push(r.skinId);save();upd();sLB()}}else{await xTrade(this.dataset.id)}bg.remove();showTrade()})});
}

function passive(){if(P.autoWood>0){P.wood+=P.autoWood;upd()}}

document.getElementById('bs').addEventListener('click',showShop);
document.getElementById('bl').addEventListener('click',showLB);
document.getElementById('bt').addEventListener('click',showSkins);
document.getElementById('btr').addEventListener('click',showTrade);
document.getElementById('tc').addEventListener('click',chop);
document.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();chop()}});

upd();sLB();updateAdminSelects();
setInterval(passive,1000);setInterval(save,10000);setInterval(sLB,30000);
</script>
