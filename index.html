<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Woodcutter | Telegram Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #1a1a2e; --panel: #16213e; --accent: #e2a03f;
            --text: #eee; --text-secondary: #aaa; --border: #2a2a4a;
            --gold: #ffd700;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:-apple-system,sans-serif; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
        .app-container { width:100%; height:100%; display:flex; justify-content:center; align-items:center; background:var(--bg); }
        .phone-frame { width:100%; height:100%; max-width:430px; background:var(--bg); display:flex; flex-direction:column; position:relative; overflow:hidden; }
        .header { background:var(--panel); padding:12px 16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border); flex-shrink:0; }
        .header .avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#e2a03f,#c47f2a); display:flex; align-items:center; justify-content:center; font-size:20px; overflow:hidden; background-size:cover; }
        .header .title { font-weight:600; color:var(--text); font-size:15px; }
        .header .subtitle { font-size:11px; color:var(--text-secondary); }
        .game-area { flex:1; display:flex; flex-direction:column; padding:10px; overflow-y:auto; gap:8px; -webkit-overflow-scrolling:touch; padding-bottom:20px; }
        .resources { display:flex; gap:8px; }
        .resource-card { flex:1; background:var(--panel); border-radius:12px; padding:10px 14px; display:flex; align-items:center; gap:10px; border:1px solid var(--border); }
        .resource-icon { font-size:22px; }
        .resource-info { display:flex; flex-direction:column; gap:2px; }
        .resource-value { font-size:18px; font-weight:700; color:var(--text); line-height:1; }
        .resource-label { font-size:10px; color:var(--text-secondary); }
        .tree-scene { background:var(--panel); border-radius:16px; padding:12px; display:flex; flex-direction:column; align-items:center; gap:8px; border:1px solid var(--border); }
        .tree-container { position:relative; width:100%; max-width:240px; aspect-ratio:3/4; cursor:pointer; }
        .tree-container:active { transform:scale(0.96); }
        .tree-container.shake { animation:shake 0.4s ease; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-4px)} 40%{transform:translateX(4px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }
        .tree-fall { animation:fall 0.6s ease forwards; }
        @keyframes fall { 0%{transform:rotate(0);opacity:1} 100%{transform:rotate(80deg) translateX(60px);opacity:0} }
        .tree-svg { width:100%; height:100%; pointer-events:none; }
        .axe-emoji { position:absolute; right:8%; top:42%; font-size:clamp(32px,10vw,45px); pointer-events:none; z-index:6; filter:drop-shadow(2px 3px 3px rgba(0,0,0,0.4)); }
        .axe-emoji.swing { animation:axeSwing 0.3s ease; }
        @keyframes axeSwing { 0%{transform:rotate(-40deg)} 50%{transform:rotate(20deg)} 100%{transform:rotate(0deg)} }
        .tree-level-badge { position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.8); color:var(--gold); padding:3px 8px; border-radius:12px; font-size:12px; font-weight:700; border:1px solid var(--gold); }
        .hp-bar-container { width:100%; background:#2a2a3a; border-radius:8px; height:14px; overflow:hidden; border:1px solid var(--border); }
        .hp-bar { height:100%; border-radius:8px; transition:width 0.3s ease; }
        .hp-bar.high { background:linear-gradient(90deg,#4caf84,#81c784); }
        .hp-bar.medium { background:linear-gradient(90deg,#f39c12,#e67e22); }
        .hp-bar.low { background:linear-gradient(90deg,#e74c3c,#c0392b); }
        .hp-text { font-size:12px; color:var(--text); text-align:center; font-weight:600; }
        .combo-display { color:var(--text-secondary); font-size:11px; text-align:center; min-height:16px; }
        .combo-fire { color:#ff6b35; }
        .combo-timer-bar { width:100%; height:4px; background:#2a2a3a; border-radius:2px; overflow:hidden; margin-top:4px; }
        .combo-timer-fill { height:100%; background:var(--accent); border-radius:2px; width:100%; transition:width 0.1s linear; }
        .float-text { position:absolute; font-weight:700; pointer-events:none; animation:floatUp 1s ease-out forwards; z-index:20; font-size:16px; }
        @keyframes floatUp { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-50px)} }
        .btn-row { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
        .btn { padding:12px 8px; border-radius:12px; border:none; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:4px; min-height:44px; }
        .btn:active { transform:scale(0.95); }
        .btn-shop { background:var(--panel); color:var(--text); border:1px solid var(--border); }
        .btn-leaderboard { background:linear-gradient(135deg,#ffd700,#ffaa00); color:#000; }
        .btn-trees { background:linear-gradient(135deg,#4caf50,#2d6b2d); color:#fff; }
        .btn-trade { background:linear-gradient(135deg,#a78bfa,#7c3aed); color:#fff; }
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.75); z-index:1000; display:none; align-items:flex-end; justify-content:center; pointer-events:none; }
        .modal-overlay.show { display:flex !important; pointer-events:auto; }
        .modal { background:var(--panel); border-radius:16px 16px 0 0; width:100%; max-width:430px; max-height:85vh; overflow-y:auto; padding:16px 12px 30px; border:1px solid var(--border); }
        .modal h3 { color:var(--text); font-size:18px; margin-bottom:12px; text-align:center; }
        .btn-close { width:100%; padding:14px; border-radius:12px; border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:15px; font-weight:600; cursor:pointer; margin-top:8px; min-height:44px; }
        .shop-category { color:var(--accent); font-size:13px; font-weight:700; margin:12px 0 6px; padding-bottom:4px; border-bottom:1px solid var(--border); }
        .shop-item { background:#1e2a3a; border-radius:12px; padding:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; border:1px solid var(--border); gap:8px; }
        .shop-item-name { font-weight:600; color:var(--text); font-size:14px; }
        .shop-item-desc { font-size:11px; color:var(--text-secondary); }
        .shop-item-level { font-size:10px; color:var(--accent); }
        .shop-item-buy { padding:8px 14px; border-radius:10px; border:none; font-weight:600; cursor:pointer; font-size:12px; }
        .buy-wood { background:#4caf84; color:#fff; }
        .buy-crystal { background:#a78bfa; color:#fff; }
        .shop-item-buy:disabled { opacity:0.4; }
        .skin-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
        .skin-card { background:#1e2a3a; border-radius:12px; padding:10px; text-align:center; border:2px solid var(--border); cursor:pointer; }
        .skin-card.active { border-color:var(--gold); }
        .skin-emoji { font-size:32px; display:block; margin-bottom:6px; }
        .skin-name { font-size:11px; color:var(--text); font-weight:600; }
        .skin-price { font-size:10px; color:var(--accent); margin-top:3px; }
        .skin-price-star { font-size:10px; color:var(--gold); margin-top:3px; }
        .player-id-box { background:#1e2a3a; border-radius:10px; padding:10px 14px; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; }
        .id-value { color:var(--accent); font-weight:700; font-family:monospace; font-size:12px; }
        .copy-btn { background:var(--accent); color:#000; border:none; padding:6px 10px; border-radius:8px; font-size:11px; cursor:pointer; }
        .trade-item { background:#1e2a3a; border-radius:12px; padding:12px; margin-bottom:8px; border:1px solid var(--border); }
        .trade-header { display:flex; justify-content:space-between; margin-bottom:6px; }
        .trade-seller { font-weight:600; color:var(--text); font-size:13px; }
        .trade-price { color:var(--accent); font-weight:700; }
        .trade-tree { font-size:20px; text-align:center; margin:6px 0; }
        .trade-btn { width:100%; padding:10px; border-radius:10px; border:none; color:#fff; font-weight:600; cursor:pointer; margin-top:6px; }
        .trade-btn.buy { background:#4caf84; }
        .trade-btn.cancel { background:#e74c3c; }
        .trade-btn:disabled { opacity:0.4; }
        .create-form { background:#1e2a3a; border-radius:12px; padding:12px; margin-bottom:12px; border:1px solid var(--border); }
        .form-group { margin-bottom:8px; }
        .form-group label { display:block; color:var(--text-secondary); font-size:11px; margin-bottom:3px; }
        .form-group select, .form-group input { width:100%; padding:10px; border-radius:10px; border:1px solid var(--border); background:#16213e; color:var(--text); font-size:14px; }
        .form-submit { width:100%; padding:12px; border-radius:10px; border:none; background:var(--accent); color:#000; font-weight:700; cursor:pointer; }
        .leaderboard-table { width:100%; border-collapse:collapse; }
        .leaderboard-table th, .leaderboard-table td { padding:8px 6px; text-align:left; border-bottom:1px solid var(--border); color:var(--text); font-size:12px; }
        .leaderboard-table th { color:var(--text-secondary); font-size:10px; }
        .rank { font-weight:700; font-size:14px; width:35px; text-align:center; }
        .rank-1 { color:var(--gold); } .rank-2 { color:#c0c0c0; } .rank-3 { color:#cd7f32; }
        .player-row { background:rgba(226,160,63,0.15); }
        .player-row td { border-bottom:2px solid var(--accent); }
        .no-data { text-align:center; padding:20px; color:var(--text-secondary); }
        .passive-info { text-align:center; color:var(--text-secondary); font-size:11px; }
        .status-bar { font-size:10px; text-align:center; padding:4px; border-radius:8px; margin-top:4px; }
        .status-bar.online { background:rgba(76,175,132,0.2); color:#4caf84; }
    </style>
</head>
<body>

<div class="app-container">
<div class="phone-frame">
    <div class="header">
        <div class="avatar" id="headerAvatar">🪓</div>
        <div><div class="title">Woodcutter</div><div class="subtitle" id="playerNameDisplay">...</div></div>
    </div>
    <div class="game-area">
        <div class="resources">
            <div class="resource-card"><span class="resource-icon">🌲</span><div class="resource-info"><span class="resource-value" id="woodCount">0</span><span class="resource-label">Древесина</span></div></div>
            <div class="resource-card"><span class="resource-icon">💎</span><div class="resource-info"><span class="resource-value" id="crystalCount">0</span><span class="resource-label">Кристаллы</span></div></div>
        </div>
        <div class="tree-scene">
            <div class="tree-container" id="treeContainer">
                <div class="tree-level-badge" id="treeLevelBadge">🌲 Ур. 1</div>
                <div class="axe-emoji" id="axeEmoji">🪓</div>
                <svg class="tree-svg" viewBox="0 0 260 360"><ellipse cx="130" cy="330" rx="110" ry="20" fill="#3d2b1f" opacity="0.6"/><rect x="115" y="180" width="30" height="152" rx="7" fill="#6b4226" id="trunk"/><ellipse cx="130" cy="130" rx="85" ry="75" fill="#3a7d3a" id="crown1"/><ellipse cx="130" cy="85" rx="70" ry="65" fill="#4caf50" id="crown2"/><ellipse cx="130" cy="45" rx="55" ry="55" fill="#66bb6a" id="crown3"/></svg>
                <div id="floatTextContainer" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></div>
            </div>
            <div class="hp-bar-container"><div class="hp-bar high" id="hpBar" style="width:100%;"></div></div>
            <div class="hp-text" id="hpText">15 / 15 HP</div>
            <div class="combo-display" id="comboDisplay">Нажимай на дерево! 🪓</div>
            <div class="combo-timer-bar" id="comboTimerBar" style="display:none;"><div class="combo-timer-fill" id="comboTimerFill" style="width:100%;"></div></div>
        </div>
        <div class="btn-row">
            <button class="btn btn-shop" id="btnShop">🏪 Магазин</button>
            <button class="btn btn-leaderboard" id="btnLeaderboard">🏆 Рейтинг</button>
            <button class="btn btn-trees" id="btnSkins">🎄 Скины</button>
            <button class="btn btn-trade" id="btnTrade">💱 Торги</button>
        </div>
        <div class="passive-info" id="passiveInfo"></div>
    </div>
</div>
</div>

<div class="modal-overlay" id="shopOverlay"><div class="modal"><h3>🏪 Магазин</h3><div id="shopItems"></div><button class="btn-close" id="btnCloseShop">Закрыть</button></div></div>
<div class="modal-overlay" id="leaderboardOverlay"><div class="modal"><h3>🏆 Рейтинг</h3><table class="leaderboard-table"><thead><tr><th>#</th><th>Игрок</th><th>🌲</th><th>💎</th><th>🎄</th></tr></thead><tbody id="leaderboardBody"></tbody></table><button class="btn-close" id="btnCloseLeaderboard">Закрыть</button></div></div>
<div class="modal-overlay" id="skinsOverlay"><div class="modal"><h3>🎄 Скины</h3><div class="skin-grid" id="skinGrid"></div><button class="btn-close" id="btnCloseSkins">Закрыть</button></div></div>
<div class="modal-overlay" id="tradeOverlay"><div class="modal"><h3>💱 Торги</h3><div class="player-id-box"><span>ID: <span class="id-value" id="myPlayerId"></span></span><button class="copy-btn" id="btnCopyId">📋</button></div><div class="create-form"><div class="form-group"><label>ID игрока</label><input type="text" id="tradeTargetId" placeholder="Пусто = всем"></div><div class="form-group"><label>Скин</label><select id="tradeSkinSelect"></select></div><div class="form-group"><label>Цена 🌲</label><input type="number" id="tradePriceInput" placeholder="100" min="1"></div><button class="form-submit" id="btnCreateTrade">Выставить</button></div><h4 style="color:var(--text);margin:12px 0 8px;">📋 Предложения</h4><div id="tradeList"></div><button class="btn-close" id="btnCloseTrade">Закрыть</button></div></div>

<script>
const API_URL = 'https://delay.pythonanywhere.com/api';
const tg = window.Telegram.WebApp;
tg.expand(); tg.ready();

// Скрываем все модалки
document.querySelectorAll('.modal-overlay').forEach(el => el.classList.remove('show'));

const tgUser = tg.initDataUnsafe?.user;
const userId = tgUser ? 'WC' + String(tgUser.id).slice(-6).padStart(6,'0') : 'WC' + Math.random().toString(36).substr(2,6).toUpperCase();
const playerName = tgUser ? (tgUser.first_name + (tgUser.last_name?' '+tgUser.last_name:'')) : 'Игрок';
const STORAGE_KEY = 'wc_' + userId;

console.log('🪓 Woodcutter | ID:', userId, '| TG:', tg.version);

if(tgUser?.photo_url) {
    document.getElementById('headerAvatar').style.backgroundImage = `url(${tgUser.photo_url})`;
    document.getElementById('headerAvatar').textContent = '';
}

function showModal(id) { document.getElementById(id).classList.add('show'); }
function hideModal(id) { document.getElementById(id).classList.remove('show'); }

async function api(endpoint, method='GET', body=null) {
    try {
        const opts = { method, headers: {'Content-Type':'application/json'} };
        if(body) opts.body = JSON.stringify(body);
        const res = await fetch(API_URL + endpoint, opts);
        return await res.json();
    } catch(e) { return {success:false}; }
}

async function sendLB() { await api('/leaderboard/update','POST',{user_id:userId,name:playerName,wood:player.wood,crystals:player.crystals,treeLevel:player.treeLevel,totalTrees:player.totalTrees}); }
async function loadLB() { const r=await api('/leaderboard'); return r.success?r.players:[]; }
async function loadTrades() { const r=await api('/trades?user_id='+userId); return r.success?r.trades:[]; }
async function createTrade(skinId,price,targetId) { const skin=treeSkins.find(s=>s.id===skinId); return await api('/trades/create','POST',{sellerId:userId,sellerName:playerName,targetId:targetId||null,skinId,price,skinName:skin.name,skinEmoji:skin.emoji}); }
async function buyTrade(tradeId) { return await api('/trades/buy','POST',{trade_id:tradeId,buyer_id:userId}); }
async function cancelTrade(tradeId) { return await api('/trades/cancel','POST',{trade_id:tradeId,user_id:userId}); }

const treeSkins = [
    { id:'default', name:'Обычное', emoji:'🌳', colors:['#3a7d3a','#4caf50','#66bb6a'], price:0, cur:'free' },
    { id:'autumn', name:'Осеннее', emoji:'🍂', colors:['#c47f2a','#d4943a','#e2a03f'], price:500, cur:'crystals' },
    { id:'cherry', name:'Сакура', emoji:'🌸', colors:['#ff9ec4','#ffbdd4','#ffd1e4'], price:800, cur:'crystals' },
    { id:'crystal', name:'Кристальное', emoji:'💎', colors:['#a78bfa','#c4b5fd','#ddd6fe'], price:1200, cur:'crystals' },
    { id:'golden', name:'Золотое', emoji:'✨', colors:['#d4a017','#e6c22a','#f0d840'], price:2000, cur:'crystals' },
    { id:'inferno', name:'Огненное', emoji:'🔥', colors:['#cc3300','#e64d00','#ff6600'], price:3500, cur:'crystals' },
    { id:'ocean', name:'Океанское', emoji:'🌊', colors:['#0066cc','#0088e6','#00aaff'], price:10, cur:'stars' },
    { id:'void', name:'Бездны', emoji:'🕳️', colors:['#1a0033','#2d004d','#400066'], price:25, cur:'stars' },
    { id:'rainbow', name:'Радужное', emoji:'🌈', colors:['#ff0000','#ff7700','#ffff00'], price:50, cur:'stars' },
];

let player = { name:playerName, userId, wood:0, crystals:0, stars:0, axePower:1, crystalBonus:1, autoWood:0, critChance:0, critMultiplier:2.0, crystalToWoodRate:0, comboBonus:0, combo:0, comboMultiplier:1.0, treeHP:15, maxTreeHP:15, totalTrees:0, treeLevel:1, activeSkin:'default', ownedSkins:['default'], upgrades:{} };

try { const s=localStorage.getItem(STORAGE_KEY); if(s) Object.assign(player, JSON.parse(s)); } catch(e) {}
player.name=playerName; player.userId=userId;
if(!player.maxTreeHP||player.maxTreeHP<10) { player.maxTreeHP=15; player.treeHP=15; }
if(!player.ownedSkins||!player.ownedSkins.length) player.ownedSkins=['default'];
if(!player.activeSkin) player.activeSkin='default';
if(!player.upgrades) player.upgrades={};
['axe','strength','crystal1','crystal2','auto1','auto2','auto3','auto4','crit1','crit2','crystalToWood1','crystalToWood2','crystalAuto1','crystalAuto2','critDamage1','comboBoost1'].forEach(id=>{ if(!(id in player.upgrades)) player.upgrades[id]=0; });

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(player)); }

function calcHP(lv) { const bMin=15,bMax=30; let m; if(lv<=10)m=1+(lv-1)*0.5; else if(lv<=50)m=5.5+(lv-10)*0.3; else if(lv<=200)m=17.5+(lv-50)*0.2; else if(lv<=1000)m=47.5+(lv-200)*0.1; else if(lv<=5000)m=127.5+(lv-1000)*0.05; else m=327.5+(lv-5000)*0.02; return Math.floor(rand(bMin*m+(lv-1)*5,bMax*m+(lv-1)*5)); }

const shopItems = [
    { cat:'🌲 За древесину', id:'axe', name:'🪓 Топор получше', desc:'+1 к силе', base:10, mult:1.5, cur:'wood', cost(){return Math.floor(this.base*Math.pow(this.mult,player.upgrades.axe||0));}, eff(){player.axePower++;player.upgrades.axe=(player.upgrades.axe||0)+1;} },
    { cat:'🌲 За древесину', id:'strength', name:'💪 Силашка', desc:'+2 к силе', base:25, mult:1.6, cur:'wood', cost(){return Math.floor(this.base*Math.pow(this.mult,player.upgrades.strength||0));}, eff(){player.axePower+=2;player.upgrades.strength=(player.upgrades.strength||0)+1;} },
    { cat:'🌲 За древесину', id:'auto1', name:'🌱 Саженец', desc:'+1/с авто', base:50, mult:1.4, cur:'wood', cost(){return Math.floor(this.base*Math.pow(this.mult,player.upgrades.auto1||0));}, eff(){player.autoWood++;player.upgrades.auto1=(player.upgrades.auto1||0)+1;} },
    { cat:'💎 За кристаллы', id:'crystal1', name:'💎 Кристальный глаз', desc:'+1💎 за сруб', base:5, mult:2.0, cur:'crystals', cost(){return Math.floor(this.base*Math.pow(this.mult,player.upgrades.crystal1||0));}, eff(){player.crystalBonus++;player.upgrades.crystal1=(player.upgrades.crystal1||0)+1;} },
];

function updateUI() {
    document.getElementById('woodCount').textContent = fmt(player.wood);
    document.getElementById('crystalCount').textContent = fmt(player.crystals);
    const hpPct = Math.max(0, (player.treeHP/Math.max(1,player.maxTreeHP))*100);
    const hpb = document.getElementById('hpBar'); hpb.style.width = hpPct+'%';
    hpb.className = 'hp-bar ' + (hpPct>60?'high':hpPct>30?'medium':'low');
    document.getElementById('hpText').textContent = `${fmt(Math.max(0,player.treeHP))} / ${fmt(player.maxTreeHP)} HP`;
    document.getElementById('treeLevelBadge').textContent = `🌲 Ур. ${player.treeLevel}`;
    document.getElementById('playerNameDisplay').textContent = player.name;
    document.getElementById('comboDisplay').innerHTML = player.combo>1 ? `<span class="combo-fire">🔥 Комбо x${player.combo}</span>` : 'Нажимай на дерево! 🪓';
    document.getElementById('passiveInfo').textContent = player.autoWood>0?`⏳ +${player.autoWood} 🌲/сек`:'';
    const skin = treeSkins.find(s=>s.id===player.activeSkin)||treeSkins[0];
    const colors = hpPct>60?skin.colors:(hpPct>30?['#e67e22','#f39c12','#f1c40f']:['#c0392b','#e74c3c','#ff6b6b']);
    document.getElementById('crown1').setAttribute('fill',colors[0]);
    document.getElementById('crown2').setAttribute('fill',colors[1]);
    document.getElementById('crown3').setAttribute('fill',colors[2]);
    document.getElementById('myPlayerId').textContent = player.userId;
}

function fmt(n) { return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':Math.floor(n).toString(); }
function rand(min,max) { return Math.random()*(max-min)+min; }
function esc(t) { const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

const COMBO_TIMEOUT = 5000;
let comboTimer = null;
function resetCombo() {
    if(comboTimer) clearTimeout(comboTimer);
    const bar = document.getElementById('comboTimerBar'), fill = document.getElementById('comboTimerFill');
    if(player.combo > 0) {
        bar.style.display = 'block'; fill.style.transition = 'none'; fill.style.width = '100%';
        requestAnimationFrame(() => { fill.style.transition = `width ${COMBO_TIMEOUT}ms linear`; fill.style.width = '0%'; });
        comboTimer = setTimeout(() => { player.combo = 0; player.comboMultiplier = 1.0; bar.style.display = 'none'; fill.style.transition = 'none'; fill.style.width = '100%'; updateUI(); }, COMBO_TIMEOUT);
    } else { bar.style.display = 'none'; }
}

const axeEmoji=document.getElementById('axeEmoji'), treeContainer=document.getElementById('treeContainer'), floatContainer=document.getElementById('floatTextContainer');
function animAxe(){axeEmoji.classList.remove('swing');void axeEmoji.offsetWidth;axeEmoji.classList.add('swing');}
function animShake(){treeContainer.classList.add('shake');setTimeout(()=>treeContainer.classList.remove('shake'),400);}
function animFall(cb){treeContainer.classList.add('tree-fall');setTimeout(()=>{treeContainer.classList.remove('tree-fall');if(cb)cb();},600);}
function floatText(text,color,x,y){const el=document.createElement('div');el.className='float-text';el.textContent=text;el.style.color=color;el.style.left=x+'px';el.style.top=y+'px';floatContainer.appendChild(el);setTimeout(()=>el.remove(),1000);}

async function chopTree() {
    if(player.treeHP<=0) return;
    let dmg=player.axePower; const crit=Math.random()*100<player.critChance;
    if(crit) dmg=Math.floor(dmg*player.critMultiplier);
    player.combo=Math.min(50,player.combo+1); player.comboMultiplier=1.0+player.combo*(0.01+player.comboBonus/100);
    dmg=Math.max(1,Math.floor(dmg*player.comboMultiplier)); player.treeHP-=dmg; player.wood+=dmg;
    animAxe(); resetCombo();
    const r=treeContainer.getBoundingClientRect();
    floatText((crit?'💥+':'+')+fmt(dmg)+'🌲',crit?'#ff6b6b':'#e2a03f',r.width/2,r.height*0.5);
    if(player.treeHP<=0){
        player.crystals+=player.crystalBonus;
        if(player.crystalToWoodRate>0&&player.crystals>0){const conv=Math.floor(player.crystals*player.crystalToWoodRate);player.wood+=conv;floatText('🔄+'+fmt(conv)+'🌲','#4caf84',r.width/2,r.height*0.5+20);}
        player.totalTrees++; player.treeLevel=Math.min(Math.floor(player.totalTrees/2)+1,9999);
        animFall(()=>{player.maxTreeHP=calcHP(player.treeLevel);player.treeHP=player.maxTreeHP;updateUI();});
        floatText('🎉+'+player.crystalBonus+'💎','#a78bfa',r.width/2,r.height*0.5-25);
    } else animShake();
    updateUI(); save(); sendLB();
}

function openShop(){
    const el=document.getElementById('shopItems'); el.innerHTML=''; let cat='';
    shopItems.forEach(item=>{
        if(item.cat!==cat){cat=item.cat;el.innerHTML+=`<div class="shop-category">${cat}</div>`;}
        const cost=item.cost(), afford=item.cur==='wood'?player.wood>=cost:player.crystals>=cost;
        el.innerHTML+=`<div class="shop-item"><div><span class="shop-item-name">${item.name}</span><br><span class="shop-item-desc">${item.desc}</span>${(player.upgrades[item.id]||0)>0?`<br><span class="shop-item-level">Ур. ${player.upgrades[item.id]}</span>`:''}</div><button class="shop-item-buy ${item.cur==='wood'?'buy-wood':'buy-crystal'}" data-id="${item.id}" ${!afford?'disabled':''}>${fmt(cost)} ${item.cur==='wood'?'🌲':'💎'}</button></div>`;
    });
    document.querySelectorAll('.shop-item-buy').forEach(b=>b.addEventListener('click',function(){buyUpgrade(this.dataset.id);}));
    showModal('shopOverlay');
}
function buyUpgrade(id){const item=shopItems.find(i=>i.id===id);if(!item)return;const cost=item.cost();if(item.cur==='wood'&&player.wood<cost)return;if(item.cur==='crystals'&&player.crystals<cost)return;if(item.cur==='wood')player.wood-=cost;else player.crystals-=cost;item.eff();updateUI();save();sendLB();openShop();}

function openSkins(){
    const grid=document.getElementById('skinGrid'); grid.innerHTML='';
    treeSkins.forEach(skin=>{
        const owned=player.ownedSkins.includes(skin.id), active=player.activeSkin===skin.id;
        const card=document.createElement('div'); card.className=`skin-card ${active?'active':''}`;
        let priceHTML='';
        if(!owned){if(skin.cur==='free')priceHTML='<span class="skin-price">Бесплатно</span>';else if(skin.cur==='crystals')priceHTML=`<span class="skin-price">🔒 ${fmt(skin.price)} 💎</span>`;else priceHTML=`<span class="skin-price-star">⭐ ${skin.price} звёзд</span>`;}
        card.innerHTML=`<span class="skin-emoji">${skin.emoji}</span><span class="skin-name">${skin.name}</span>${priceHTML}${active?'<span style="color:#ffd700;font-size:10px;">✅</span>':''}`;
        card.addEventListener('click',()=>{
            if(owned){player.activeSkin=skin.id;updateUI();save();openSkins();}
            else if(skin.cur==='free'){player.ownedSkins.push(skin.id);player.activeSkin=skin.id;updateUI();save();openSkins();}
            else if(skin.cur==='crystals'){if(player.crystals>=skin.price){if(confirm(`Купить за ${skin.price}💎?`)){player.crystals-=skin.price;player.ownedSkins.push(skin.id);player.activeSkin=skin.id;updateUI();save();openSkins();}}else alert('Недостаточно кристаллов!');}
            else if(skin.cur==='stars'){
                if(typeof tg.openInvoice === 'function'){
                    api('/create-star-invoice','POST',{user_id:userId,skin_id:skin.id,skin_name:skin.name,price:skin.price}).then(result=>{
                        if(result.success && result.invoice_link){tg.openInvoice(result.invoice_link,(status)=>{if(status==='paid'){player.ownedSkins.push(skin.id);player.activeSkin=skin.id;updateUI();save();openSkins();}});}
                        else alert('❌ Ошибка создания счёта');
                    });
                } else alert('⭐ Откройте игру через бота Telegram');
            }
        });
        grid.appendChild(card);
    });
    showModal('skinsOverlay');
}

async function renderTradeList(trades){
    const list=document.getElementById('tradeList'); list.innerHTML='';
    if(!trades.length){list.innerHTML='<p class="no-data">Нет предложений</p>';return;}
    trades.forEach(trade=>{
        const isOwn=trade.sellerId===player.userId, canBuy=!isOwn&&player.wood>=trade.price&&!player.ownedSkins.includes(trade.skinId);
        const div=document.createElement('div'); div.className='trade-item';
        div.innerHTML=`<div class="trade-header"><div><span class="trade-seller">${esc(trade.sellerName)}</span><br><span style="font-size:10px;color:var(--text-secondary);">ID: ${trade.sellerId}</span></div><span class="trade-price">${fmt(trade.price)} 🌲</span></div><div class="trade-tree">${trade.skinEmoji} ${trade.skinName}</div>${trade.targetId?`<div style="font-size:10px;color:#a78bfa;text-align:center;">🎯 Для: ${trade.targetId}</div>`:''}<button class="trade-btn ${isOwn?'cancel':'buy'}" data-action="${isOwn?'cancel':'buy'}" data-id="${trade.id}" ${!isOwn&&!canBuy?'disabled':''}>${isOwn?'Отменить':(canBuy?'Купить':(player.ownedSkins.includes(trade.skinId)?'Уже есть':'Мало 🌲'))}</button>`;
        div.querySelector('button').addEventListener('click', async function(){
            if(this.dataset.action==='buy'){const r=await buyTrade(this.dataset.id);if(r.success){player.wood-=r.price;player.ownedSkins.push(r.skinId);save();updateUI();sendLB();}}
            else{await cancelTrade(this.dataset.id);}
            renderTradeList(await loadTrades());
        });
        list.appendChild(div);
    });
}

async function openTrade(){
    const sel=document.getElementById('tradeSkinSelect'); sel.innerHTML='<option value="">-- Выберите --</option>';
    player.ownedSkins.forEach(sid=>{if(sid==='default')return;const s=treeSkins.find(x=>x.id===sid);if(s)sel.innerHTML+=`<option value="${s.id}">${s.emoji} ${s.name}${sid===player.activeSkin?' (активен)':''}</option>`;});
    document.getElementById('tradePriceInput').value=''; document.getElementById('tradeTargetId').value='';
    renderTradeList(await loadTrades());
    showModal('tradeOverlay');
}

async function createTradeSubmit(){
    const sid=document.getElementById('tradeSkinSelect').value, price=parseInt(document.getElementById('tradePriceInput').value), targetId=document.getElementById('tradeTargetId').value.trim();
    if(!sid||!price||price<1){alert('Заполните поля');return;}
    if(sid==='default'){alert('Нельзя продать стандартный скин!');return;}
    const r=await createTrade(sid,price,targetId);
    if(r.success){player.ownedSkins=player.ownedSkins.filter(s=>s!==sid);if(player.activeSkin===sid)player.activeSkin='default';save();updateUI();renderTradeList(await loadTrades());}
}

async function renderLB(){
    const tbody=document.getElementById('leaderboardBody'); tbody.innerHTML='<tr><td colspan="5" class="no-data">Загрузка...</td></tr>';
    const lb=await loadLB(); tbody.innerHTML='';
    if(!lb.length){tbody.innerHTML='<tr><td colspan="5" class="no-data">Игроков пока нет</td></tr>';return;}
    lb.forEach((e,i)=>{const r=i+1;let rc='',ri=r;if(r===1){rc='rank-1';ri='🥇';}else if(r===2){rc='rank-2';ri='🥈';}else if(r===3){rc='rank-3';ri='🥉';}tbody.innerHTML+=`<tr class="${(e.user_id||e.userId)===player.userId?'player-row':''}"><td class="rank ${rc}">${ri}</td><td>${esc(e.name)}</td><td>${fmt(e.wood)}</td><td>${fmt(e.crystals)}</td><td>${e.treeLevel||1}</td></tr>`;});
}

async function openLeaderboard(){ showModal('leaderboardOverlay'); await renderLB(); }

function passiveIncome(){if(player.autoWood>0){player.wood+=player.autoWood;updateUI();}}

// Кнопки
document.getElementById('btnShop').addEventListener('click', openShop);
document.getElementById('btnLeaderboard').addEventListener('click', openLeaderboard);
document.getElementById('btnSkins').addEventListener('click', openSkins);
document.getElementById('btnTrade').addEventListener('click', openTrade);
document.getElementById('btnCloseShop').addEventListener('click', ()=>hideModal('shopOverlay'));
document.getElementById('btnCloseLeaderboard').addEventListener('click', ()=>hideModal('leaderboardOverlay'));
document.getElementById('btnCloseSkins').addEventListener('click', ()=>hideModal('skinsOverlay'));
document.getElementById('btnCloseTrade').addEventListener('click', ()=>hideModal('tradeOverlay'));
document.getElementById('btnCreateTrade').addEventListener('click', createTradeSubmit);
document.getElementById('btnCopyId').addEventListener('click', ()=>navigator.clipboard.writeText(player.userId).then(()=>alert('✅ Скопировано!')));
treeContainer.addEventListener('click', chopTree);
document.addEventListener('keydown', e=>{if(e.code==='Space'){e.preventDefault();chopTree();}});
['shopOverlay','leaderboardOverlay','skinsOverlay','tradeOverlay'].forEach(id=>document.getElementById(id).addEventListener('click',function(e){if(e.target===this)hideModal(id);}));

updateUI();
sendLB();
setInterval(passiveIncome,1000);
setInterval(save,10000);
setInterval(sendLB,30000);
</script>
</body>
</html>
