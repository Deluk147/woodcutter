<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Woodcutter | Telegram Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Стили те же, что и раньше -->
</head>
<body>
<!-- Та же структура -->

<script>
// ==================== КОНФИГУРАЦИЯ ====================
const API_URL = 'https://delay.pythonanywhere.com/api';
const tg = window.Telegram.WebApp;
tg.expand();
tg.ready();

const user = tg.initDataUnsafe?.user;
const userId = user ? 'WC' + String(user.id).slice(-6).padStart(6, '0') : 'WC' + Math.random().toString(36).substr(2, 6).toUpperCase();
const userName = user ? (user.first_name + (user.last_name ? ' ' + user.last_name : '')) : 'Игрок';
const STORAGE_KEY = 'wc_' + userId;
const ADMIN_ID = 'WC046190';

console.log('🌲 Woodcutter v3.0');
console.log('👤 User ID:', userId);
console.log('📱 Telegram methods:', {
    openInvoice: typeof tg.openInvoice === 'function',
    sendStarInvoice: typeof tg.sendStarInvoice === 'function'
});

// ... (все остальные функции до showSkins)

// ==================== ПОКУПКА СКИНА ЗА ЗВЕЗДЫ ====================
async function buySkinWithStars(skin, type, owned, bg, currentTab) {
    if (!confirm('Купить скин "' + skin.name + '" за ' + skin.price + ' ⭐?')) return;
    
    console.log('⭐ Покупка скина за звезды:', skin.name, skin.price);
    
    // Пробуем сначала sendStarInvoice (новый метод)
    if (typeof tg.sendStarInvoice === 'function') {
        console.log('📱 Используем sendStarInvoice');
        tg.sendStarInvoice({
            title: 'Скин: ' + skin.name,
            description: 'Скин для игры Woodcutter',
            payload: 'shop_' + skin.id + '_' + userId + '_' + Date.now(),
            currency: 'XTR',
            prices: [{ amount: skin.price, label: skin.name }]
        }, async function(status) {
            console.log('⭐ sendStarInvoice result:', status);
            if (status === 'paid') {
                addSkinAfterPurchase(skin, type, owned, bg, currentTab);
            } else if (status === 'cancelled') {
                alert('❌ Оплата отменена');
            } else if (status === 'failed') {
                alert('❌ Ошибка оплаты');
            } else {
                // Пробуем fallback на openInvoice
                console.log('⚠️ Неизвестный статус, пробуем openInvoice');
                await buyWithOpenInvoice(skin, type, owned, bg, currentTab);
            }
        });
    } 
    // Пробуем openInvoice (старый метод)
    else if (typeof tg.openInvoice === 'function') {
        console.log('📱 Используем openInvoice (fallback)');
        await buyWithOpenInvoice(skin, type, owned, bg, currentTab);
    } 
    // Ни один метод не доступен
    else {
        console.log('❌ Методы оплаты не доступны');
        alert('❌ Покупки за звезды доступны только через официального бота Telegram.\n\n' +
              'Убедитесь, что:\n' +
              '1. Вы открыли игру через бота @WoodcutterBot\n' +
              '2. Бот настроен для приема платежей\n' +
              '3. У вас достаточно звезд Telegram');
    }
}

// Покупка через openInvoice
async function buyWithOpenInvoice(skin, type, owned, bg, currentTab) {
    try {
        console.log('📄 Запрашиваем инвойс...');
        const result = await fetch(API_URL + '/create-star-invoice', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                user_id: userId,
                skin_id: skin.id,
                skin_name: skin.name,
                price: skin.price,
                type: 'shop'
            })
        }).then(r => r.json());
        
        console.log('📄 Инвойс ответ:', result);
        
        if (result.success && result.invoice_link) {
            console.log('💰 Открываем инвойс:', result.invoice_link);
            tg.openInvoice(result.invoice_link, async function(status) {
                console.log('💰 Статус оплаты:', status);
                if (status === 'paid') {
                    addSkinAfterPurchase(skin, type, owned, bg, currentTab);
                } else {
                    alert('❌ Оплата не прошла или была отменена');
                }
            });
        } else {
            const errorMsg = result.error || 'Не удалось создать счет';
            console.error('❌ Ошибка инвойса:', errorMsg);
            
            // Если бот не настроен - показываем понятное сообщение
            if (errorMsg.includes('BOT_TOKEN') || errorMsg.includes('бот')) {
                alert('⚠️ Бот не настроен для приема платежей.\n\n' +
                      'Администратору необходимо:\n' +
                      '1. Создать бота через @BotFather\n' +
                      '2. Получить токен бота\n' +
                      '3. Добавить BOT_TOKEN в переменные окружения на PythonAnywhere');
            } else {
                alert('❌ Ошибка создания счета: ' + errorMsg + '\n\nПопробуйте позже или используйте другой способ оплаты.');
            }
        }
    } catch (e) {
        console.error('❌ Ошибка запроса инвойса:', e);
        alert('❌ Ошибка соединения с сервером. Проверьте интернет и попробуйте снова.');
    }
}

// Добавление скина после успешной покупки
async function addSkinAfterPurchase(skin, type, owned, bg, currentTab) {
    console.log('✅ Добавляем скин после покупки:', skin.id);
    
    if (owned.indexOf(skin.id) === -1) {
        owned.push(skin.id);
        if (type === 'tree') {
            playerData.activeSkin = skin.id;
        } else {
            playerData.activeAxe = skin.id;
        }
        playerData.stars = (playerData.stars || 0) + skin.price;
        updateUI();
        saveData();
        
        // 5% админу
        const adminCut = Math.floor(skin.price * 0.05);
        if (adminCut > 0) {
            try {
                const adminProfile = await fetch(API_URL + '/profile/' + ADMIN_ID).then(r => r.json());
                if (adminProfile.success) {
                    const ap = adminProfile.profile || {};
                    ap.stars = (ap.stars || 0) + adminCut;
                    await fetch(API_URL + '/profile/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user_id: ADMIN_ID,
                            stars: ap.stars,
                            wood: ap.wood || 0,
                            crystals: ap.crystals || 0
                        })
                    });
                }
            } catch (e) {
                console.error('Ошибка обновления звезд админа:', e);
            }
        }
        
        bg.remove();
        // Перерисовываем скины
        if (typeof render === 'function') {
            render(currentTab);
        } else {
            showSkins();
        }
        alert('✅ Скин "' + skin.name + '" успешно куплен!');
    }
}

// ==================== ТОРГИ ====================
async function showTrade() {
    const trades = await fetch(API_URL + '/trades?user_id=' + userId).then(r => r.json())
        .then(r => r.success ? r.trades : []);
    
    let html = '<div style="background:#1e2a3a;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;border:1px solid #2a2a4a;">';
    html += '<span style="color:#aaa;font-size:12px;">Ваш ID: <span style="color:#e2a03f;font-weight:700;font-family:monospace;font-size:13px;">' + playerData.userId + '</span></span>';
    html += '<button id="btnCopyIdTrade" style="background:#e2a03f;color:#000;border:none;padding:6px 10px;border-radius:8px;font-size:11px;cursor:pointer;">📋 Копировать</button></div>';
    
    // Форма создания
    html += '<div class="create-form">';
    html += '<div class="form-group"><label>ID покупателя (пусто = всем)</label><input type="text" id="tTi" class="form-input" placeholder="WC..."></div>';
    html += '<div class="form-group"><label>Скин на продажу</label><select id="tTs" class="form-input"><option value="">-- Выберите скин --</option>';
    
    playerData.ownedSkins.forEach(sid => {
        if (sid === 'default') return;
        const skin = treeSkins.find(s => s.id === sid);
        if (skin) {
            html += '<option value="' + skin.id + '" data-emoji="' + (skin.emoji || '🎄') + '">' + (skin.emoji || '🎄') + ' ' + skin.name + (sid === playerData.activeSkin ? ' (активен)' : '') + '</option>';
        }
    });
    
    html += '</select></div>';
    // ВАЖНО: значение value="stars" для звезд
    html += '<div class="form-group"><label>Валюта</label><select id="tTc" class="form-input"><option value="wood">🌲 Древесина</option><option value="crystals">💎 Кристаллы</option><option value="stars">⭐ Звёзды Telegram</option></select></div>';
    html += '<div class="form-group"><label>Цена</label><input type="number" id="tTp" class="form-input" placeholder="100" min="1" value="100"></div>';
    html += '<button id="btnCT" class="form-submit">📤 Выставить на продажу</button></div>';
    
    // Список предложений
    html += '<div class="section-title">📋 Активные предложения</div><div id="tL">';
    
    if (!trades.length) {
        html += '<div style="text-align:center;padding:20px;color:#aaa;">Нет активных предложений</div>';
    } else {
        trades.forEach(trade => {
            const isOwn = trade.sellerId === playerData.userId;
            const hasSkin = playerData.ownedSkins.indexOf(trade.skinId) !== -1;
            const currency = trade.currency || 'wood';
            const curIcon = currency === 'wood' ? '🌲' : currency === 'crystals' ? '💎' : '⭐';
            
            const canBuy = !isOwn && !hasSkin && (
                currency === 'wood' ? playerData.wood >= trade.price :
                currency === 'crystals' ? playerData.crystals >= trade.price :
                true // Для звезд всегда можно купить
            );
            
            html += '<div class="trade-item">';
            html += '<div class="trade-header"><div>';
            html += '<span class="trade-seller-name">' + escapeHtml(trade.sellerName) + '</span><br>';
            html += '<span class="trade-seller-id">ID: ' + trade.sellerId + '</span>';
            if (trade.targetId) html += '<br><span style="font-size:10px;color:#a78bfa;">🎯 Для: ' + trade.targetId + '</span>';
            html += '</div><span class="trade-price">' + formatNumber(trade.price) + ' ' + curIcon + '</span></div>';
            html += '<div class="trade-tree">' + (trade.skinEmoji || '🎄') + ' ' + trade.skinName + '</div>';
            
            if (isOwn) {
                html += '<button class="trade-btn cancel" data-action="cancel" data-id="' + trade.id + '">❌ Отменить</button>';
            } else if (hasSkin) {
                html += '<button class="trade-btn" disabled>Уже есть</button>';
            } else if (canBuy) {
                html += '<button class="trade-btn buy" data-action="buy" data-id="' + trade.id + '" data-currency="' + currency + '" data-price="' + trade.price + '" data-seller="' + trade.sellerId + '">💰 Купить за ' + formatNumber(trade.price) + ' ' + curIcon + '</button>';
            } else {
                html += '<button class="trade-btn" disabled>Недостаточно ' + curIcon + '</button>';
            }
            html += '</div>';
        });
    }
    html += '</div>';
    
    const bg = showPopup('💱 Торговая площадка', html);
    
    // Копирование ID
    document.getElementById('btnCopyIdTrade').addEventListener('click', () => {
        navigator.clipboard.writeText(playerData.userId).then(
            () => alert('✅ ID скопирован: ' + playerData.userId),
            () => alert('ID: ' + playerData.userId + ' (скопируйте вручную)')
        );
    });
    
    // Создание предложения
    bg.querySelector('#btnCT').addEventListener('click', async function() {
        const skinId = bg.querySelector('#tTs').value;
        const price = parseInt(bg.querySelector('#tTp').value);
        const targetId = bg.querySelector('#tTi').value.trim();
        const currency = bg.querySelector('#tTc').value; // ВАЖНО: берем значение select
        
        if (!skinId) { alert('❌ Выберите скин для продажи'); return; }
        if (!price || price < 1) { alert('❌ Укажите цену (минимум 1)'); return; }
        if (currency === 'stars' && price < 1) { alert('❌ Минимальная цена в звездах: 1 ⭐'); return; }
        
        console.log('📤 Создание трейда:', { skinId, price, currency, targetId });
        
        const result = await fetch(API_URL + '/trades/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                sellerId: userId,
                sellerName: userName,
                targetId: targetId || null,
                skinId: skinId,
                price: price,
                currency: currency,  // ВАЖНО: передаем валюту
                skinName: treeSkins.find(s => s.id === skinId)?.name || 'Скин',
                skinEmoji: treeSkins.find(s => s.id === skinId)?.emoji || '🎄'
            })
        }).then(r => r.json());
        
        if (result.success) {
            playerData.ownedSkins = playerData.ownedSkins.filter(s => s !== skinId);
            if (playerData.activeSkin === skinId) playerData.activeSkin = 'default';
            saveData();
            updateUI();
            syncLeaderboard();
            bg.remove();
            showTrade();
            
            const currencyNames = { wood: '🌲 древесины', crystals: '💎 кристаллов', stars: '⭐ звезд' };
            alert('✅ Скин выставлен на продажу за ' + price + ' ' + (currencyNames[currency] || currency) + '!');
        } else {
            alert('❌ Ошибка создания предложения: ' + (result.error || 'неизвестно'));
        }
    });
    
    // Покупка/отмена
    bg.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', async function() {
            const action = this.dataset.action;
            const tradeId = this.dataset.id;
            
            if (action === 'cancel') {
                if (!confirm('Отменить предложение? Скин вернется к вам.')) return;
                
                const result = await fetch(API_URL + '/trades/cancel', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ trade_id: tradeId, user_id: userId })
                }).then(r => r.json());
                
                if (result.success) {
                    if (result.skinId) {
                        playerData.ownedSkins.push(result.skinId);
                        saveData();
                        updateUI();
                    }
                    bg.remove();
                    showTrade();
                    alert('✅ Предложение отменено, скин возвращен');
                } else {
                    alert('❌ Ошибка при отмене');
                }
            } else if (action === 'buy') {
                const currency = this.dataset.currency;
                const price = parseInt(this.dataset.price);
                const sellerId = this.dataset.seller;
                
                console.log('🛒 Покупка трейда:', { tradeId, currency, price });
                
                if (currency === 'stars') {
                    // Покупка за звезды
                    if (!confirm('Купить этот скин за ' + price + ' ⭐?')) return;
                    
                    // Используем sendStarInvoice
                    if (typeof tg.sendStarInvoice === 'function') {
                        tg.sendStarInvoice({
                            title: 'Покупка скина',
                            description: 'Скин в игре Woodcutter',
                            payload: 'trade_' + tradeId + '_' + userId + '_' + Date.now(),
                            currency: 'XTR',
                            prices: [{ amount: price, label: 'Скин с торгов' }]
                        }, async function(status) {
                            console.log('⭐ Статус оплаты трейда:', status);
                            if (status === 'paid') {
                                // Завершаем сделку на сервере
                                const result = await fetch(API_URL + '/trades/buy', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        trade_id: tradeId,
                                        buyer_id: userId,
                                        payment_type: 'stars'
                                    })
                                }).then(r => r.json());
                                
                                if (result.success) {
                                    playerData.ownedSkins.push(result.skinId);
                                    saveData();
                                    updateUI();
                                    syncLeaderboard();
                                    bg.remove();
                                    showTrade();
                                    alert('✅ Скин куплен! Продавец получил ' + result.sellerCut + '⭐, админ ' + result.adminCut + '⭐');
                                } else {
                                    alert('❌ Ошибка: ' + (result.error || 'неизвестно'));
                                }
                            } else {
                                alert('❌ Оплата не прошла');
                            }
                        });
                    } else if (typeof tg.openInvoice === 'function') {
                        // Fallback на openInvoice
                        const invResult = await fetch(API_URL + '/create-star-invoice', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                user_id: userId,
                                trade_id: tradeId,
                                skin_name: 'Покупка скина',
                                price: price,
                                type: 'trade_buy'
                            })
                        }).then(r => r.json());
                        
                        if (invResult.success && invResult.invoice_link) {
                            tg.openInvoice(invResult.invoice_link, async function(status) {
                                if (status === 'paid') {
                                    const result = await fetch(API_URL + '/trades/buy', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({
                                            trade_id: tradeId,
                                            buyer_id: userId,
                                            payment_type: 'stars'
                                        })
                                    }).then(r => r.json());
                                    
                                    if (result.success) {
                                        playerData.ownedSkins.push(result.skinId);
                                        saveData();
                                        updateUI();
                                        syncLeaderboard();
                                        bg.remove();
                                        showTrade();
                                        alert('✅ Скин куплен! Продавец получил ' + result.sellerCut + '⭐, админ ' + result.adminCut + '⭐');
                                    }
                                } else {
                                    alert('❌ Оплата не прошла');
                                }
                            });
                        } else {
                            alert('❌ Ошибка создания счета: ' + (invResult.error || 'неизвестно'));
                        }
                    } else {
                        alert('❌ Покупки за звезды доступны только через бота Telegram');
                    }
                } else {
                    // Покупка за wood/crystals
                    const curIcon = currency === 'wood' ? '🌲' : '💎';
                    if (!confirm('Купить за ' + price + ' ' + curIcon + '?')) return;
                    
                    if (currency === 'wood' && playerData.wood < price) { alert('❌ Недостаточно древесины'); return; }
                    if (currency === 'crystals' && playerData.crystals < price) { alert('❌ Недостаточно кристаллов'); return; }
                    
                    const result = await fetch(API_URL + '/trades/buy', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            trade_id: tradeId,
                            buyer_id: userId,
                            payment_type: 'direct'
                        })
                    }).then(r => r.json());
                    
                    if (result.success) {
                        if (currency === 'wood') playerData.wood -= price;
                        else playerData.crystals -= price;
                        playerData.ownedSkins.push(result.skinId);
                        saveData();
                        updateUI();
                        syncLeaderboard();
                        bg.remove();
                        showTrade();
                        alert('✅ Скин куплен!');
                    } else {
                        alert('❌ Ошибка: ' + (result.error || 'неизвестно'));
                    }
                }
            }
        });
    });
}

// ... (остальные функции)

// Инициализация
updateUI();
syncLeaderboard();
setInterval(passiveIncome, 1000);
setInterval(saveData, 10000);
setInterval(syncLeaderboard, 30000);

console.log('✅ Woodcutter готов');
</script>
</body>
</html>
