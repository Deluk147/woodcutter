<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Woodcutter | Telegram Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Все стили остаются без изменений */
        :root { --bg: #1a1a2e; --panel: #16213e; --accent: #e2a03f; --text: #eee; --text-secondary: #aaa; --border: #2a2a4a; --gold: #ffd700; }
        * { margin:0; padding:0; box-sizing:border-box; }
        html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:-apple-system,sans-serif; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
        .app-container { width:100%; height:100%; display:flex; justify-content:center; align-items:center; background:var(--bg); }
        .phone-frame { width:100%; height:100%; max-width:430px; background:var(--bg); display:flex; flex-direction:column; position:relative; overflow:hidden; }
        .header { background:var(--panel); padding:12px 16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border); flex-shrink:0; }
        .header .avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#e2a03f,#c47f2a); display:flex; align-items:center; justify-content:center; font-size:20px; overflow:hidden; background-size:cover; }
        .header .title { font-weight:600; color:var(--text); font-size:15px; cursor:pointer; }
        .header .subtitle { font-size:11px; color:var(--text-secondary); }
        .game-area { flex:1; display:flex; flex-direction:column; padding:10px; overflow-y:auto; gap:8px; -webkit-overflow-scrolling:touch; padding-bottom:20px; }
        .resources { display:flex; gap:8px; }
        .resource-card { flex:1; background:var(--panel); border-radius:12px; padding:10px 14px; display:flex; align-items:center; gap:12px; border:1px solid var(--border); }
        .resource-icon { font-size:24px; }
        .resource-info { display:flex; flex-direction:column; gap:4px; }
        .resource-value { font-size:20px; font-weight:700; color:var(--text); line-height:1; }
        .resource-label { font-size:10px; color:var(--text-secondary); }
        .tree-scene { background:var(--panel); border-radius:16px; padding:12px; display:flex; flex-direction:column; align-items:center; gap:8px; border:1px solid var(--border); }
        .tree-container { position:relative; width:100%; max-width:240px; aspect-ratio:3/4; cursor:pointer; }
        .tree-container:active { transform:scale(0.96); }
        .tree-container.shake { animation:shake 0.4s ease; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-4px)} 40%{transform:translateX(4px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }
        .tree-fall { animation:fall 0.6s ease forwards; }
        @keyframes fall { 0%{transform:rotate(0);opacity:1} 100%{transform:rotate(80deg) translateX(60px);opacity:0} }
        .tree-svg { width:100%; height:100%; pointer-events:none; }
        .axe-emoji { position:absolute; right:8%; top:42%; font-size:40px; pointer-events:none; z-index:6; filter:drop-shadow(2px 3px 3px rgba(0,0,0,0.4)); }
        .axe-emoji.swing { animation:axeSwing 0.3s ease; }
        @keyframes axeSwing { 0%{transform:rotate(-40deg)} 50%{transform:rotate(20deg)} 100%{transform:rotate(0deg)} }
        .tree-level-badge { position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.8); color:var(--gold); padding:3px 8px; border-radius:12px; font-size:12px; font-weight:700; border:1px solid var(--gold); }
        .hp-bar-container { width:100%; background:#2a2a3a; border-radius:8px; height:14px; overflow:hidden; border:1px solid var(--border); }
        .hp-bar { height:100%; border-radius:8px; transition:width 0.3s ease; }
        .hp-bar.high { background:linear-gradient(90deg,#4caf84,#81c784); }
        .hp-bar.medium { background:linear-gradient(90deg,#f39c12,#e67e22); }
        .hp-bar.low { background:linear-gradient(90deg,#e74c3c,#c0392b); }
        .hp-text { font-size:12px; color:var(--text); text-align:center; font-weight:600; }
        .combo-display { color:var(--text-secondary); font-size:11px; text-align:center; min-height:16px; }
        .combo-fire { color:#ff6b35; }
        .combo-timer-bar { width:100%; height:4px; background:#2a2a3a; border-radius:2px; overflow:hidden; margin-top:4px; }
        .combo-timer-fill { height:100%; background:var(--accent); border-radius:2px; width:100%; transition:width 0.1s linear; }
        .float-text { position:absolute; font-weight:700; pointer-events:none; animation:floatUp 1s ease-out forwards; z-index:20; font-size:16px; }
        @keyframes floatUp { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-50px)} }
        .btn-row { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
        .btn { padding:12px 8px; border-radius:12px; border:none; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:4px; min-height:44px; }
        .btn:active { transform:scale(0.95); }
        .btn-shop { background:var(--panel); color:var(--text); border:1px solid var(--border); }
        .btn-leaderboard { background:linear-gradient(135deg,#ffd700,#ffaa00); color:#000; }
        .btn-trees { background:linear-gradient(135deg,#4caf50,#2d6b2d); color:#fff; }
        .btn-trade { background:linear-gradient(135deg,#a78bfa,#7c3aed); color:#fff; }
        .passive-info { text-align:center; color:var(--text-secondary); font-size:11px; }
        .popup-bg { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.75); z-index:9999; display:flex; align-items:flex-end; justify-content:center; }
        .popup { background:#16213e; border-radius:16px 16px 0 0; width:100%; max-width:430px; max-height:85vh; overflow-y:auto; padding:16px 12px 30px; border:1px solid #2a2a4a; }
        .popup h3 { color:#eee; font-size:18px; margin-bottom:12px; text-align:center; }
        .popup-close { width:100%; padding:14px; border-radius:12px; border:1px solid #2a2a4a; background:#16213e; color:#eee; font-size:15px; font-weight:600; margin-top:8px; }
        .shop-cat { color:#e2a03f; font-size:13px; font-weight:700; margin:12px 0 6px; padding-bottom:4px; border-bottom:1px solid #2a2a4a; }
        .shop-item { background:#1e2a3a; border-radius:12px; padding:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; border:1px solid #2a2a4a; gap:8px; }
        .shop-name { font-weight:600; color:#eee; font-size:14px; }
        .shop-desc { font-size:11px; color:#aaa; }
        .shop-lvl { font-size:10px; color:#e2a03f; }
        .shop-buy { padding:8px 14px; border-radius:10px; border:none; font-weight:600; font-size:12px; cursor:pointer; }
        .shop-buy.wood { background:#4caf84; color:#fff; } .shop-buy.crystal { background:#a78bfa; color:#fff; }
        .shop-buy:disabled { opacity:0.4; }
        .skin-tabs { display:flex; gap:8px; margin-bottom:12px; }
        .skin-tab { flex:1; padding:10px; border-radius:10px; border:1px solid #2a2a4a; background:transparent; color:#eee; cursor:pointer; font-weight:600; font-size:13px; text-align:center; }
        .skin-tab.active { background:#e2a03f; border-color:#e2a03f; color:#000; }
        .skin-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
        .skin-card { background:#1e2a3a; border-radius:12px; padding:10px; text-align:center; border:2px solid #2a2a4a; cursor:pointer; position:relative; }
        .skin-card.active { border-color:#ffd700; }
        .skin-emoji { font-size:32px; display:block; margin-bottom:6px; }
        .skin-img { width:48px; height:48px; object-fit:contain; display:block; margin:0 auto 6px; border-radius:8px; }
        .skin-name { font-size:11px; color:#eee; font-weight:600; }
        .skin-price { font-size:10px; color:#e2a03f; margin-top:3px; }
        .skin-price-star { font-size:10px; color:#ffd700; margin-top:3px; }
        .skin-delete-btn { position:absolute; top:4px; right:4px; background:#e74c3c; color:#fff; border:none; border-radius:50%; width:20px; height:20px; font-size:10px; cursor:pointer; }
        .add-skin-btn { width:100%; padding:12px; border-radius:10px; border:2px dashed #e2a03f; background:transparent; color:#e2a03f; font-weight:600; cursor:pointer; margin-top:12px; }
        .trade-item { background:#1e2a3a; border-radius:12px; padding:12px; margin-bottom:8px; border:1px solid #2a2a4a; }
        .trade-header { display:flex; justify-content:space-between; margin-bottom:6px; }
        .trade-seller-name { font-weight:600; color:#eee; font-size:13px; }
        .trade-seller-id { font-size:10px; color:#aaa; font-family:monospace; }
        .trade-price { color:#e2a03f; font-weight:700; }
        .trade-tree { font-size:20px; text-align:center; margin:6px 0; }
        .trade-btn { width:100%; padding:10px; border-radius:10px; border:none; color:#fff; font-weight:600; cursor:pointer; margin-top:6px; }
        .trade-btn.buy { background:#4caf84; } .trade-btn.cancel { background:#e74c3c; }
        .trade-btn:disabled { opacity:0.4; }
        .create-form { background:#1e2a3a; border-radius:12px; padding:12px; margin-bottom:12px; border:1px solid #2a2a4a; }
        .form-group { margin-bottom:8px; }
        .form-group label { display:block; color:#aaa; font-size:11px; margin-bottom:3px; }
        .form-input { width:100%; padding:10px; border-radius:10px; border:1px solid #2a2a4a; background:#1a1a2e; color:#eee; font-size:14px; margin-top:3px; }
        .form-submit { width:100%; padding:12px; border-radius:10px; border:none; background:#e2a03f; color:#000; font-weight:700; cursor:pointer; }
        .lb-table { width:100%; border-collapse:collapse; }
        .lb-table th { color:#aaa; font-size:10px; padding:8px 6px; }
        .lb-table td { color:#fff; font-size:12px; padding:8px 6px; border-bottom:1px solid #2a2a4a; }
        .lb-rank { font-weight:700; font-size:14px; text-align:center; width:35px; }
        .lb-gold { color:#ffd700; } .lb-silver { color:#c0c0c0; } .lb-bronze { color:#cd7f32; }
        .lb-me { background:rgba(226,160,63,0.15); }
        .section-title { color:#e2a03f; font-size:13px; font-weight:700; margin:12px 0 6px; padding-bottom:4px; border-bottom:1px solid #2a2a4a; }
        .admin-panel { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:99999; overflow-y:auto; padding:20px; }
        .admin-inner { max-width:500px; margin:0 auto; background:#16213e; border-radius:16px; padding:20px; }
        .admin-inner h2 { color:#ffd700; text-align:center; }
        .admin-inner h3 { color:#e2a03f; margin:15px 0 10px; }
        .admin-input { width:100%; padding:10px; border-radius:10px; border:1px solid #2a2a4a; background:#1a1a2e; color:#eee; margin-bottom:8px; }
        .admin-btn { width:100%; padding:12px; border-radius:10px; border:none; font-weight:700; font-size:14px; cursor:pointer; margin-bottom:8px; color:#fff; }
        .admin-btn.green { background:#4caf84; } .admin-btn.purple { background:#a78bfa; } .admin-btn.gold { background:#e2a03f; color:#000; } .admin-btn.red { background:#e74c3c; }
    </style>
</head>
<body>
<div class="app-container"><div class="phone-frame">
    <div class="header"><div class="avatar" id="av">🪓</div><div><div class="title" id="th">Woodcutter</div><div class="subtitle" id="nd">...</div></div></div>
    <div class="game-area">
        <div class="resources">
            <div class="resource-card"><span class="resource-icon">🌲</span><div class="resource-info"><span class="resource-value" id="wv">0</span><span class="resource-label">Древесина</span></div></div>
            <div class="resource-card"><span class="resource-icon">💎</span><div class="resource-info"><span class="resource-value" id="cv">0</span><span class="resource-label">Кристаллы</span></div></div>
        </div>
        <div class="tree-scene">
            <div class="tree-container" id="tc">
                <div class="tree-level-badge" id="lb">🌲 Ур. 1</div>
                <div class="axe-emoji" id="ax">🪓</div>
                <svg class="tree-svg" viewBox="0 0 260 360"><ellipse cx="130" cy="330" rx="110" ry="20" fill="#3d2b1f" opacity="0.6"/><rect x="115" y="180" width="30" height="152" rx="7" fill="#6b4226" id="tr"/><ellipse cx="130" cy="130" rx="85" ry="75" fill="#3a7d3a" id="c1"/><ellipse cx="130" cy="85" rx="70" ry="65" fill="#4caf50" id="c2"/><ellipse cx="130" cy="45" rx="55" ry="55" fill="#66bb6a" id="c3"/></svg>
                <div id="floatTextContainer" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></div>
            </div>
            <div class="hp-bar-container"><div class="hp-bar high" id="hp" style="width:100%"></div></div>
            <div class="hp-text" id="ht">15 / 15 HP</div>
            <div class="combo-display" id="cd">Нажимай на дерево! 🪓</div>
            <div class="combo-timer-bar" id="ctb" style="display:none;"><div class="combo-timer-fill" id="ctf" style="width:100%;"></div></div>
        </div>
        <div class="btn-row">
            <button class="btn btn-shop" id="bs">🏪 Магазин</button>
            <button class="btn btn-leaderboard" id="bl">🏆 Рейтинг</button>
            <button class="btn btn-trees" id="bt">🎄 Скины</button>
            <button class="btn btn-trade" id="btr">💱 Торги</button>
        </div>
        <div class="passive-info" id="pi"></div>
    </div>
</div></div>

<div class="admin-panel" id="ap">
    <!-- Админ-панель без изменений -->
</div>

<script>
// ==================== КОНФИГУРАЦИЯ ====================
const API_URL = 'https://delay.pythonanywhere.com/api';
const tg = window.Telegram.WebApp;
tg.expand();
tg.ready();

// ID админа
const ADMIN_ID = 'WC046190';

// ==================== ИНИЦИАЛИЗАЦИЯ ====================
const user = tg.initDataUnsafe?.user;
const userId = user ? 'WC' + String(user.id).slice(-6).padStart(6, '0') : 'WC' + Math.random().toString(36).substr(2, 6).toUpperCase();
const userName = user ? (user.first_name + (user.last_name ? ' ' + user.last_name : '')) : 'Игрок';
const STORAGE_KEY = 'wc_' + userId;

console.log('🌲 Woodcutter v2.0');
console.log('👤 User ID:', userId);
console.log('👑 Admin:', userId === ADMIN_ID);
console.log('📡 API:', API_URL);
console.log('💬 Telegram methods:', {
    openInvoice: typeof tg.openInvoice === 'function',
    sendStarInvoice: typeof tg.sendStarInvoice === 'function'
});

// Аватар пользователя
if (user?.photo_url) {
    document.getElementById('av').style.backgroundImage = `url(${user.photo_url})`;
    document.getElementById('av').textContent = '';
}

// Секретный доступ к админ-панели
let titleClicks = 0;
document.getElementById('th').addEventListener('click', () => {
    titleClicks++;
    if (titleClicks >= 5) {
        titleClicks = 0;
        if (userId === ADMIN_ID) {
            document.getElementById('ap').style.display = 'block';
        } else {
            alert('⛔ Нет доступа');
        }
    }
    setTimeout(() => titleClicks = 0, 2000);
});

// ==================== API ФУНКЦИИ ====================
async function apiCall(endpoint, method = 'GET', body = null) {
    try {
        const options = {
            method: method,
            headers: { 'Content-Type': 'application/json' }
        };
        if (body) options.body = JSON.stringify(body);
        
        const response = await fetch(API_URL + endpoint, options);
        const data = await response.json();
        return data;
    } catch (error) {
        console.error('API Error:', error);
        return { success: false, error: error.message };
    }
}

async function syncLeaderboard() {
    await apiCall('/leaderboard/update', 'POST', {
        user_id: userId,
        name: userName,
        wood: playerData.wood,
        crystals: playerData.crystals,
        treeLevel: playerData.treeLevel,
        totalTrees: playerData.totalTrees
    });
}

async function getLeaderboard() {
    const result = await apiCall('/leaderboard');
    return result.success ? result.players : [];
}

async function getTrades() {
    const result = await apiCall('/trades?user_id=' + userId);
    return result.success ? result.trades : [];
}

async function createTrade(skinId, price, targetId, currency) {
    const skin = treeSkins.find(s => s.id === skinId) || axeSkins.find(s => s.id === skinId);
    return await apiCall('/trades/create', 'POST', {
        sellerId: userId,
        sellerName: userName,
        targetId: targetId || null,
        skinId: skinId,
        price: price,
        currency: currency || 'wood',
        skinName: skin ? skin.name : 'Скин',
        skinEmoji: skin ? (skin.emoji || '🎄') : '🎄'
    });
}

async function buyTrade(tradeId, paymentType = 'direct') {
    return await apiCall('/trades/buy', 'POST', {
        trade_id: tradeId,
        buyer_id: userId,
        payment_type: paymentType
    });
}

async function cancelTradeRequest(tradeId) {
    return await apiCall('/trades/cancel', 'POST', {
        trade_id: tradeId,
        user_id: userId
    });
}

// ==================== ДАННЫЕ ИГРОКА ====================
let playerData = {
    name: userName,
    userId: userId,
    wood: 0,
    crystals: 0,
    stars: 0,
    axePower: 1,
    crystalBonus: 1,
    autoWood: 0,
    critChance: 0,
    critMultiplier: 2,
    crystalToWoodRate: 0,
    comboBonus: 0,
    combo: 0,
    comboMultiplier: 1,
    treeHP: 15,
    maxTreeHP: 15,
    totalTrees: 0,
    treeLevel: 1,
    activeSkin: 'default',
    ownedSkins: ['default'],
    activeAxe: 'default',
    ownedAxes: ['default'],
    upgrades: {}
};

// Загрузка из localStorage
try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) Object.assign(playerData, JSON.parse(saved));
} catch (e) {}

// Восстановление значений по умолчанию
playerData.name = userName;
playerData.userId = userId;
if (!playerData.maxTreeHP || playerData.maxTreeHP < 10) {
    playerData.maxTreeHP = 15;
    playerData.treeHP = 15;
}
if (!playerData.ownedSkins || !playerData.ownedSkins.length) playerData.ownedSkins = ['default'];
if (!playerData.ownedAxes || !playerData.ownedAxes.length) playerData.ownedAxes = ['default'];
if (!playerData.activeSkin) playerData.activeSkin = 'default';
if (!playerData.activeAxe) playerData.activeAxe = 'default';
if (!playerData.upgrades) playerData.upgrades = {};

// Инициализация апгрейдов
const upgradeIds = ['axe', 'strength', 'crystal1', 'crystal2', 'auto1', 'auto2', 'auto3', 'auto4', 
                    'crit1', 'crit2', 'crystalToWood1', 'crystalToWood2', 'crystalAuto1', 
                    'crystalAuto2', 'critDamage1', 'comboBoost1'];
upgradeIds.forEach(id => {
    if (!(id in playerData.upgrades)) playerData.upgrades[id] = 0;
});

// Загрузка профиля с сервера
(async () => {
    try {
        const result = await apiCall('/profile/' + userId);
        if (result.success && result.profile) {
            const profile = result.profile;
            if (profile.wood !== undefined) playerData.wood = profile.wood;
            if (profile.crystals !== undefined) playerData.crystals = profile.crystals;
            if (profile.stars !== undefined) playerData.stars = profile.stars;
            if (profile.ownedSkins) playerData.ownedSkins = profile.ownedSkins;
            if (profile.ownedAxes) playerData.ownedAxes = profile.ownedAxes;
            if (profile.activeSkin) playerData.activeSkin = profile.activeSkin;
            if (profile.activeAxe) playerData.activeAxe = profile.activeAxe;
            updateUI();
            saveData();
        }
    } catch (e) {
        console.error('Profile load error:', e);
    }
})();

// ==================== СОХРАНЕНИЕ ====================
function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(playerData));
    
    // Асинхронное сохранение на сервер
    apiCall('/profile/save', 'POST', {
        user_id: userId,
        wood: playerData.wood,
        crystals: playerData.crystals,
        stars: playerData.stars,
        ownedSkins: playerData.ownedSkins,
        ownedAxes: playerData.ownedAxes,
        activeSkin: playerData.activeSkin,
        activeAxe: playerData.activeAxe,
        name: playerData.name,
        treeLevel: playerData.treeLevel,
        totalTrees: playerData.totalTrees
    }).catch(e => console.error('Save error:', e));
}

function formatNumber(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return Math.floor(n).toString();
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function calculateTreeHP(level) {
    const baseMin = 15, baseMax = 30;
    let multiplier;
    if (level <= 10) multiplier = 1 + (level - 1) * 0.5;
    else if (level <= 50) multiplier = 5.5 + (level - 10) * 0.3;
    else if (level <= 200) multiplier = 17.5 + (level - 50) * 0.2;
    else if (level <= 1000) multiplier = 47.5 + (level - 200) * 0.1;
    else if (level <= 5000) multiplier = 127.5 + (level - 1000) * 0.05;
    else multiplier = 327.5 + (level - 5000) * 0.02;
    
    const minHP = baseMin * multiplier + (level - 1) * 5;
    const maxHP = baseMax * multiplier + (level - 1) * 5;
    return Math.floor(Math.random() * (maxHP - minHP) + minHP);
}

// ==================== СКИНЫ ====================
const treeSkins = [
    {id: 'default', name: 'Обычное', emoji: '🌳', colors: ['#3a7d3a', '#4caf50', '#66bb6a'], price: 0, cur: 'free'},

// ==================== UI ОБНОВЛЕНИЕ ====================
function updateUI() {
    document.getElementById('wv').textContent = formatNumber(playerData.wood);
    document.getElementById('cv').textContent = formatNumber(playerData.crystals);
    
    const hpPercent = Math.max(0, (playerData.treeHP / Math.max(1, playerData.maxTreeHP)) * 100);
    const hpBar = document.getElementById('hp');
    hpBar.style.width = hpPercent + '%';
    hpBar.className = 'hp-bar ' + (hpPercent > 60 ? 'high' : hpPercent > 30 ? 'medium' : 'low');
    
    document.getElementById('ht').textContent = formatNumber(Math.max(0, playerData.treeHP)) + ' / ' + formatNumber(playerData.maxTreeHP) + ' HP';
    document.getElementById('lb').textContent = '🌲 Ур. ' + playerData.treeLevel;
    document.getElementById('nd').textContent = playerData.name;
    
    document.getElementById('cd').innerHTML = playerData.combo > 1 
        ? '<span class="combo-fire">🔥 Комбо x' + playerData.combo + ' (+' + Math.floor((playerData.comboMultiplier - 1) * 100) + '%)</span>'
        : 'Нажимай на дерево! 🪓';
    
    document.getElementById('pi').textContent = playerData.autoWood > 0 ? '⏳ +' + playerData.autoWood + ' 🌲/сек' : '';
    
    // Обновление скина дерева
    const skin = treeSkins.find(s => s.id === playerData.activeSkin) || treeSkins[0];
    const colors = hpPercent > 60 ? skin.colors : (hpPercent > 30 ? ['#e67e22', '#f39c12', '#f1c40f'] : ['#c0392b', '#e74c3c', '#ff6b6b']);
    
    const treeContainer = document.getElementById('tc');
    const svg = treeContainer.querySelector('svg');
    let overlay = document.getElementById('skinOverlay');
    
    if (!overlay) {
        overlay = document.createElement('img');
        overlay.id = 'skinOverlay';
        overlay.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;pointer-events:none;z-index:5;';
        treeContainer.appendChild(overlay);
    }
    
    if (skin.img) {
        svg.style.display = 'none';
        overlay.src = skin.img;
        overlay.style.display = 'block';
    } else {
        svg.style.display = 'block';
        overlay.style.display = 'none';
        document.getElementById('c1').setAttribute('fill', colors[0]);
        document.getElementById('c2').setAttribute('fill', colors[1]);
        document.getElementById('c3').setAttribute('fill', colors[2]);
    }
    
    // Обновление топора
    const axe = axeSkins.find(a => a.id === playerData.activeAxe) || axeSkins[0];
    const axeEl = document.getElementById('ax');
    if (axe.img) {
        axeEl.textContent = '';
        axeEl.style.backgroundImage = 'url(' + axe.img + ')';
        axeEl.style.backgroundSize = 'contain';
        axeEl.style.backgroundRepeat = 'no-repeat';
        axeEl.style.width = '50px';
        axeEl.style.height = '50px';
    } else {
        axeEl.style.backgroundImage = '';
        axeEl.style.width = '';
        axeEl.style.height = '';
        axeEl.textContent = axe.emoji || '🪓';
    }
}

// ==================== КОМБО-СИСТЕМА ====================
const COMBO_TIMEOUT = 5000;
let comboTimer = null;

function resetCombo() {
    if (comboTimer) clearTimeout(comboTimer);
    
    const bar = document.getElementById('ctb');
    const fill = document.getElementById('ctf');
    
    if (playerData.combo > 0) {
        bar.style.display = 'block';
        fill.style.transition = 'none';
        fill.style.width = '100%';
        requestAnimationFrame(() => {
            fill.style.transition = 'width ' + COMBO_TIMEOUT + 'ms linear';
            fill.style.width = '0%';
        });
        
        comboTimer = setTimeout(() => {
            playerData.combo = 0;
            playerData.comboMultiplier = 1;
            bar.style.display = 'none';
            fill.style.transition = 'none';
            fill.style.width = '100%';
            updateUI();
        }, COMBO_TIMEOUT);
    } else {
        bar.style.display = 'none';
    }
}

const axeEmoji = document.getElementById('ax');

function animFall(callback) {
    treeContainer.classList.add('tree-fall');
    setTimeout(() => {

    }, 600);
}

function floatText(text, color, x, y) {
    const el = document.createElement('div');
    el.className = 'float-text';
    el.textContent = text;
    el.style.color = color;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    floatContainer.appendChild(el);
    setTimeout(() => el.remove(), 1000);
}

// ==================== РУБКА ДЕРЕВА ====================
function chop() {
    if (playerData.treeHP <= 0) {
        playerData.maxTreeHP = calculateTreeHP(playerData.treeLevel);
        playerData.treeHP = playerData.maxTreeHP;
        updateUI();
        return;
    }
    
    let damage = playerData.axePower;
    const isCrit = Math.random() * 100 < playerData.critChance;
    if (isCrit) damage = Math.floor(damage * playerData.critMultiplier);
    
    playerData.combo = Math.min(50, playerData.combo + 1);
    playerData.comboMultiplier = 1 + playerData.combo * (0.01 + playerData.comboBonus / 100);
    damage = Math.max(1, Math.floor(damage * playerData.comboMultiplier));
    
    playerData.treeHP -= damage;
    playerData.wood += damage;
    
    animAxe();
    resetCombo();
    
    const rect = treeContainer.getBoundingClientRect();
    floatText((isCrit ? '💥+' : '+') + formatNumber(damage) + '🌲', isCrit ? '#ff6b6b' : '#e2a03f', rect.width / 2, rect.height * 0.5);
    
    if (playerData.treeHP <= 0) {
        playerData.crystals += playerData.crystalBonus;
        
        if (playerData.crystalToWoodRate > 0 && playerData.crystals > 0) {
            const converted = Math.floor(playerData.crystals * playerData.crystalToWoodRate);
            playerData.wood += converted;
            floatText('🔄+' + formatNumber(converted) + '🌲', '#4caf84', rect.width / 2, rect.height * 0.5 + 20);
        }
        
        playerData.totalTrees++;
        playerData.treeLevel = Math.min(Math.floor(playerData.totalTrees / 2) + 1, 9999);
        
        animFall(() => {
            playerData.maxTreeHP = calculateTreeHP(playerData.treeLevel);
            playerData.treeHP = playerData.maxTreeHP;
            updateUI();
        });
        
        floatText('🎉+' + playerData.crystalBonus + '💎', '#a78bfa', rect.width / 2, rect.height * 0.5 - 25);
    } else {
        animShake();
    }
    
    updateUI();
    saveData();
    syncLeaderboard();
}

function showPopup(title, content, onClose) {
    const bg = document.createElement('div');
    bg.className = 'popup-bg';
    bg.innerHTML = '<div class="popup"><h3>' + title + '</h3>' + content + '<button class="popup-close">Закрыть</button></div>';
    
    bg.querySelector('button').addEventListener('click', () => {
        bg.remove();
        if (onClose) onClose();
    });
    
    bg.addEventListener('click', (e) => {
        if (e.target === bg) {
            bg.remove();
            if (onClose) onClose();
        }
    });
    
    document.body.appendChild(bg);
    return bg;
}

// ==================== МАГАЗИН ====================
function showShop() {
    let html = '';
    let category = '';
    
    shopItems.forEach(item => {
        const categoryName = item.cur === 'wood' ? '🌲 За древесину' : '💎 За кристаллы';
        if (category !== categoryName) {
            category = categoryName;
            html += '<div class="shop-cat">' + categoryName + '</div>';
        }
        
        const cost = item.cost();
        const canAfford = item.cur === 'wood' ? playerData.wood >= cost : playerData.crystals >= cost;
        
        html += '<div class="shop-item">';
        html += '<div><span class="shop-name">' + item.name + '</span><br>';
        html += '<span class="shop-desc">' + item.desc + '</span>';
        if (playerData.upgrades[item.id] > 0) {
            html += '<br><span class="shop-lvl">Ур. ' + playerData.upgrades[item.id] + '</span>';
        }
        html += '</div>';
        html += '<button class="shop-buy ' + (item.cur === 'wood' ? 'wood' : 'crystal') + '" data-id="' + item.id + '" ' + (canAfford ? '' : 'disabled') + '>';
        html += formatNumber(cost) + ' ' + (item.cur === 'wood' ? '🌲' : '💎');
        html += '</button></div>';
    });
    
    const bg = showPopup('🏪 Магазин', html);
    
    bg.querySelectorAll('button[data-id]').forEach(btn => {
        btn.addEventListener('click', function() {
            const item = shopItems.find(i => i.id === this.dataset.id);
            if (!item) return;
            
            const cost = item.cost();
            if (item.cur === 'wood' && playerData.wood < cost) return;
            if (item.cur === 'crystals' && playerData.crystals < cost) return;
            
            if (item.cur === 'wood') playerData.wood -= cost;
            else playerData.crystals -= cost;
            
            item.effect();
            updateUI();
            saveData();
            syncLeaderboard();
            bg.remove();
            showShop();
        });
    });
}

// ==================== СКИНЫ ====================
function showSkins() {
    let currentTab = 'tree';
    
    function render(tab) {
        currentTab = tab;
        let html = '<div class="skin-tabs">';
        html += '<div class="skin-tab ' + (tab === 'tree' ? 'active' : '') + '" data-tab="tree">🎄 Деревья</div>';
        html += '<div class="skin-tab ' + (tab === 'axe' ? 'active' : '') + '" data-tab="axe">🪓 Топоры</div>';
        html += '</div><div class="skin-grid">';
        
        const skins = tab === 'tree' ? treeSkins : axeSkins;
        const owned = tab === 'tree' ? playerData.ownedSkins : playerData.ownedAxes;
        const active = tab === 'tree' ? playerData.activeSkin : playerData.activeAxe;
        
        skins.forEach(skin => {
            if (skin.hidden && owned.indexOf(skin.id) === -1) return;
            
            const isOwned = owned.indexOf(skin.id) !== -1;
            const isActive = active === skin.id;
            let priceHtml = '';
            
            if (!isOwned) {
                if (skin.cur === 'free') priceHtml = '<div class="skin-price">Бесплатно</div>';
                else if (skin.cur === 'crystals') priceHtml = '<div class="skin-price">🔒 ' + formatNumber(skin.price) + ' 💎</div>';
                else priceHtml = '<div class="skin-price-star">⭐ ' + skin.price + ' звёзд</div>';
            }
            
            const isCustom = skin.id.indexOf('custom_') === 0;
            const imgHtml = skin.img 
                ? '<img src="' + skin.img + '" class="skin-img" onerror="this.style.display=\'none\'">'
                : '<span class="skin-emoji">' + (skin.emoji || '🎄') + '</span>';
            
            html += '<div class="skin-card ' + (isActive ? 'active' : '') + '" data-sid="' + skin.id + '" data-type="' + tab + '">';
            if (isCustom && userId === ADMIN_ID) {
                html += '<button class="skin-delete-btn" data-del="' + skin.id + '" data-dt="' + tab + '">✕</button>';
            }
            html += imgHtml;
            html += '<div class="skin-name">' + skin.name + '</div>';
            html += priceHtml;
            if (isActive) html += '<div style="color:#ffd700;font-size:10px;">✅</div>';
            html += '</div>';
        });
        
        html += '</div>';
        if (userId === ADMIN_ID) {
            html += '<button class="add-skin-btn" id="addBtn">➕ Добавить скин</button>';
        }
        
        const bg = document.createElement('div');
        bg.className = 'popup-bg';
        bg.innerHTML = '<div class="popup"><h3>🎨 Скины</h3>' + html + '<button class="popup-close">Закрыть</button></div>';
        document.body.appendChild(bg);
        
        bg.querySelector('.popup-close').addEventListener('click', () => bg.remove());
        bg.addEventListener('click', (e) => { if (e.target === bg) bg.remove(); });
        
        bg.querySelectorAll('.skin-tab').forEach(t => {
            t.addEventListener('click', () => { bg.remove(); render(t.dataset.tab); });
        });
        
        bg.querySelectorAll('[data-sid]').forEach(el => {
            el.addEventListener('click', function(e) {
                if (e.target.classList.contains('skin-delete-btn')) return;
                
                const skinId = this.dataset.sid;
                const type = this.dataset.type;
                const skins = type === 'tree' ? treeSkins : axeSkins;
                const skin = skins.find(s => s.id === skinId);
                const owned = type === 'tree' ? playerData.ownedSkins : playerData.ownedAxes;
                
                if (owned.indexOf(skinId) !== -1) {
                    // Уже есть - выбираем
                    if (type === 'tree') playerData.activeSkin = skinId;
                    else playerData.activeAxe = skinId;
                    updateUI();
                    saveData();
                    bg.remove();
                    render(currentTab);
                } else if (skin.cur === 'free') {
                    // Бесплатный
                    owned.push(skinId);
                    if (type === 'tree') playerData.activeSkin = skinId;
                    else playerData.activeAxe = skinId;
                    updateUI();
                    saveData();
                    bg.remove();
                    render(currentTab);
                } else if (skin.cur === 'crystals') {
                    // За кристаллы
                    if (playerData.crystals >= skin.price) {
                        if (confirm('Купить за ' + skin.price + ' 💎?')) {
                            playerData.crystals -= skin.price;
                            owned.push(skinId);
                            if (type === 'tree') playerData.activeSkin = skinId;
                            else playerData.activeAxe = skinId;
                            updateUI();
                            saveData();
                            bg.remove();
                            render(currentTab);
                        }
                    } else {
                        alert('Недостаточно кристаллов!');
                    }
                } else if (skin.cur === 'stars') {
                    // За звезды Telegram
                    buySkinWithStars(skin, type, owned, bg, currentTab);
                }
            });
        });
        
        // Кнопка добавления скина (админ)
        const addBtn = bg.querySelector('#addBtn');
        if (addBtn) addBtn.addEventListener('click', () => { bg.remove(); addSkinForm(); });
        
        // Кнопки удаления скинов
        bg.querySelectorAll('.skin-delete-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const skinId = this.dataset.del;
                const type = this.dataset.dt;
                if (confirm('Удалить этот скин?')) {
                    if (type === 'tree') {
                        const idx = treeSkins.findIndex(s => s.id === skinId);
                        if (idx !== -1) treeSkins.splice(idx, 1);
                        localStorage.setItem('c_ts', JSON.stringify(treeSkins.filter(s => s.id.indexOf('custom_') === 0)));
                    } else {
                        const idx = axeSkins.findIndex(s => s.id === skinId);
                        if (idx !== -1) axeSkins.splice(idx, 1);
                        localStorage.setItem('c_as', JSON.stringify(axeSkins.filter(s => s.id.indexOf('custom_') === 0)));
                    }
                    bg.remove();
                    render(currentTab);
                }
            });
        });
    }
    
    render('tree');
}

// Покупка скина за звезды
async function buySkinWithStars(skin, type, owned, bg, currentTab) {
    if (!confirm('Купить скин "' + skin.name + '" за ' + skin.price + ' ⭐?')) return;
    
    // Проверяем доступные методы Telegram
    if (typeof tg.sendStarInvoice === 'function') {
        // Новый метод Telegram Stars
        tg.sendStarInvoice({
            title: 'Скин: ' + skin.name,
            description: 'Скин для игры Woodcutter',
            payload: 'skin_' + skin.id + '_' + userId + '_' + Date.now(),
            currency: 'XTR',
            prices: [{ amount: skin.price, label: skin.name }]
        }, async function(status) {
            console.log('⭐ Star invoice status:', status);
            if (status === 'paid') {
                addPurchasedSkin(skin, type, owned, bg, currentTab);
            } else {
                alert('❌ Оплата не прошла или была отменена');
            }
        });
    } else if (typeof tg.openInvoice === 'function') {
        // Старый метод через инвойс
        try {
            const result = await apiCall('/create-star-invoice', 'POST', {
                user_id: userId,
                skin_id: skin.id,
                skin_name: skin.name,
                price: skin.price,
                type: 'shop'
            });
            
            console.log('📄 Invoice response:', result);
            
            if (result.success && result.invoice_link) {
                tg.openInvoice(result.invoice_link, async function(status) {
                    console.log('💰 Payment status:', status);
                    if (status === 'paid') {
                        addPurchasedSkin(skin, type, owned, bg, currentTab);
                    } else {
                        alert('❌ Оплата не прошла');
                    }
                });
            } else {
                alert('❌ Ошибка создания счета. Попробуйте позже.');
                console.error('Invoice error:', result);
            }
        } catch (e) {
            alert('❌ Ошибка при создании счета');
            console.error('Invoice exception:', e);
        }
    } else {
        alert('❌ Покупки за звезды доступны только через официального бота Telegram.\nОткройте игру через @WoodcutterBot');
    }
}

// Добавление купленного скина
async function addPurchasedSkin(skin, type, owned, bg, currentTab) {
    if (owned.indexOf(skin.id) === -1) {
        owned.push(skin.id);
        if (type === 'tree') playerData.activeSkin = skin.id;
        else playerData.activeAxe = skin.id;
        playerData.stars = (playerData.stars || 0) + skin.price;
        updateUI();
        saveData();
        
        // 5% админу
        const adminCut = Math.floor(skin.price * 0.05);
        if (adminCut > 0) {
            try {
                const adminProfile = await apiCall('/profile/' + ADMIN_ID);
                if (adminProfile.success) {
                    const ap = adminProfile.profile || {};
                    ap.stars = (ap.stars || 0) + adminCut;
                    await apiCall('/profile/save', 'POST', {
                        user_id: ADMIN_ID,
                        stars: ap.stars,
                        wood: ap.wood || 0,
                        crystals: ap.crystals || 0
                    });
                }
            } catch (e) {
                console.error('Admin stars update error:', e);
            }
        }
        
        bg.remove();
        render(currentTab);
        alert('✅ Скин куплен!');
    }
}

// ==================== ТОРГИ ====================
async function showTrade() {
    const trades = await getTrades();
    
    let html = '<div style="background:#1e2a3a;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;border:1px solid #2a2a4a;">';
    html += '<span style="color:#aaa;font-size:12px;">Ваш ID: <span style="color:#e2a03f;font-weight:700;font-family:monospace;font-size:13px;">' + playerData.userId + '</span></span>';
    html += '<button id="btnCopyIdTrade" style="background:#e2a03f;color:#000;border:none;padding:6px 10px;border-radius:8px;font-size:11px;cursor:pointer;">📋 Копировать</button></div>';
    
    // Форма создания предложения
    html += '<div class="create-form">';
    html += '<div class="form-group"><label>ID покупателя (пусто = всем)</label><input type="text" id="tTi" class="form-input" placeholder="WC..."></div>';
    html += '<div class="form-group"><label>Скин на продажу</label><select id="tTs" class="form-input"><option value="">-- Выберите скин --</option>';
    
    playerData.ownedSkins.forEach(sid => {
        if (sid === 'default') return;
        const skin = treeSkins.find(s => s.id === sid);
        if (skin) {
            html += '<option value="' + skin.id + '">' + (skin.emoji || '🎄') + ' ' + skin.name + (sid === playerData.activeSkin ? ' (активен)' : '') + '</option>';
        }
    });
    
    html += '</select></div>';
    html += '<div class="form-group"><label>Валюта</label><select id="tTc" class="form-input"><option value="wood">🌲 Древесина</option><option value="crystals">💎 Кристаллы</option><option value="stars">⭐ Звёзды</option></select></div>';
    html += '<div class="form-group"><label>Цена</label><input type="number" id="tTp" class="form-input" placeholder="100" min="1" value="100"></div>';
    html += '<button id="btnCT" class="form-submit">📤 Выставить на продажу</button></div>';
    
    // Список предложений
    html += '<div class="section-title">📋 Активные предложения</div><div id="tL">';
    
    if (!trades.length) {
        html += '<div style="text-align:center;padding:20px;color:#aaa;">Нет активных предложений</div>';
    } else {
        trades.forEach(trade => {
            const isOwn = trade.sellerId === playerData.userId;
            const hasSkin = playerData.ownedSkins.indexOf(trade.skinId) !== -1;
            const currency = trade.currency || 'wood';
            const curIcon = currency === 'wood' ? '🌲' : currency === 'crystals' ? '💎' : '⭐';
            
            const canBuy = !isOwn && !hasSkin && (
                currency === 'wood' ? playerData.wood >= trade.price :
                currency === 'crystals' ? playerData.crystals >= trade.price :
                true
            );
            
            html += '<div class="trade-item">';
            html += '<div class="trade-header"><div>';
            html += '<span class="trade-seller-name">' + escapeHtml(trade.sellerName) + '</span><br>';
            html += '<span class="trade-seller-id">ID: ' + trade.sellerId + '</span>';
            if (trade.targetId) html += '<br><span style="font-size:10px;color:#a78bfa;">🎯 Для: ' + trade.targetId + '</span>';
            html += '</div><span class="trade-price">' + formatNumber(trade.price) + ' ' + curIcon + '</span></div>';
            html += '<div class="trade-tree">' + (trade.skinEmoji || '🎄') + ' ' + trade.skinName + '</div>';
            
            if (isOwn) {
                html += '<button class="trade-btn cancel" data-action="cancel" data-id="' + trade.id + '">❌ Отменить</button>';
            } else if (hasSkin) {
                html += '<button class="trade-btn" disabled>Уже есть</button>';
            } else if (canBuy) {
                html += '<button class="trade-btn buy" data-action="buy" data-id="' + trade.id + '" data-currency="' + currency + '" data-price="' + trade.price + '" data-seller="' + trade.sellerId + '">💰 Купить за ' + formatNumber(trade.price) + ' ' + curIcon + '</button>';
            } else {
                html += '<button class="trade-btn" disabled>Недостаточно ' + curIcon + '</button>';
            }
            html += '</div>';
        });
    }
    html += '</div>';
    
    const bg = showPopup('💱 Торговая площадка', html);
    
    // Копирование ID
    document.getElementById('btnCopyIdTrade').addEventListener('click', () => {
        navigator.clipboard.writeText(playerData.userId).then(() => {
            alert('✅ ID скопирован: ' + playerData.userId);
        }).catch(() => {
            alert('ID: ' + playerData.userId + ' (скопируйте вручную)');
        });
    });
    
    // Создание предложения
    bg.querySelector('#btnCT').addEventListener('click', async function() {
        const skinId = bg.querySelector('#tTs').value;
        const price = parseInt(bg.querySelector('#tTp').value);
        const targetId = bg.querySelector('#tTi').value.trim();
        const currency = bg.querySelector('#tTc').value;
        
        if (!skinId) { alert('❌ Выберите скин для продажи'); return; }
        if (!price || price < 1) { alert('❌ Укажите цену (минимум 1)'); return; }
        
        const result = await createTrade(skinId, price, targetId || null, currency);
        
        if (result.success) {
            // Удаляем скин у продавца
            playerData.ownedSkins = playerData.ownedSkins.filter(s => s !== skinId);
            if (playerData.activeSkin === skinId) playerData.activeSkin = 'default';
            saveData();
            updateUI();
            syncLeaderboard();
            bg.remove();
            showTrade();
            alert('✅ Скин выставлен на продажу!');
        } else {
            alert('❌ Ошибка создания предложения');
        }
    });
    
    // Обработчики кнопок покупки/отмены
    bg.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', async function() {
            const action = this.dataset.action;
            const tradeId = this.dataset.id;
            
            if (action === 'cancel') {
                if (!confirm('Отменить предложение? Скин вернется к вам.')) return;
                
                const result = await cancelTradeRequest(tradeId);
                if (result.success) {
                    if (result.skinId) {
                        playerData.ownedSkins.push(result.skinId);
                        saveData();
                        updateUI();
                        syncLeaderboard();
                    }
                    bg.remove();
                    showTrade();
                    alert('✅ Предложение отменено, скин возвращен');
                } else {
                    alert('❌ Ошибка при отмене');
                }
            } else if (action === 'buy') {
                const currency = this.dataset.currency;
                const price = parseInt(this.dataset.price);
                const sellerId = this.dataset.seller;
                
                await handleTradeBuy(tradeId, currency, price, sellerId, bg);
            }
        });
    });
}

// Обработка покупки на торгах
async function handleTradeBuy(tradeId, currency, price, sellerId, bg) {
    const curIcon = currency === 'wood' ? '🌲' : currency === 'crystals' ? '💎' : '⭐';
    
    if (currency === 'stars') {
        // Покупка за звезды Telegram
        if (!confirm('Купить этот скин за ' + price + ' ⭐?')) return;
        
        if (typeof tg.sendStarInvoice === 'function') {
            tg.sendStarInvoice({
                title: 'Покупка скина',
                description: 'Скин в игре Woodcutter',
                payload: 'trade_' + tradeId + '_' + userId + '_' + Date.now(),
                currency: 'XTR',
                prices: [{ amount: price, label: 'Скин с торгов' }]
            }, async function(status) {
                console.log('⭐ Trade invoice status:', status);
                if (status === 'paid') {
                    await completeTradePurchase(tradeId, currency, price, sellerId, bg);
                } else {
                    alert('❌ Оплата не прошла или была отменена');
                }
            });
        } else if (typeof tg.openInvoice === 'function') {
            try {
                const result = await apiCall('/create-star-invoice', 'POST', {
                    user_id: userId,
                    trade_id: tradeId,
                    skin_name: 'Покупка скина на торгах',
                    price: price,
                    type: 'trade_buy'
                });
                
                if (result.success && result.invoice_link) {
                    tg.openInvoice(result.invoice_link, async function(status) {
                        if (status === 'paid') {
                            await completeTradePurchase(tradeId, currency, price, sellerId, bg);
                        } else {
                            alert('❌ Оплата не прошла');
                        }
                    });
                } else {
                    alert('❌ Ошибка создания счета');
                }
            } catch (e) {
                alert('❌ Ошибка при создании счета');
            }
        } else {
            alert('❌ Покупки за звезды доступны только через бота Telegram');
        }
    } else {
        // Покупка за wood/crystals
        if (!confirm('Купить этот скин за ' + price + ' ' + curIcon + '?')) return;
        
        if (currency === 'wood' && playerData.wood < price) {
            alert('❌ Недостаточно древесины');
            return;
        }
        if (currency === 'crystals' && playerData.crystals < price) {
            alert('❌ Недостаточно кристаллов');
            return;
        }
        
        await completeTradePurchase(tradeId, currency, price, sellerId, bg);
    }
}

// Завершение покупки на торгах
async function completeTradePurchase(tradeId, currency, price, sellerId, bg) {
    const paymentType = currency === 'stars' ? 'stars' : 'direct';
    const result = await buyTrade(tradeId, paymentType);
    
    if (result.success) {
        if (currency === 'wood') playerData.wood -= price;
        else if (currency === 'crystals') playerData.crystals -= price;
        
        playerData.ownedSkins.push(result.skinId);
        saveData();
        updateUI();
        syncLeaderboard();
        
        bg.remove();
        showTrade();
        
        if (currency === 'stars') {
            alert('✅ Скин куплен! Продавец получил ' + result.sellerCut + '⭐, админ ' + result.adminCut + '⭐');
        } else {
            alert('✅ Скин куплен!');
        }
    } else {
        alert('❌ Ошибка при покупке: ' + (result.error || 'неизвестная ошибка'));
    }
}

// ==================== ЛИДЕРБОРД ====================
async function showLeaderboard() {
    const players = await getLeaderboard();
    
    let html = '<table class="lb-table"><thead><tr><th>#</th><th>Игрок</th><th>🌲</th><th>💎</th><th>🎄</th></tr></thead><tbody>';
    
    if (!players.length) {
        html += '<tr><td colspan="5" style="text-align:center;padding:20px;color:#aaa;">Нет игроков</td></tr>';
    } else {
        players.forEach((player, index) => {
            const rank = index + 1;
            let rankClass = '';
            let rankDisplay = rank;
            
            if (rank === 1) { rankClass = 'lb-gold'; rankDisplay = '🥇'; }
            else if (rank === 2) { rankClass = 'lb-silver'; rankDisplay = '🥈'; }
            else if (rank === 3) { rankClass = 'lb-bronze'; rankDisplay = '🥉'; }
            
            const isMe = (player.user_id || player.userId) === playerData.userId;
            
            html += '<tr class="' + (isMe ? 'lb-me' : '') + '">';
            html += '<td class="lb-rank ' + rankClass + '">' + rankDisplay + '</td>';
            html += '<td>' + escapeHtml(player.name) + '</td>';
            html += '<td>' + formatNumber(player.wood) + '</td>';
            html += '<td>' + formatNumber(player.crystals) + '</td>';
            html += '<td>' + (player.treeLevel || 1) + '</td>';
            html += '</tr>';
        });
    }
    
    html += '</tbody></table>';
    
    showPopup('🏆 Рейтинг', html);
}

// ==================== ПАССИВНЫЙ ДОХОД ====================
function passiveIncome() {
    if (playerData.autoWood > 0) {
        playerData.wood += playerData.autoWood;
        updateUI();
    }
}
