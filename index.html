<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Woodcutter | Telegram Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #1a1a2e; --panel: #16213e; --accent: #e2a03f; --text: #eee; --text-secondary: #aaa; --border: #2a2a4a; --gold: #ffd700; }
        * { margin:0; padding:0; box-sizing:border-box; }
        html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:-apple-system,sans-serif; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
        .app-container { width:100%; height:100%; display:flex; justify-content:center; align-items:center; background:var(--bg); }
        .phone-frame { width:100%; height:100%; max-width:430px; background:var(--bg); display:flex; flex-direction:column; position:relative; overflow:hidden; }
        .header { background:var(--panel); padding:12px 16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border); flex-shrink:0; }
        .header .avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#e2a03f,#c47f2a); display:flex; align-items:center; justify-content:center; font-size:20px; overflow:hidden; background-size:cover; }
        .header .title { font-weight:600; color:var(--text); font-size:15px; cursor:pointer; }
        .header .subtitle { font-size:11px; color:var(--text-secondary); }
        .game-area { flex:1; display:flex; flex-direction:column; padding:10px; overflow-y:auto; gap:8px; -webkit-overflow-scrolling:touch; padding-bottom:20px; }
        .resources { display:flex; gap:8px; }
        .resource-card { flex:1; background:var(--panel); border-radius:12px; padding:10px 14px; display:flex; align-items:center; gap:12px; border:1px solid var(--border); }
        .resource-icon { font-size:24px; }
        .resource-info { display:flex; flex-direction:column; gap:4px; }
        .resource-value { font-size:20px; font-weight:700; color:var(--text); line-height:1; }
        .resource-label { font-size:10px; color:var(--text-secondary); }
        .tree-scene { background:var(--panel); border-radius:16px; padding:12px; display:flex; flex-direction:column; align-items:center; gap:8px; border:1px solid var(--border); }
        .tree-container { position:relative; width:100%; max-width:240px; aspect-ratio:3/4; cursor:pointer; }
        .tree-container:active { transform:scale(0.96); }
        .tree-container.shake { animation:shake 0.4s ease; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-4px)} 40%{transform:translateX(4px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }
        .tree-fall { animation:fall 0.6s ease forwards; }
        @keyframes fall { 0%{transform:rotate(0);opacity:1} 100%{transform:rotate(80deg) translateX(60px);opacity:0} }
        .tree-svg { width:100%; height:100%; pointer-events:none; }
        .axe-emoji { position:absolute; right:8%; top:42%; font-size:40px; pointer-events:none; z-index:6; filter:drop-shadow(2px 3px 3px rgba(0,0,0,0.4)); }
        .axe-emoji.swing { animation:axeSwing 0.3s ease; }
        @keyframes axeSwing { 0%{transform:rotate(-40deg)} 50%{transform:rotate(20deg)} 100%{transform:rotate(0deg)} }
        .tree-level-badge { position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.8); color:var(--gold); padding:3px 8px; border-radius:12px; font-size:12px; font-weight:700; border:1px solid var(--gold); }
        .hp-bar-container { width:100%; background:#2a2a3a; border-radius:8px; height:14px; overflow:hidden; border:1px solid var(--border); }
        .hp-bar { height:100%; border-radius:8px; transition:width 0.3s ease; }
        .hp-bar.high { background:linear-gradient(90deg,#4caf84,#81c784); }
        .hp-bar.medium { background:linear-gradient(90deg,#f39c12,#e67e22); }
        .hp-bar.low { background:linear-gradient(90deg,#e74c3c,#c0392b); }
        .hp-text { font-size:12px; color:var(--text); text-align:center; font-weight:600; }
        .combo-display { color:var(--text-secondary); font-size:11px; text-align:center; min-height:16px; }
        .combo-fire { color:#ff6b35; }
        .combo-timer-bar { width:100%; height:4px; background:#2a2a3a; border-radius:2px; overflow:hidden; margin-top:4px; }
        .combo-timer-fill { height:100%; background:var(--accent); border-radius:2px; width:100%; transition:width 0.1s linear; }
        .float-text { position:absolute; font-weight:700; pointer-events:none; animation:floatUp 1s ease-out forwards; z-index:20; font-size:16px; }
        @keyframes floatUp { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-50px)} }
        .btn-row { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
        .btn { padding:12px 8px; border-radius:12px; border:none; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:4px; min-height:44px; }
        .btn:active { transform:scale(0.95); }
        .btn-shop { background:var(--panel); color:var(--text); border:1px solid var(--border); }
        .btn-leaderboard { background:linear-gradient(135deg,#ffd700,#ffaa00); color:#000; }
        .btn-trees { background:linear-gradient(135deg,#4caf50,#2d6b2d); color:#fff; }
        .btn-trade { background:linear-gradient(135deg,#a78bfa,#7c3aed); color:#fff; }
        .passive-info { text-align:center; color:var(--text-secondary); font-size:11px; }
        .popup-bg { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.75); z-index:9999; display:flex; align-items:flex-end; justify-content:center; }
        .popup { background:#16213e; border-radius:16px 16px 0 0; width:100%; max-width:430px; max-height:85vh; overflow-y:auto; padding:16px 12px 30px; border:1px solid #2a2a4a; }
        .popup h3 { color:#eee; font-size:18px; margin-bottom:12px; text-align:center; }
        .popup-close { width:100%; padding:14px; border-radius:12px; border:1px solid #2a2a4a; background:#16213e; color:#eee; font-size:15px; font-weight:600; margin-top:8px; }
        .shop-cat { color:#e2a03f; font-size:13px; font-weight:700; margin:12px 0 6px; padding-bottom:4px; border-bottom:1px solid #2a2a4a; }
        .shop-item { background:#1e2a3a; border-radius:12px; padding:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; border:1px solid #2a2a4a; gap:8px; }
        .shop-name { font-weight:600; color:#eee; font-size:14px; }
        .shop-desc { font-size:11px; color:#aaa; }
        .shop-lvl { font-size:10px; color:#e2a03f; }
        .shop-buy { padding:8px 14px; border-radius:10px; border:none; font-weight:600; font-size:12px; cursor:pointer; }
        .shop-buy.wood { background:#4caf84; color:#fff; } .shop-buy.crystal { background:#a78bfa; color:#fff; }
        .shop-buy:disabled { opacity:0.4; }
        .skin-tabs { display:flex; gap:8px; margin-bottom:12px; }
        .skin-tab { flex:1; padding:10px; border-radius:10px; border:1px solid #2a2a4a; background:transparent; color:#eee; cursor:pointer; font-weight:600; font-size:13px; text-align:center; }
        .skin-tab.active { background:#e2a03f; border-color:#e2a03f; color:#000; }
        .skin-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
        .skin-card { background:#1e2a3a; border-radius:12px; padding:10px; text-align:center; border:2px solid #2a2a4a; cursor:pointer; position:relative; }
        .skin-card.active { border-color:#ffd700; }
        .skin-emoji { font-size:32px; display:block; margin-bottom:6px; }
        .skin-img { width:48px; height:48px; object-fit:contain; display:block; margin:0 auto 6px; border-radius:8px; }
        .skin-name { font-size:11px; color:#eee; font-weight:600; }
        .skin-price { font-size:10px; color:#e2a03f; margin-top:3px; }
        .skin-price-star { font-size:10px; color:#ffd700; margin-top:3px; }
        .skin-delete-btn { position:absolute; top:4px; right:4px; background:#e74c3c; color:#fff; border:none; border-radius:50%; width:20px; height:20px; font-size:10px; cursor:pointer; z-index:10; }
        .add-skin-btn { width:100%; padding:12px; border-radius:10px; border:2px dashed #e2a03f; background:transparent; color:#e2a03f; font-weight:600; cursor:pointer; margin-top:12px; }
        .trade-item { background:#1e2a3a; border-radius:12px; padding:12px; margin-bottom:8px; border:1px solid #2a2a4a; }
        .trade-header { display:flex; justify-content:space-between; margin-bottom:6px; }
        .trade-seller-name { font-weight:600; color:#eee; font-size:13px; }
        .trade-seller-id { font-size:10px; color:#aaa; font-family:monospace; }
        .trade-price { color:#e2a03f; font-weight:700; }
        .trade-tree { font-size:20px; text-align:center; margin:6px 0; }
        .trade-btn { width:100%; padding:10px; border-radius:10px; border:none; color:#fff; font-weight:600; cursor:pointer; margin-top:6px; }
        .trade-btn.buy { background:#4caf84; } .trade-btn.cancel { background:#e74c3c; }
        .trade-btn:disabled { opacity:0.4; }
        .create-form { background:#1e2a3a; border-radius:12px; padding:12px; margin-bottom:12px; border:1px solid #2a2a4a; }
        .form-group { margin-bottom:8px; }
        .form-group label { display:block; color:#aaa; font-size:11px; margin-bottom:3px; }
        .form-input { width:100%; padding:10px; border-radius:10px; border:1px solid #2a2a4a; background:#1a1a2e; color:#eee; font-size:14px; margin-top:3px; }
        .form-submit { width:100%; padding:12px; border-radius:10px; border:none; background:#e2a03f; color:#000; font-weight:700; cursor:pointer; }
        .lb-table { width:100%; border-collapse:collapse; }
        .lb-table th { color:#aaa; font-size:10px; padding:8px 6px; }
        .lb-table td { color:#fff; font-size:12px; padding:8px 6px; border-bottom:1px solid #2a2a4a; }
        .lb-rank { font-weight:700; font-size:14px; text-align:center; width:35px; }
        .lb-gold { color:#ffd700; } .lb-silver { color:#c0c0c0; } .lb-bronze { color:#cd7f32; }
        .lb-me { background:rgba(226,160,63,0.15); }
        .section-title { color:#e2a03f; font-size:13px; font-weight:700; margin:12px 0 6px; padding-bottom:4px; border-bottom:1px solid #2a2a4a; }
        .admin-panel { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:99999; overflow-y:auto; padding:20px; }
        .admin-inner { max-width:500px; margin:0 auto; background:#16213e; border-radius:16px; padding:20px; }
        .admin-inner h2 { color:#ffd700; text-align:center; }
        .admin-inner h3 { color:#e2a03f; margin:15px 0 10px; }
        .admin-input { width:100%; padding:10px; border-radius:10px; border:1px solid #2a2a4a; background:#1a1a2e; color:#eee; margin-bottom:8px; }
        .admin-btn { width:100%; padding:12px; border-radius:10px; border:none; font-weight:700; font-size:14px; cursor:pointer; margin-bottom:8px; color:#fff; }
        .admin-btn.green { background:#4caf84; } .admin-btn.purple { background:#a78bfa; } .admin-btn.gold { background:#e2a03f; color:#000; } .admin-btn.red { background:#e74c3c; }
    </style>
</head>
<body>
<div class="app-container"><div class="phone-frame">
    <div class="header">
        <div class="avatar" id="av">🪓</div>
        <div>
            <div class="title" id="th">Woodcutter</div>
            <div class="subtitle" id="nd">...</div>
        </div>
    </div>
    <div class="game-area">
        <div class="resources">
            <div class="resource-card">
                <span class="resource-icon">🌲</span>
                <div class="resource-info">
                    <span class="resource-value" id="wv">0</span>
                    <span class="resource-label">Древесина</span>
                </div>
            </div>
            <div class="resource-card">
                <span class="resource-icon">💎</span>
                <div class="resource-info">
                    <span class="resource-value" id="cv">0</span>
                    <span class="resource-label">Кристаллы</span>
                </div>
            </div>
        </div>
        <div class="tree-scene">
            <div class="tree-container" id="tc">
                <div class="tree-level-badge" id="lb">🌲 Ур. 1</div>
                <div class="axe-emoji" id="ax">🪓</div>
                <svg class="tree-svg" viewBox="0 0 260 360">
                    <ellipse cx="130" cy="330" rx="110" ry="20" fill="#3d2b1f" opacity="0.6"/>
                    <rect x="115" y="180" width="30" height="152" rx="7" fill="#6b4226" id="tr"/>
                    <ellipse cx="130" cy="130" rx="85" ry="75" fill="#3a7d3a" id="c1"/>
                    <ellipse cx="130" cy="85" rx="70" ry="65" fill="#4caf50" id="c2"/>
                    <ellipse cx="130" cy="45" rx="55" ry="55" fill="#66bb6a" id="c3"/>
                </svg>
                <div id="floatTextContainer" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></div>
            </div>
            <div class="hp-bar-container"><div class="hp-bar high" id="hp" style="width:100%"></div></div>
            <div class="hp-text" id="ht">15 / 15 HP</div>
            <div class="combo-display" id="cd">Нажимай на дерево! 🪓</div>
            <div class="combo-timer-bar" id="ctb" style="display:none;"><div class="combo-timer-fill" id="ctf" style="width:100%;"></div></div>
        </div>
        <div class="btn-row">
            <button class="btn btn-shop" id="bs">🏪 Магазин</button>
            <button class="btn btn-leaderboard" id="bl">🏆 Рейтинг</button>
            <button class="btn btn-trees" id="bt">🎄 Скины</button>
            <button class="btn btn-trade" id="btr">💱 Торги</button>
        </div>
        <div class="passive-info" id="pi"></div>
    </div>
</div></div>

<!-- АДМИН-ПАНЕЛЬ -->
<div class="admin-panel" id="ap">
    <div class="admin-inner">
        <h2>👑 Админ-панель</h2>
        <h3>💰 Выдать ресурсы</h3>
        <input type="text" id="atid" class="admin-input" placeholder="ID игрока">
        <input type="number" id="aw" class="admin-input" placeholder="🌲 Древесина">
        <input type="number" id="ac" class="admin-input" placeholder="💎 Кристаллы">
        <button onclick="admGive()" class="admin-btn green">Выдать</button>
        <h3>🎄 Выдать скин</h3>
        <input type="text" id="asid" class="admin-input" placeholder="ID игрока">
        <select id="ass" class="admin-input"></select>
        <button onclick="admGiveSkin()" class="admin-btn purple">Выдать скин</button>
        <h3>🪓 Выдать топор</h3>
        <input type="text" id="aaxid" class="admin-input" placeholder="ID игрока">
        <select id="aaxs" class="admin-input"></select>
        <button onclick="admGiveAxe()" class="admin-btn gold">Выдать топор</button>
        <h3>🗑️ Забрать ресурсы</h3>
        <input type="text" id="atkid" class="admin-input" placeholder="ID игрока">
        <input type="number" id="atkw" class="admin-input" placeholder="🌲 Древесина">
        <input type="number" id="atkc" class="admin-input" placeholder="💎 Кристаллы">
        <button onclick="admTake()" class="admin-btn red">Забрать</button>
        <button onclick="document.getElementById('ap').style.display='none'" class="admin-btn" style="background:#16213e;color:#eee;border:1px solid #2a2a4a;margin-top:15px;">Закрыть</button>
    </div>
</div>

<script>
var API_URL = 'https://delay.pythonanywhere.com/api';
var tg = window.Telegram.WebApp;
tg.expand();
tg.ready();

var user = tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
var userId = user ? 'WC' + String(user.id).slice(-6).padStart(6, '0') : 'WC' + Math.random().toString(36).substr(2, 6).toUpperCase();
var userName = user ? (user.first_name + (user.last_name ? ' ' + user.last_name : '')) : 'Игрок';
var STORAGE_KEY = 'wc_' + userId;
var ADMIN_ID = 'WC046190';

console.log('Woodcutter v5.0');
console.log('User:', userId, 'Admin:', userId === ADMIN_ID);

if (user && user.photo_url) {
    document.getElementById('av').style.backgroundImage = 'url(' + user.photo_url + ')';
    document.getElementById('av').textContent = '';
}

// Админ-панель (5 нажатий на заголовок)
var titleClicks = 0;
document.getElementById('th').addEventListener('click', function() {
    titleClicks++;
    if (titleClicks >= 5) {
        titleClicks = 0;
        if (userId === ADMIN_ID) {
            document.getElementById('ap').style.display = 'block';
            updateAdminSelects();
        } else {
            alert('⛔ Нет доступа');
        }
    }
    setTimeout(function() { titleClicks = 0; }, 2000);
});

// Данные игрока
var playerData = {
    name: userName, userId: userId, wood: 0, crystals: 0, stars: 0,
    axePower: 1, crystalBonus: 1, autoWood: 0, critChance: 0, critMultiplier: 2,
    crystalToWoodRate: 0, comboBonus: 0, combo: 0, comboMultiplier: 1,
    treeHP: 15, maxTreeHP: 15, totalTrees: 0, treeLevel: 1,
    activeSkin: 'default', ownedSkins: ['default'],
    activeAxe: 'default', ownedAxes: ['default'], upgrades: {}
};

try {
    var saved = localStorage.getItem(STORAGE_KEY);
    if (saved) { var parsed = JSON.parse(saved); for (var key in parsed) { if (parsed.hasOwnProperty(key)) playerData[key] = parsed[key]; } }
} catch (e) {}

playerData.name = userName; playerData.userId = userId;
if (!playerData.maxTreeHP || playerData.maxTreeHP < 10) { playerData.maxTreeHP = 15; playerData.treeHP = 15; }
if (!playerData.ownedSkins || !playerData.ownedSkins.length) playerData.ownedSkins = ['default'];
if (!playerData.ownedAxes || !playerData.ownedAxes.length) playerData.ownedAxes = ['default'];
if (!playerData.activeSkin) playerData.activeSkin = 'default';
if (!playerData.activeAxe) playerData.activeAxe = 'default';
if (!playerData.upgrades) playerData.upgrades = {};

var upgradeIds = ['axe','strength','crystal1','crystal2','auto1','auto2','auto3','auto4','crit1','crit2','crystalToWood1','crystalToWood2','crystalAuto1','crystalAuto2','critDamage1','comboBoost1'];
for (var i = 0; i < upgradeIds.length; i++) { if (!(upgradeIds[i] in playerData.upgrades)) playerData.upgrades[upgradeIds[i]] = 0; }

// Скины
var treeSkins = [
    {id:'default',name:'Обычное',emoji:'🌳',colors:['#3a7d3a','#4caf50','#66bb6a'],price:0,cur:'free'},
    {id:'autumn',name:'Осеннее',emoji:'🍂',colors:['#c47f2a','#d4943a','#e2a03f'],price:500,cur:'crystals'},
    {id:'cherry',name:'Сакура',emoji:'🌸',colors:['#ff9ec4','#ffbdd4','#ffd1e4'],price:800,cur:'crystals'},
    {id:'crystal',name:'Кристальное',emoji:'💎',colors:['#a78bfa','#c4b5fd','#ddd6fe'],price:1200,cur:'crystals'},
    {id:'golden',name:'Золотое',emoji:'✨',colors:['#d4a017','#e6c22a','#f0d840'],price:2000,cur:'crystals'},
    {id:'inferno',name:'Огненное',emoji:'🔥',colors:['#cc3300','#e64d00','#ff6600'],price:3500,cur:'crystals'},
    {id:'ocean',name:'Океанское',emoji:'🌊',colors:['#0066cc','#0088e6','#00aaff'],price:10,cur:'stars'},
    {id:'void',name:'Бездны',emoji:'🕳️',colors:['#1a0033','#2d004d','#400066'],price:25,cur:'stars'},
    {id:'rainbow',name:'Радужное',emoji:'🌈',colors:['#ff0000','#ff7700','#ffff00'],price:50,cur:'stars'}
];
var axeSkins = [
    {id:'default',name:'Обычный',emoji:'🪓',price:0,cur:'free'},
    {id:'gold_axe',name:'Золотой',emoji:'🥇',price:1000,cur:'crystals'},
    {id:'diamond_axe',name:'Алмазный',emoji:'💎',price:3000,cur:'crystals'},
    {id:'fire_axe',name:'Огненный',emoji:'🔥',price:5000,cur:'crystals'}
];

try { var ct = JSON.parse(localStorage.getItem('c_ts')||'[]'); ct.forEach(function(s){ treeSkins.push(s); }); } catch(e) {}
try { var ca = JSON.parse(localStorage.getItem('c_as')||'[]'); ca.forEach(function(a){ axeSkins.push(a); }); } catch(e) {}

// Магазин
var shopItems = [
    {id:'axe',name:'🪓 Топор получше',desc:'+1 к силе',base:10,mult:1.5,cur:'wood',cost:function(){return Math.floor(this.base*Math.pow(this.mult,playerData.upgrades[this.id]||0))},effect:function(){playerData.axePower++;playerData.upgrades[this.id]=(playerData.upgrades[this.id]||0)+1}},
    {id:'strength',name:'💪 Силашка',desc:'+2 к силе',base:25,mult:1.6,cur:'wood',cost:function(){return Math.floor(this.base*Math.pow(this.mult,playerData.upgrades[this.id]||0))},effect:function(){playerData.axePower+=2;playerData.upgrades[this.id]=(playerData.upgrades[this.id]||0)+1}},
    {id:'crit1',name:'🎯 Заточка',desc:'+5% крит',base:30,mult:1.7,cur:'wood',cost:function(){return Math.floor(this.base*Math.pow(this.mult,playerData.upgrades[this.id]||0))},effect:function(){playerData.critChance=Math.min(80,playerData.critChance+5);playerData.upgrades[this.id]=(playerData.upgrades[this.id]||0)+1}},

function escapeHtml(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

var COMBO_TIMEOUT = 5000; var comboTimer = null;
function resetCombo() {
    if (comboTimer) clearTimeout(comboTimer);
    var bar = document.getElementById('ctb'), fill = document.getElementById('ctf');
    if (playerData.combo > 0) {
        bar.style.display = 'block'; fill.style.transition = 'none'; fill.style.width = '100%';
        requestAnimationFrame(function() { fill.style.transition = 'width ' + COMBO_TIMEOUT + 'ms linear'; fill.style.width = '0%'; });
        comboTimer = setTimeout(function() { playerData.combo = 0; playerData.comboMultiplier = 1; bar.style.display = 'none'; fill.style.transition = 'none'; fill.style.width = '100%'; updateUI(); }, COMBO_TIMEOUT);
    } else bar.style.display = 'none';

function animAxe() { var a = document.getElementById('ax'); a.classList.remove('swing'); void a.offsetWidth; a.classList.add('swing'); }
function animShake() { var t = document.getElementById('tc'); t.classList.add('shake'); setTimeout(function() { t.classList.remove('shake'); }, 400); }
function animFall(cb) { var t = document.getElementById('tc'); t.classList.add('tree-fall'); setTimeout(function() { t.classList.remove('tree-fall'); if (cb) cb(); }, 600); }
function floatText(text, color, x, y) { var el = document.createElement('div'); el.className = 'float-text'; el.textContent = text; el.style.color = color; el.style.left = x + 'px'; el.style.top = y + 'px'; document.getElementById('floatTextContainer').appendChild(el); setTimeout(function() { el.remove(); }, 1000); }

function calculateTreeHP(lv) {
    var bMin = 15, bMax = 30, m;
    if (lv <= 10) m = 1 + (lv - 1) * 0.5;
    else if (lv <= 50) m = 5.5 + (lv - 10) * 0.3;
    else if (lv <= 200) m = 17.5 + (lv - 50) * 0.2;
    else if (lv <= 1000) m = 47.5 + (lv - 200) * 0.1;
    else if (lv <= 5000) m = 127.5 + (lv - 1000) * 0.05;
    else m = 327.5 + (lv - 5000) * 0.02;
    return Math.floor(Math.random() * (bMax * m - bMin * m) + bMin * m + (lv - 1) * 5);
}

function chop() {
    if (playerData.treeHP <= 0) { playerData.maxTreeHP = calculateTreeHP(playerData.treeLevel); playerData.treeHP = playerData.maxTreeHP; updateUI(); return; }
    var dmg = playerData.axePower; var crit = Math.random() * 100 < playerData.critChance; if (crit) dmg = Math.floor(dmg * playerData.critMultiplier);
    playerData.combo = Math.min(50, playerData.combo + 1); playerData.comboMultiplier = 1 + playerData.combo * (0.01 + playerData.comboBonus / 100);
    dmg = Math.max(1, Math.floor(dmg * playerData.comboMultiplier)); playerData.treeHP -= dmg; playerData.wood += dmg;
    animAxe(); resetCombo();
    var r = document.getElementById('tc').getBoundingClientRect();
    floatText((crit ? '💥+' : '+') + formatNumber(dmg) + '🌲', crit ? '#ff6b6b' : '#e2a03f', r.width / 2, r.height * 0.5);
    if (playerData.treeHP <= 0) {
        playerData.crystals += playerData.crystalBonus;
        if (playerData.crystalToWoodRate > 0 && playerData.crystals > 0) { var conv = Math.floor(playerData.crystals * playerData.crystalToWoodRate); playerData.wood += conv; floatText('🔄+' + formatNumber(conv) + '🌲', '#4caf84', r.width / 2, r.height * 0.5 + 20); }
        playerData.totalTrees++; playerData.treeLevel = Math.min(Math.floor(playerData.totalTrees / 2) + 1, 9999);
        animFall(function() { playerData.maxTreeHP = calculateTreeHP(playerData.treeLevel); playerData.treeHP = playerData.maxTreeHP; updateUI(); });
        floatText('🎉+' + playerData.crystalBonus + '💎', '#a78bfa', r.width / 2, r.height * 0.5 - 25);
    } else animShake();
    updateUI(); saveData();
}

function showPopup(title, content) {
    var bg = document.createElement('div'); bg.className = 'popup-bg';
    bg.innerHTML = '<div class="popup"><h3>' + title + '</h3>' + content + '<button class="popup-close">Закрыть</button></div>';
    bg.querySelector('button').addEventListener('click', function() { bg.remove(); });
    bg.addEventListener('click', function(e) { if (e.target === bg) bg.remove(); });
    document.body.appendChild(bg); return bg;
}

function showShop() {
    var html = '', cat = '';
    shopItems.forEach(function(item) {
        var cn = item.cur === 'wood' ? '🌲 За древесину' : '💎 За кристаллы';
        if (cat !== cn) { cat = cn; html += '<div class="shop-cat">' + cn + '</div>'; }
        var cost = item.cost(), afford = item.cur === 'wood' ? playerData.wood >= cost : playerData.crystals >= cost;
        html += '<div class="shop-item"><div><span class="shop-name">' + item.name + '</span><br><span class="shop-desc">' + item.desc + '</span>' + (playerData.upgrades[item.id] > 0 ? '<br><span class="shop-lvl">Ур. ' + playerData.upgrades[item.id] + '</span>' : '') + '</div><button class="shop-buy ' + (item.cur === 'wood' ? 'wood' : 'crystal') + '" data-id="' + item.id + '" ' + (afford ? '' : 'disabled') + '>' + formatNumber(cost) + ' ' + (item.cur === 'wood' ? '🌲' : '💎') + '</button></div>';
    });
    var bg = showPopup('🏪 Магазин', html);
    bg.querySelectorAll('button[data-id]').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var item = shopItems.find(function(i) { return i.id === this.dataset.id; }); if (!item) return;
            var cost = item.cost(); if (item.cur === 'wood' && playerData.wood < cost) return; if (item.cur === 'crystals' && playerData.crystals < cost) return;
            if (item.cur === 'wood') playerData.wood -= cost; else playerData.crystals -= cost;
            item.effect(); updateUI(); saveData(); bg.remove(); showShop();
        });
    });
}

function showSkins() {
    var ct = 'tree';
    function render(tab) {
        ct = tab;
        var html = '<div class="skin-tabs"><div class="skin-tab ' + (tab === 'tree' ? 'active' : '') + '" data-tab="tree">🎄 Деревья</div><div class="skin-tab ' + (tab === 'axe' ? 'active' : '') + '" data-tab="axe">🪓 Топоры</div></div><div class="skin-grid">';
        var skins = tab === 'tree' ? treeSkins : axeSkins;
        var owned = tab === 'tree' ? playerData.ownedSkins : playerData.ownedAxes;
        var active = tab === 'tree' ? playerData.activeSkin : playerData.activeAxe;
        skins.forEach(function(skin) {
            if (skin.hidden && owned.indexOf(skin.id) === -1) return;
            var ow = owned.indexOf(skin.id) !== -1, ac = active === skin.id, ph = '';
            if (!ow) { if (skin.cur === 'free') ph = '<div class="skin-price">Бесплатно</div>'; else if (skin.cur === 'crystals') ph = '<div class="skin-price">🔒 ' + formatNumber(skin.price) + ' 💎</div>'; else ph = '<div class="skin-price-star">⭐ ' + skin.price + ' звёзд</div>'; }
            var isC = skin.id.indexOf('custom_') === 0;
            var imgH = skin.img ? '<img src="' + skin.img + '" class="skin-img">' : '<span class="skin-emoji">' + (skin.emoji || '🎄') + '</span>';
            html += '<div class="skin-card ' + (ac ? 'active' : '') + '" data-sid="' + skin.id + '" data-type="' + tab + '">' + (isC && userId === ADMIN_ID ? '<button class="skin-delete-btn" data-del="' + skin.id + '" data-dt="' + tab + '">✕</button>' : '') + imgH + '<div class="skin-name">' + skin.name + '</div>' + ph + (ac ? '<div style="color:#ffd700;font-size:10px;">✅</div>' : '') + '</div>';
        });
        html += '</div>';
        if (userId === ADMIN_ID) html += '<button class="add-skin-btn" id="addBtn">➕ Добавить скин</button>';
        var bg = document.createElement('div'); bg.className = 'popup-bg';
        bg.innerHTML = '<div class="popup"><h3>🎨 Скины</h3>' + html + '<button class="popup-close">Закрыть</button></div>';
        document.body.appendChild(bg);
        bg.querySelector('.popup-close').addEventListener('click', function() { bg.remove(); });
        bg.addEventListener('click', function(e) { if (e.target === bg) bg.remove(); });
        bg.querySelectorAll('.skin-tab').forEach(function(t) { t.addEventListener('click', function() { bg.remove(); render(t.dataset.tab); }); });
        bg.querySelectorAll('[data-sid]').forEach(function(el) {
            el.addEventListener('click', function(e) {
                if (e.target.classList.contains('skin-delete-btn')) return;
                var sid = this.dataset.sid, type = this.dataset.type, skins = type === 'tree' ? treeSkins : axeSkins;
                var skin = skins.find(function(s) { return s.id === sid; });
                var owned = type === 'tree' ? playerData.ownedSkins : playerData.ownedAxes;
                if (owned.indexOf(sid) !== -1) {
                    if (type === 'tree') playerData.activeSkin = sid; else playerData.activeAxe = sid;
                    updateUI(); saveData(); bg.remove(); render(ct);
                } else if (skin.cur === 'free') {
                    owned.push(sid); if (type === 'tree') playerData.activeSkin = sid; else playerData.activeAxe = sid;
                    updateUI(); saveData(); bg.remove(); render(ct);
                } else if (skin.cur === 'crystals') {
                    if (playerData.crystals >= skin.price) {
                        if (confirm('Купить за ' + skin.price + ' 💎?')) { playerData.crystals -= skin.price; owned.push(sid); if (type === 'tree') playerData.activeSkin = sid; else playerData.activeAxe = sid; updateUI(); saveData(); bg.remove(); render(ct); }
                    } else alert('Недостаточно кристаллов!');
                } else if (skin.cur === 'stars') {
                    if (!confirm('Купить "' + skin.name + '" за ' + skin.price + ' ⭐?')) return;
                    if (typeof tg.sendStarInvoice === 'function') {
                        tg.sendStarInvoice({ title: 'Скин: ' + skin.name, description: 'Скин для Woodcutter', payload: 'skin_' + skin.id + '_' + userId, currency: 'XTR', prices: [{ amount: skin.price, label: skin.name }] }, function(status) {
                            if (status === 'paid') { if (owned.indexOf(skin.id) === -1) { owned.push(skin.id); if (type === 'tree') playerData.activeSkin = skin.id; else playerData.activeAxe = skin.id; playerData.stars = (playerData.stars || 0) + skin.price; updateUI(); saveData(); bg.remove(); render(ct); alert('✅ Куплено!'); } } else alert('❌ Оплата не прошла');
                        });
                    } else alert('❌ Нужен бот Telegram');
                }
            });
        });
        bg.querySelectorAll('.skin-delete-btn').forEach(function(btn) {
            btn.addEventListener('click', function(e) { e.stopPropagation();
                var sid = this.dataset.del, type = this.dataset.dt;
                if (confirm('Удалить?')) {
                    if (type === 'tree') { var idx = treeSkins.findIndex(function(s) { return s.id === sid; }); if (idx !== -1) treeSkins.splice(idx, 1); localStorage.setItem('c_ts', JSON.stringify(treeSkins.filter(function(s) { return s.id.indexOf('custom_') === 0; }))); }
                    else { var idx = axeSkins.findIndex(function(s) { return s.id === sid; }); if (idx !== -1) axeSkins.splice(idx, 1); localStorage.setItem('c_as', JSON.stringify(axeSkins.filter(function(s) { return s.id.indexOf('custom_') === 0; }))); }
                    bg.remove(); render(ct);
                }
            });
        });
        var ab = bg.querySelector('#addBtn'); if (ab) ab.addEventListener('click', function() { bg.remove(); addSkinForm(); });
    }
    render('tree');
}

function addSkinForm() {
    var html = '<div class="create-form"><div class="form-group"><label>Тип</label><select id="st" class="form-input"><option value="tree">🎄 Дерево</option><option value="axe">🪓 Топор</option></select></div><div class="form-group"><label>Название</label><input id="sn" class="form-input" placeholder="Мой скин"></div><div class="form-group"><label>Эмодзи</label><input id="se" class="form-input" value="🎄"></div><div class="form-group"><label>Фото</label><input type="file" id="sp" class="form-input" accept="image/*"></div><div class="form-group"><label>Цена</label><input type="number" id="spr" class="form-input" value="500"></div><div id="prev" style="text-align:center;margin:8px 0;"></div><button id="svBtn" class="form-submit">Добавить</button></div>';
    var bg = document.createElement('div'); bg.className = 'popup-bg';
    bg.innerHTML = '<div class="popup"><h3>➕ Новый скин</h3>' + html + '<button class="popup-close">Закрыть</button></div>';
    document.body.appendChild(bg);
    bg.querySelector('.popup-close').addEventListener('click', function() { bg.remove(); });
    bg.addEventListener('click', function(e) { if (e.target === bg) bg.remove(); });
    bg.querySelector('#sp').addEventListener('change', function(e) { var f = e.target.files[0]; if (f) { var r = new FileReader(); r.onload = function(ev) { bg.querySelector('#prev').innerHTML = '<img src="' + ev.target.result + '" style="width:80px;height:80px;object-fit:contain;border-radius:8px;border:2px solid #e2a03f;">'; }; r.readAsDataURL(f); } });
    bg.querySelector('#svBtn').addEventListener('click', function() {
        var type = bg.querySelector('#st').value, name = bg.querySelector('#sn').value.trim(), emoji = bg.querySelector('#se').value.trim();
        var price = parseInt(bg.querySelector('#spr').value) || 500, photo = bg.querySelector('#sp').files[0];
        if (!name) { alert('Введите название!'); return; }
        function saveSkin(imgData) {
            var ns = { id: 'custom_' + Date.now(), name: name, emoji: emoji || '🎄', img: imgData || null, colors: ['#4caf50', '#66bb6a', '#81c784'], price: price, cur: 'crystals', hidden: false };
            if (type === 'tree') { treeSkins.push(ns); localStorage.setItem('c_ts', JSON.stringify(treeSkins.filter(function(s) { return s.id.indexOf('custom_') === 0; }))); }
            else { axeSkins.push(ns); localStorage.setItem('c_as', JSON.stringify(axeSkins.filter(function(s) { return s.id.indexOf('custom_') === 0; }))); }
            alert('✅ Добавлен!'); bg.remove(); showSkins(); updateAdminSelects();
        }
        if (photo) { var reader = new FileReader(); reader.onload = function(ev) { var img = new Image(); img.onload = function() { var c = document.createElement('canvas'); var mw = 200, s = mw / img.width; c.width = mw; c.height = img.height * s; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); saveSkin(c.toDataURL('image/jpeg', 0.6)); }; img.src = ev.target.result; }; reader.readAsDataURL(photo); }
        else saveSkin(null);
    });
}

function showTrade() {
    fetch(API_URL + '/trades?user_id=' + userId).then(function(r) { return r.json(); }).then(function(data) {
        var trades = data.success ? data.trades : [];
        var html = '<div style="background:#1e2a3a;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;border:1px solid #2a2a4a;"><span style="color:#aaa;font-size:12px;">Ваш ID: <span style="color:#e2a03f;font-weight:700;font-family:monospace;">' + userId + '</span></span><button id="btnCopyId" style="background:#e2a03f;color:#000;border:none;padding:6px 10px;border-radius:8px;font-size:11px;cursor:pointer;">📋</button></div>';
        html += '<div class="create-form"><div class="form-group"><label>Скин</label><select id="trSkin" class="form-input"><option value="">-- Выбрать --</option>';
        playerData.ownedSkins.forEach(function(sid) { if (sid === 'default') return; var s = treeSkins.find(function(x) { return x.id === sid; }); if (s) html += '<option value="' + s.id + '">' + (s.emoji || '🎄') + ' ' + s.name + '</option>'; });
        html += '</select></div><div class="form-group"><label>Валюта</label><select id="trCur" class="form-input"><option value="wood">🌲 Древесина</option><option value="crystals">💎 Кристаллы</option><option value="stars">⭐ Звёзды</option></select></div><div class="form-group"><label>Цена</label><input type="number" id="trPrice" class="form-input" value="100" min="1"></div><button id="btnCreate" class="form-submit">📤 Выставить</button></div>';
        html += '<div class="section-title">📋 Предложения</div>';
        if (!trades.length) html += '<div style="text-align:center;padding:20px;color:#aaa;">Нет предложений</div>';
        else trades.forEach(function(trade) {
            var isOwn = trade.sellerId === userId, hasSkin = playerData.ownedSkins.indexOf(trade.skinId) !== -1;
            var cur = trade.currency || 'wood', curIcon = cur === 'wood' ? '🌲' : cur === 'crystals' ? '💎' : '⭐';
            html += '<div class="trade-item"><div class="trade-header"><div><span class="trade-seller-name">' + escapeHtml(trade.sellerName) + '</span><br><span class="trade-seller-id">ID: ' + trade.sellerId + '</span></div><span class="trade-price">' + formatNumber(trade.price) + ' ' + curIcon + '</span></div><div class="trade-tree">' + (trade.skinEmoji || '🎄') + ' ' + trade.skinName + '</div>';
            if (isOwn) html += '<button class="trade-btn cancel" data-act="cancel" data-tid="' + trade.id + '">❌ Отменить</button>';
            else if (hasSkin) html += '<button class="trade-btn" disabled>Уже есть</button>';
            else html += '<button class="trade-btn buy" data-act="buy" data-tid="' + trade.id + '" data-cur="' + cur + '" data-price="' + trade.price + '">💰 Купить</button>';
            html += '</div>';
        });
        var bg = showPopup('💱 Торги', html);
        document.getElementById('btnCopyId').addEventListener('click', function() { navigator.clipboard.writeText(userId).then(function() { alert('✅ Скопировано'); }); });
        bg.querySelector('#btnCreate').addEventListener('click', function() {
            var sid = bg.querySelector('#trSkin').value, price = parseInt(bg.querySelector('#trPrice').value), cur = bg.querySelector('#trCur').value;
            if (!sid) { alert('Выберите скин'); return; } if (!price || price < 1) { alert('Укажите цену'); return; }
            var skin = treeSkins.find(function(s) { return s.id === sid; });
            fetch(API_URL + '/trades/create', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sellerId: userId, sellerName: userName, skinId: sid, price: price, currency: cur, skinName: skin ? skin.name : 'Скин', skinEmoji: skin ? (skin.emoji || '🎄') : '🎄' }) })
            .then(function(r) { return r.json(); }).then(function(res) {
                if (res.success) { playerData.ownedSkins = playerData.ownedSkins.filter(function(s) { return s !== sid; }); if (playerData.activeSkin === sid) playerData.activeSkin = 'default'; saveData(); updateUI(); bg.remove(); showTrade(); }
                else alert('❌ Ошибка');
            });
        });
        bg.querySelectorAll('[data-act]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var act = this.dataset.act, tid = this.dataset.tid;
                if (act === 'cancel') {
                    if (!confirm('Отменить?')) return;
                    fetch(API_URL + '/trades/cancel', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ trade_id: tid, user_id: userId }) })
                    .then(function(r) { return r.json(); }).then(function(res) { if (res.success && res.skinId) { playerData.ownedSkins.push(res.skinId); saveData(); updateUI(); } bg.remove(); showTrade(); });
                } else if (act === 'buy') {
                    var cur = this.dataset.cur, price = parseInt(this.dataset.price);
                    if (cur === 'stars') {
                        if (!confirm('Купить за ' + price + ' ⭐?')) return;
                        if (typeof tg.sendStarInvoice === 'function') {
                            tg.sendStarInvoice({ title: 'Покупка скина', description: 'Скин в Woodcutter', payload: 'trade_' + tid + '_' + userId, currency: 'XTR', prices: [{ amount: price, label: 'Скин' }] }, function(status) {
                                if (status === 'paid') completeBuy(tid, 'stars', bg); else alert('❌ Оплата не прошла');
                            });
                        } else alert('❌ Нужен бот Telegram');
                    } else {
                        if (!confirm('Купить за ' + price + ' ' + (cur === 'wood' ? '🌲' : '💎') + '?')) return;
                        completeBuy(tid, 'direct', bg);
                    }
                }
            });
        });
        function completeBuy(tid, ptype, bg) {
            fetch(API_URL + '/trades/buy', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ trade_id: tid, buyer_id: userId, payment_type: ptype }) })
            .then(function(r) { return r.json(); }).then(function(res) { if (res.success) { playerData.ownedSkins.push(res.skinId); saveData(); updateUI(); bg.remove(); showTrade(); alert('✅ Куплено!'); } else alert('❌ Ошибка'); });
        }
    });
}

function passiveIncome() { if (playerData.autoWood > 0) { playerData.wood += playerData.autoWood; updateUI(); } }

document.getElementById('bs').addEventListener('click', showShop);
document.getElementById('bl').addEventListener('click', function() {
    fetch(API_URL + '/leaderboard').then(function(r) { return r.json(); }).then(function(data) {
        var players = data.success ? data.players : [];
        var html = '<table class="lb-table"><thead><tr><th>#</th><th>Игрок</th><th>🌲</th><th>💎</th></tr></thead><tbody>';
        if (!players.length) html += '<tr><td colspan="4" style="text-align:center;padding:20px;">Пусто</td></tr>';
        else players.forEach(function(p, i) { html += '<tr' + ((p.user_id || p.userId) === userId ? ' class="lb-me"' : '') + '><td>' + (i + 1) + '</td><td>' + escapeHtml(p.name) + '</td><td>' + formatNumber(p.wood) + '</td><td>' + formatNumber(p.crystals) + '</td></tr>'; });
        html += '</tbody></table>';
        showPopup('🏆 Рейтинг', html);
    });
});
document.getElementById('bt').addEventListener('click', showSkins);
document.getElementById('btr').addEventListener('click', showTrade);
document.getElementById('tc').addEventListener('click', chop);
document.addEventListener('keydown', function(e) { if (e.code === 'Space') { e.preventDefault(); chop(); } });

updateUI();
setInterval(passiveIncome, 1000);
setInterval(saveData, 10000);
console.log('✅ Woodcutter готов');
</script>
