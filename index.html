<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Woodcutter | Telegram Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #1a1a2e; --panel: #16213e; --accent: #e2a03f;
            --text: #eee; --text-secondary: #aaa; --border: #2a2a4a;
            --gold: #ffd700;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:-apple-system,sans-serif; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
        .app-container { width:100%; height:100%; display:flex; justify-content:center; align-items:center; background:var(--bg); }
        .phone-frame { width:100%; height:100%; max-width:430px; background:var(--bg); display:flex; flex-direction:column; position:relative; overflow:hidden; }
        .header { background:var(--panel); padding:12px 16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border); flex-shrink:0; }
        .header .avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#e2a03f,#c47f2a); display:flex; align-items:center; justify-content:center; font-size:20px; overflow:hidden; background-size:cover; }
        .header .title { font-weight:600; color:var(--text); font-size:15px; }
        .header .subtitle { font-size:11px; color:var(--text-secondary); }
        .game-area { flex:1; display:flex; flex-direction:column; padding:10px; overflow-y:auto; gap:8px; -webkit-overflow-scrolling:touch; padding-bottom:20px; }
        .resources { display:flex; gap:8px; }
        .resource-card { flex:1; background:var(--panel); border-radius:12px; padding:10px 14px; display:flex; align-items:center; gap:10px; border:1px solid var(--border); }
        .resource-icon { font-size:22px; }
        .resource-info { display:flex; flex-direction:column; gap:2px; }
        .resource-value { font-size:18px; font-weight:700; color:var(--text); line-height:1; }
        .resource-label { font-size:10px; color:var(--text-secondary); }
        .tree-scene { background:var(--panel); border-radius:16px; padding:12px; display:flex; flex-direction:column; align-items:center; gap:8px; border:1px solid var(--border); }
        .tree-container { position:relative; width:100%; max-width:240px; aspect-ratio:3/4; cursor:pointer; }
        .tree-container:active { transform:scale(0.96); }
        .tree-container.shake { animation:shake 0.4s ease; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-4px)} 40%{transform:translateX(4px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }
        .tree-fall { animation:fall 0.6s ease forwards; }
        @keyframes fall { 0%{transform:rotate(0);opacity:1} 100%{transform:rotate(80deg) translateX(60px);opacity:0} }
        .tree-svg { width:100%; height:100%; pointer-events:none; }
        .axe-emoji { position:absolute; right:8%; top:42%; font-size:clamp(32px,10vw,45px); pointer-events:none; z-index:6; filter:drop-shadow(2px 3px 3px rgba(0,0,0,0.4)); }
        .axe-emoji.swing { animation:axeSwing 0.3s ease; }
        @keyframes axeSwing { 0%{transform:rotate(-40deg)} 50%{transform:rotate(20deg)} 100%{transform:rotate(0deg)} }
        .tree-level-badge { position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.8); color:var(--gold); padding:3px 8px; border-radius:12px; font-size:12px; font-weight:700; border:1px solid var(--gold); }
        .hp-bar-container { width:100%; background:#2a2a3a; border-radius:8px; height:14px; overflow:hidden; border:1px solid var(--border); }
        .hp-bar { height:100%; border-radius:8px; transition:width 0.3s ease; }
        .hp-bar.high { background:linear-gradient(90deg,#4caf84,#81c784); }
        .hp-bar.medium { background:linear-gradient(90deg,#f39c12,#e67e22); }
        .hp-bar.low { background:linear-gradient(90deg,#e74c3c,#c0392b); }
        .hp-text { font-size:12px; color:var(--text); text-align:center; font-weight:600; }
        .combo-display { color:var(--text-secondary); font-size:11px; text-align:center; min-height:16px; }
        .combo-fire { color:#ff6b35; }
        .combo-timer-bar { width:100%; height:4px; background:#2a2a3a; border-radius:2px; overflow:hidden; margin-top:4px; }
        .combo-timer-fill { height:100%; background:var(--accent); border-radius:2px; width:100%; transition:width 0.1s linear; }
        .float-text { position:absolute; font-weight:700; pointer-events:none; animation:floatUp 1s ease-out forwards; z-index:20; font-size:16px; }
        @keyframes floatUp { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-50px)} }
        .btn-row { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
        .btn { padding:12px 8px; border-radius:12px; border:none; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:4px; min-height:44px; }
        .btn:active { transform:scale(0.95); }
        .btn-shop { background:var(--panel); color:var(--text); border:1px solid var(--border); }
        .btn-leaderboard { background:linear-gradient(135deg,#ffd700,#ffaa00); color:#000; }
        .btn-trees { background:linear-gradient(135deg,#4caf50,#2d6b2d); color:#fff; }
        .btn-trade { background:linear-gradient(135deg,#a78bfa,#7c3aed); color:#fff; }
        .passive-info { text-align:center; color:var(--text-secondary); font-size:11px; }
    </style>
</head>
<body>

<div class="app-container">
<div class="phone-frame">
    <div class="header">
        <div class="avatar" id="headerAvatar">🪓</div>
        <div><div class="title">Woodcutter</div><div class="subtitle" id="playerNameDisplay">...</div></div>
    </div>
    <div class="game-area">
        <div class="resources">
            <div class="resource-card"><span class="resource-icon">🌲</span><div class="resource-info"><span class="resource-value" id="woodCount">0</span><span class="resource-label">Древесина</span></div></div>
            <div class="resource-card"><span class="resource-icon">💎</span><div class="resource-info"><span class="resource-value" id="crystalCount">0</span><span class="resource-label">Кристаллы</span></div></div>
        </div>
        <div class="tree-scene">
            <div class="tree-container" id="treeContainer">
                <div class="tree-level-badge" id="treeLevelBadge">🌲 Ур. 1</div>
                <div class="axe-emoji" id="axeEmoji">🪓</div>
                <svg class="tree-svg" viewBox="0 0 260 360"><ellipse cx="130" cy="330" rx="110" ry="20" fill="#3d2b1f" opacity="0.6"/><rect x="115" y="180" width="30" height="152" rx="7" fill="#6b4226" id="trunk"/><ellipse cx="130" cy="130" rx="85" ry="75" fill="#3a7d3a" id="crown1"/><ellipse cx="130" cy="85" rx="70" ry="65" fill="#4caf50" id="crown2"/><ellipse cx="130" cy="45" rx="55" ry="55" fill="#66bb6a" id="crown3"/></svg>
                <div id="floatTextContainer" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></div>
            </div>
            <div class="hp-bar-container"><div class="hp-bar high" id="hpBar" style="width:100%;"></div></div>
            <div class="hp-text" id="hpText">15 / 15 HP</div>
            <div class="combo-display" id="comboDisplay">Нажимай на дерево! 🪓</div>
            <div class="combo-timer-bar" id="comboTimerBar" style="display:none;"><div class="combo-timer-fill" id="comboTimerFill" style="width:100%;"></div></div>
        </div>
        <div class="btn-row">
            <button class="btn btn-shop" id="btnShop">🏪 Магазин</button>
            <button class="btn btn-leaderboard" id="btnLeaderboard">🏆 Рейтинг</button>
            <button class="btn btn-trees" id="btnSkins">🎄 Скины</button>
            <button class="btn btn-trade" id="btnTrade">💱 Торги</button>
        </div>
        <div class="passive-info" id="passiveInfo"></div>
    </div>
</div>
</div>

<script>
const API_URL = 'https://delay.pythonanywhere.com/api';
const tg = window.Telegram.WebApp;
tg.expand(); tg.ready();

const tgUser = tg.initDataUnsafe?.user;
const userId = tgUser ? 'WC' + String(tgUser.id).slice(-6).padStart(6,'0') : 'WC' + Math.random().toString(36).substr(2,6).toUpperCase();
const playerName = tgUser ? (tgUser.first_name + (tgUser.last_name?' '+tgUser.last_name:'')) : 'Игрок';
const STORAGE_KEY = 'wc_' + userId;

console.log('Woodcutter | ID:', userId);

if(tgUser?.photo_url) {
    document.getElementById('headerAvatar').style.backgroundImage = `url(${tgUser.photo_url})`;
    document.getElementById('headerAvatar').textContent = '';
}

// API
async function api(endpoint, method='GET', body=null) {
    try {
        const opts = { method, headers: {'Content-Type':'application/json'} };
        if(body) opts.body = JSON.stringify(body);
        const res = await fetch(API_URL + endpoint, opts);
        return await res.json();
    } catch(e) { return {success:false}; }
}

async function sendLB() { await api('/leaderboard/update','POST',{user_id:userId,name:playerName,wood:player.wood,crystals:player.crystals,treeLevel:player.treeLevel,totalTrees:player.totalTrees}); }
async function loadLB() { const r=await api('/leaderboard'); return r.success?r.players:[]; }

// Скины
const treeSkins = [
    { id:'default', name:'Обычное', emoji:'🌳', colors:['#3a7d3a','#4caf50','#66bb6a'], price:0, cur:'free' },
    { id:'autumn', name:'Осеннее', emoji:'🍂', colors:['#c47f2a','#d4943a','#e2a03f'], price:500, cur:'crystals' },
    { id:'cherry', name:'Сакура', emoji:'🌸', colors:['#ff9ec4','#ffbdd4','#ffd1e4'], price:800, cur:'crystals' },
    { id:'crystal', name:'Кристальное', emoji:'💎', colors:['#a78bfa','#c4b5fd','#ddd6fe'], price:1200, cur:'crystals' },
    { id:'golden', name:'Золотое', emoji:'✨', colors:['#d4a017','#e6c22a','#f0d840'], price:2000, cur:'crystals' },
    { id:'inferno', name:'Огненное', emoji:'🔥', colors:['#cc3300','#e64d00','#ff6600'], price:3500, cur:'crystals' },
    { id:'ocean', name:'Океанское', emoji:'🌊', colors:['#0066cc','#0088e6','#00aaff'], price:10, cur:'stars' },
    { id:'void', name:'Бездны', emoji:'🕳️', colors:['#1a0033','#2d004d','#400066'], price:25, cur:'stars' },
    { id:'rainbow', name:'Радужное', emoji:'🌈', colors:['#ff0000','#ff7700','#ffff00'], price:50, cur:'stars' },
];

// Игрок
let player = { name:playerName, userId, wood:0, crystals:0, stars:0, axePower:1, crystalBonus:1, autoWood:0, critChance:0, critMultiplier:2.0, crystalToWoodRate:0, comboBonus:0, combo:0, comboMultiplier:1.0, treeHP:15, maxTreeHP:15, totalTrees:0, treeLevel:1, activeSkin:'default', ownedSkins:['default'], upgrades:{} };

try { const s=localStorage.getItem(STORAGE_KEY); if(s) Object.assign(player, JSON.parse(s)); } catch(e) {}
player.name=playerName; player.userId=userId;
if(!player.maxTreeHP||player.maxTreeHP<10) { player.maxTreeHP=15; player.treeHP=15; }
if(!player.ownedSkins||!player.ownedSkins.length) player.ownedSkins=['default'];
if(!player.activeSkin) player.activeSkin='default';
if(!player.upgrades) player.upgrades={};

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(player)); }

function calcHP(lv) { const bMin=15,bMax=30; let m; if(lv<=10)m=1+(lv-1)*0.5; else if(lv<=50)m=5.5+(lv-10)*0.3; else if(lv<=200)m=17.5+(lv-50)*0.2; else if(lv<=1000)m=47.5+(lv-200)*0.1; else if(lv<=5000)m=127.5+(lv-1000)*0.05; else m=327.5+(lv-5000)*0.02; return Math.floor(rand(bMin*m+(lv-1)*5,bMax*m+(lv-1)*5)); }

const shopItems = [
    { id:'axe', name:'🪓 Топор получше', desc:'+1 к силе', base:10, mult:1.5, cur:'wood', cost(){return Math.floor(this.base*Math.pow(this.mult,player.upgrades[this.id]||0));}, eff(){player.axePower++;player.upgrades[this.id]=(player.upgrades[this.id]||0)+1;} },
    { id:'strength', name:'💪 Силашка', desc:'+2 к силе', base:25, mult:1.6, cur:'wood', cost(){return Math.floor(this.base*Math.pow(this.mult,player.upgrades[this.id]||0));}, eff(){player.axePower+=2;player.upgrades[this.id]=(player.upgrades[this.id]||0)+1;} },
    { id:'auto1', name:'🌱 Саженец', desc:'+1/с авто', base:50, mult:1.4, cur:'wood', cost(){return Math.floor(this.base*Math.pow(this.mult,player.upgrades[this.id]||0));}, eff(){player.autoWood++;player.upgrades[this.id]=(player.upgrades[this.id]||0)+1;} },
    { id:'crystal1', name:'💎 Кристальный глаз', desc:'+1💎 за сруб', base:5, mult:2.0, cur:'crystals', cost(){return Math.floor(this.base*Math.pow(this.mult,player.upgrades[this.id]||0));}, eff(){player.crystalBonus++;player.upgrades[this.id]=(player.upgrades[this.id]||0)+1;} },
];

function updateUI() {
    document.getElementById('woodCount').textContent = fmt(player.wood);
    document.getElementById('crystalCount').textContent = fmt(player.crystals);
    const hpPct = Math.max(0, (player.treeHP/Math.max(1,player.maxTreeHP))*100);
    const hpb = document.getElementById('hpBar'); hpb.style.width = hpPct+'%';
    hpb.className = 'hp-bar ' + (hpPct>60?'high':hpPct>30?'medium':'low');
    document.getElementById('hpText').textContent = `${fmt(Math.max(0,player.treeHP))} / ${fmt(player.maxTreeHP)} HP`;
    document.getElementById('treeLevelBadge').textContent = `🌲 Ур. ${player.treeLevel}`;
    document.getElementById('playerNameDisplay').textContent = player.name;
    document.getElementById('comboDisplay').innerHTML = player.combo>1 ? `<span class="combo-fire">🔥 Комбо x${player.combo}</span>` : 'Нажимай на дерево! 🪓';
    document.getElementById('passiveInfo').textContent = player.autoWood>0?`⏳ +${player.autoWood} 🌲/сек`:'';
    const skin = treeSkins.find(s=>s.id===player.activeSkin)||treeSkins[0];
    const colors = hpPct>60?skin.colors:(hpPct>30?['#e67e22','#f39c12','#f1c40f']:['#c0392b','#e74c3c','#ff6b6b']);
    document.getElementById('crown1').setAttribute('fill',colors[0]);
    document.getElementById('crown2').setAttribute('fill',colors[1]);
    document.getElementById('crown3').setAttribute('fill',colors[2]);
}

function fmt(n) { return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':Math.floor(n).toString(); }
function rand(min,max) { return Math.random()*(max-min)+min; }
function esc(t) { const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

// Комбо
const COMBO_TIMEOUT = 5000;
let comboTimer = null;
function resetCombo() {
    if(comboTimer) clearTimeout(comboTimer);
    const bar = document.getElementById('comboTimerBar'), fill = document.getElementById('comboTimerFill');
    if(player.combo > 0) {
        bar.style.display = 'block'; fill.style.transition = 'none'; fill.style.width = '100%';
        requestAnimationFrame(() => { fill.style.transition = `width ${COMBO_TIMEOUT}ms linear`; fill.style.width = '0%'; });
        comboTimer = setTimeout(() => { player.combo = 0; player.comboMultiplier = 1.0; bar.style.display = 'none'; fill.style.transition = 'none'; fill.style.width = '100%'; updateUI(); }, COMBO_TIMEOUT);
    } else { bar.style.display = 'none'; }
}

const axeEmoji=document.getElementById('axeEmoji'), treeContainer=document.getElementById('treeContainer'), floatContainer=document.getElementById('floatTextContainer');
function animAxe(){axeEmoji.classList.remove('swing');void axeEmoji.offsetWidth;axeEmoji.classList.add('swing');}
function animShake(){treeContainer.classList.add('shake');setTimeout(()=>treeContainer.classList.remove('shake'),400);}
function animFall(cb){treeContainer.classList.add('tree-fall');setTimeout(()=>{treeContainer.classList.remove('tree-fall');if(cb)cb();},600);}
function floatText(text,color,x,y){const el=document.createElement('div');el.className='float-text';el.textContent=text;el.style.color=color;el.style.left=x+'px';el.style.top=y+'px';floatContainer.appendChild(el);setTimeout(()=>el.remove(),1000);}

function chopTree() {
    if(player.treeHP<=0) return;
    let dmg=player.axePower; const crit=Math.random()*100<player.critChance;
    if(crit) dmg=Math.floor(dmg*player.critMultiplier);
    player.combo=Math.min(50,player.combo+1); player.comboMultiplier=1.0+player.combo*(0.01+player.comboBonus/100);
    dmg=Math.max(1,Math.floor(dmg*player.comboMultiplier)); player.treeHP-=dmg; player.wood+=dmg;
    animAxe(); resetCombo();
    const r=treeContainer.getBoundingClientRect();
    floatText((crit?'💥+':'+')+fmt(dmg)+'🌲',crit?'#ff6b6b':'#e2a03f',r.width/2,r.height*0.5);
    if(player.treeHP<=0){
        player.crystals+=player.crystalBonus;
        if(player.crystalToWoodRate>0&&player.crystals>0){const conv=Math.floor(player.crystals*player.crystalToWoodRate);player.wood+=conv;floatText('🔄+'+fmt(conv)+'🌲','#4caf84',r.width/2,r.height*0.5+20);}
        player.totalTrees++; player.treeLevel=Math.min(Math.floor(player.totalTrees/2)+1,9999);
        animFall(()=>{player.maxTreeHP=calcHP(player.treeLevel);player.treeHP=player.maxTreeHP;updateUI();});
        floatText('🎉+'+player.crystalBonus+'💎','#a78bfa',r.width/2,r.height*0.5-25);
    } else animShake();
    updateUI(); save(); sendLB();
}

function popup(title, content, onClose) {
    const bg = document.createElement('div');
    bg.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);z-index:9999;display:flex;align-items:flex-end;justify-content:center;';
    bg.innerHTML = `<div style="background:#16213e;border-radius:16px 16px 0 0;width:100%;max-width:430px;max-height:85vh;overflow-y:auto;padding:16px 12px 30px;border:1px solid #2a2a4a;"><h3 style="color:#eee;font-size:18px;margin-bottom:12px;text-align:center;">${title}</h3>${content}<button style="width:100%;padding:14px;border-radius:12px;border:1px solid #2a2a4a;background:#16213e;color:#eee;font-size:15px;font-weight:600;margin-top:8px;">Закрыть</button></div>`;
    bg.querySelector('button').addEventListener('click', ()=>{ bg.remove(); if(onClose) onClose(); });
    bg.addEventListener('click', function(e){ if(e.target===bg) { bg.remove(); if(onClose) onClose(); } });
    document.body.appendChild(bg);
    return bg;
}

function showShop() {
    let html = '';
    let cat = '';
    shopItems.forEach(item=>{
        if(!cat){ html+=`<div style="color:#e2a03f;font-size:13px;font-weight:700;margin:12px 0 6px;padding-bottom:4px;border-bottom:1px solid #2a2a4a;">Улучшения</div>`; cat='done'; }
        const cost=item.cost(), afford=item.cur==='wood'?player.wood>=cost:player.crystals>=cost;
        html+=`<div style="background:#1e2a3a;border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;border:1px solid #2a2a4a;gap:8px;"><div><span style="font-weight:600;color:#eee;font-size:14px;">${item.name}</span><br><span style="font-size:11px;color:#aaa;">${item.desc}</span>${(player.upgrades[item.id]||0)>0?`<br><span style="font-size:10px;color:#e2a03f;">Ур. ${player.upgrades[item.id]}</span>`:''}</div><button style="padding:8px 14px;border-radius:10px;border:none;font-weight:600;font-size:12px;background:${item.cur==='wood'?'#4caf84':'#a78bfa'};color:#fff;${!afford?'opacity:0.4;':''}" ${!afford?'disabled':''} data-id="${item.id}">${fmt(cost)} ${item.cur==='wood'?'🌲':'💎'}</button></div>`;
    });
    const bg = popup('🏪 Магазин', html);
    bg.querySelectorAll('button[data-id]').forEach(b=>b.addEventListener('click', function(){
        const item=shopItems.find(i=>i.id===this.dataset.id);
        if(!item)return;
        const cost=item.cost();
        if(item.cur==='wood'&&player.wood<cost)return;
        if(item.cur==='crystals'&&player.crystals<cost)return;
        if(item.cur==='wood')player.wood-=cost;else player.crystals-=cost;
        item.eff();updateUI();save();sendLB();
        bg.remove(); showShop();
    }));
}

function showSkins() {
    let html = '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">';
    treeSkins.forEach(skin=>{
        const owned=player.ownedSkins.includes(skin.id), active=player.activeSkin===skin.id;
        let priceHTML='';
        if(!owned){if(skin.cur==='free')priceHTML='<div style="font-size:10px;color:#e2a03f;margin-top:3px;">Бесплатно</div>';else if(skin.cur==='crystals')priceHTML=`<div style="font-size:10px;color:#e2a03f;margin-top:3px;">🔒 ${fmt(skin.price)} 💎</div>`;else priceHTML=`<div style="font-size:10px;color:#ffd700;margin-top:3px;">⭐ ${skin.price} звёзд</div>`;}
        html+=`<div style="background:#1e2a3a;border-radius:12px;padding:10px;text-align:center;border:2px solid ${active?'#ffd700':'#2a2a4a'};cursor:pointer;" data-skin="${skin.id}"><span style="font-size:32px;">${skin.emoji}</span><div style="font-size:11px;color:#eee;font-weight:600;">${skin.name}</div>${priceHTML}${active?'<div style="color:#ffd700;font-size:10px;">✅</div>':''}</div>`;
    });
    html += '</div>';
    const bg = popup('🎄 Скины', html);
    bg.querySelectorAll('[data-skin]').forEach(el=>el.addEventListener('click', function(){
        const skinId = this.dataset.skin;
        const skin = treeSkins.find(s=>s.id===skinId);
        const owned = player.ownedSkins.includes(skinId);
        if(owned){player.activeSkin=skinId;updateUI();save();bg.remove();showSkins();}
        else if(skin.cur==='free'){player.ownedSkins.push(skinId);player.activeSkin=skinId;updateUI();save();bg.remove();showSkins();}
        else if(skin.cur==='crystals'){
            if(player.crystals>=skin.price){
                if(confirm(`Купить "${skin.name}" за ${skin.price}💎?`)){player.crystals-=skin.price;player.ownedSkins.push(skinId);player.activeSkin=skinId;updateUI();save();bg.remove();showSkins();}
            }else alert('Недостаточно кристаллов!');
        } else if(skin.cur==='stars'){
            if(typeof tg.openInvoice === 'function'){
                api('/create-star-invoice','POST',{user_id:userId,skin_id:skin.id,skin_name:skin.name,price:skin.price}).then(result=>{
                    if(result.success && result.invoice_link){tg.openInvoice(result.invoice_link,(status)=>{if(status==='paid'){player.ownedSkins.push(skinId);player.activeSkin=skinId;updateUI();save();bg.remove();showSkins();}});}
                    else alert('Ошибка создания счёта');
                });
            } else alert('Откройте игру через бота Telegram');
        }
    }));
}

async function showLB() {
    const lb = await loadLB();
    let html = '<table style="width:100%;border-collapse:collapse;"><thead><tr style="color:#aaa;font-size:10px;"><th style="padding:8px 6px;text-align:left;">#</th><th style="padding:8px 6px;text-align:left;">Игрок</th><th style="padding:8px 6px;text-align:left;">🌲</th><th style="padding:8px 6px;text-align:left;">💎</th><th style="padding:8px 6px;text-align:left;">🎄</th></tr></thead><tbody>';
    if(!lb.length){html+='<tr><td colspan="5" style="text-align:center;padding:20px;color:#aaa;">Игроков пока нет</td></tr>';}
    else {lb.forEach((e,i)=>{const r=i+1;let rc='',ri=r;if(r===1){rc='color:#ffd700;';ri='🥇';}else if(r===2){rc='color:#c0c0c0;';ri='🥈';}else if(r===3){rc='color:#cd7f32;';ri='🥉';}html+=`<tr style="${(e.user_id||e.userId)===player.userId?'background:rgba(226,160,63,0.15);':''}"><td style="padding:8px 6px;font-weight:700;font-size:14px;text-align:center;${rc}">${ri}</td><td style="padding:8px 6px;color:#eee;font-size:12px;">${esc(e.name)}</td><td style="padding:8px 6px;color:#eee;font-size:12px;">${fmt(e.wood)}</td><td style="padding:8px 6px;color:#eee;font-size:12px;">${fmt(e.crystals)}</td><td style="padding:8px 6px;color:#eee;font-size:12px;">${e.treeLevel||1}</td></tr>`;});}
    html+='</tbody></table>';
    popup('🏆 Рейтинг', html);
}

function passiveIncome(){if(player.autoWood>0){player.wood+=player.autoWood;updateUI();}}

document.getElementById('btnShop').addEventListener('click', showShop);
document.getElementById('btnLeaderboard').addEventListener('click', showLB);
document.getElementById('btnSkins').addEventListener('click', showSkins);
document.getElementById('btnTrade').addEventListener('click', ()=>alert('💱 Торги временно отключены'));
treeContainer.addEventListener('click', chopTree);
document.addEventListener('keydown', e=>{if(e.code==='Space'){e.preventDefault();chopTree();}});

updateUI();
sendLB();
setInterval(passiveIncome,1000);
setInterval(save,10000);
setInterval(sendLB,30000);
</script>
</body>
</html>
